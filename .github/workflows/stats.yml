name: Compteur de visites
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: Envoyer un signal de test à ntfy avant de lire
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signal de test (facultatif)
        if: ${{ inputs.selftest }}
        run: |
          curl -fsS -H "Title: Test Klinik" -d "Test du compteur depuis GitHub" https://ntfy.sh/klinik-z5u9y4wxb9esxtdy
      - name: Lire les signaux et mettre à jour les chiffres
        run: node tools/collect-stats.mjs
      - name: Enregistrer
        run: |
          git config user.name "klinik-bot"
          git config user.email "klinik-bot@users.noreply.github.com"
          git add -A s-*
          if git diff --cached --quiet; then echo "Rien de nouveau"; else
            git commit -m "Statistiques" && git pull --rebase -q && git push
          fi
