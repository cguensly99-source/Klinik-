","summary":"La séquence correcte (auscultation avant palpation) et les signes qui orientent vers l’urgence chirurgicale.","keywords":["examen abdominal","palpation","défense","contracture","Murphy","McBurney","Blumberg","ascite","hépatomégalie","bruits hydro-aériques"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"collegeIds":["cdu-hge"],"rm":4,"sc":8,"locked":true},{"id":"abdo-douleur-aigue","system":"abdo","title":"Douleur abdominale aiguë : orientation par localisation","summary":"Raisonner par quadrant, repérer les urgences chirurgicales et vasculaires, ne pas oublier les causes extra-abdominales.","keywords":["douleur abdominale","appendicite","cholécystite","pancréatite","occlusion","colique néphrétique","diverticulite","grossesse extra-utérine","perforation","péritonite"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"collegeIds":["cdu-hge"],"rm":3,"sc":5,"locked":true},{"id":"general-signes-vitaux","system":"general","title":"Signes vitaux et scores d’alerte","summary":"Prendre, interpréter et noter les constantes ; repérer un patient qui se dégrade (NEWS2, qSOFA).","keywords":["constantes","signes vitaux","NEWS2","qSOFA","TA","fréquence cardiaque","SpO2","température","dégradation"],"free":true,"updatedAt":"2026-10-05","reviewed":false,"sections":[{"heading":"Les sept constantes à relever","kind":"steps","items":["Fréquence respiratoire : compter pendant 60 secondes, sans prévenir le patient (il modifierait sa respiration). C’est le signe vital le plus souvent négligé et l’un des plus précoces dans la dégradation.","Saturation en oxygène (SpO2) : doigt propre, chaud, sans vernis foncé ; noter si le patient est sous air ambiant ou sous oxygène (et le débit).","Tension artérielle : brassard adapté au bras, patient au repos depuis quelques minutes, bras au niveau du cœur. Mesurer aux deux bras lors d’une première évaluation ou si une dissection aortique est suspectée.","Fréquence cardiaque : palper le pouls radial 30 à 60 secondes ; noter fréquence, régularité, amplitude. Un pouls irrégulier nécessite un ECG.","Température : noter la voie de mesure ; une fièvre est habituellement définie par une température ≥ 38,0 °C.","État de conscience : alerte, réagit à la voix, réagit à la douleur, ne réagit pas (échelle AVPU) ; toute confusion nouvelle est un signe de gravité.","Glycémie capillaire : à faire devant toute altération de la conscience ou tout déficit neurologique brutal."]},{"heading":"Valeurs de repos habituelles chez l’adulte (repères, pas des normes absolues)","kind":"signs","items":["Fréquence respiratoire : environ 12 à 20 par minute.","Fréquence cardiaque : environ 60 à 100 par minute au repos.","SpO2 : ≥ 94 à 96 % sous air ambiant chez un adulte sans maladie pulmonaire chronique.","Chez un patient à risque d’insuffisance respiratoire hypercapnique (par exemple BPCO sévère), la cible d’oxygénothérapie recommandée est plus basse : 88 à 92 %.","Tension artérielle systolique : une valeur ≤ 100 mmHg avec signes de mauvaise perfusion doit alerter, même si le patient « parle bien »."]},{"heading":"Signes qui doivent faire appeler à l’aide immédiatement","kind":"redflags","items":["Fréquence respiratoire ≥ 25 par minute, ou ≤ 8, ou épuisement respiratoire.","SpO2 basse ou en baisse malgré l’oxygène ; cyanose.","Tension artérielle systolique ≤ 90 mmHg, ou chute importante par rapport à la valeur habituelle du patient.","Fréquence cardiaque > 130 ou ≤ 40 par minute, surtout avec symptômes.","Confusion nouvelle, somnolence, agitation inhabituelle.","Extrémités froides et marbrées, temps de recoloration cutanée allongé, urines très rares : signes de choc.","« Le patient m’inquiète » : l’inquiétude d’une infirmière ou d’un étudiant expérimenté est un signal valable, même si les chiffres semblent corrects."]},{"heading":"Scores d’alerte : à quoi ils servent","kind":"text","items":["NEWS2 (Royal College of Physicians, 2017) additionne des points pour la fréquence respiratoire, la SpO2, l’oxygène, la tension systolique, la fréquence cardiaque, la conscience et la température. Plus le score est élevé, plus la réponse doit être rapide et expérimentée ; un seul paramètre extrême suffit à déclencher une alerte. Il se calcule avec une grille, à garder à portée de main.","qSOFA est un repère rapide en dehors de la réanimation : fréquence respiratoire ≥ 22, altération de la conscience, tension systolique ≤ 100 mmHg. Deux critères ou plus indiquent un risque accru d’évolution défavorable en cas d’infection suspectée.","Les recommandations Surviving Sepsis Campaign 2021 déconseillent d’utiliser le qSOFA seul comme outil de dépistage du sepsis, car il est moins sensible que SIRS, NEWS ou MEWS. Un qSOFA négatif ne rassure donc pas : en cas de doute, faire une évaluation complète."]},{"heading":"Pièges fréquents","kind":"pearls","items":["Une tachycardie ou une tachypnée inexpliquée précède souvent l’hypotension : ne pas attendre que la tension chute.","Les bêta-bloquants, l’âge avancé et la grossesse peuvent masquer ou modifier la réponse du pouls.","Une SpO2 « normale » n’exclut pas une détresse : un patient qui compense par une respiration rapide peut garder une SpO2 correcte jusqu’à l’épuisement.","Toujours noter l’heure, la valeur et les conditions de mesure : une tendance sur plusieurs mesures vaut mieux qu’un chiffre isolé."]}],"references":[{"label":"Royal College of Physicians. National Early Warning Score (NEWS) 2. Londres, 2017.","url":"https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"},{"label":"Evans L, et al. Surviving Sepsis Campaign : International Guidelines for Management of Sepsis and Septic Shock 2021. Crit Care Med 2021.","url":"https://doi.org/10.1097/CCM.0000000000005337"},{"label":"Singer M, et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA 2016.","url":"https://doi.org/10.1001/jama.2016.0287"},{"label":"O’Driscoll BR, et al. BTS guideline for oxygen use in adults in healthcare and emergency settings. Thorax 2017.","url":"https://doi.org/10.1136/thoraxjnl-2016-209729"}],"rm":4,"sc":7},{"id":"general-fievre-sepsis","system":"general","title":"Fièvre et signes de gravité : penser au sepsis","summary":"Évaluer un patient fébrile : foyers à rechercher, signes de choc, maladies tropicales à ne pas manquer.","keywords":["fièvre","sepsis","choc septique","méningite","purpura","paludisme","dengue","typhoïde","leptospirose","tuberculose","foyer infectieux"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":4,"sc":6,"locked":true},{"id":"neuro-conscience-glasgow","system":"neuro","title":"Évaluation de la conscience : échelle de Glasgow","summary":"Calculer et noter le score de Glasgow (yeux, verbal, moteur), l’AVPU, et savoir quand c’est une urgence.","keywords":["Glasgow","GCS","coma","conscience","AVPU","pupilles","traumatisme crânien","confusion","glycémie"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"collegeIds":["cen"],"rm":3,"sc":6,"locked":true},{"id":"neuro-deficit-avc","system":"neuro","title":"Déficit neurologique brutal : reconnaître un AVC","summary":"BE-FAST, heure de début, glycémie, diagnostics différentiels et urgence de la prise en charge.","keywords":["AVC","accident vasculaire cérébral","BE-FAST","FAST","hémiplégie","aphasie","paralysie faciale","thrombolyse","NIHSS","hypoglycémie"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"collegeIds":["cen"],"rm":3,"sc":7,"locked":true},{"id":"respi-dyspnee","system":"respi","title":"Dyspnée : approche sémiologique","summary":"Évaluer la gravité, caractériser la dyspnée, orienter vers une cause cardiaque, pulmonaire ou autre.","keywords":["dyspnée","essoufflement","détresse respiratoire","mMRC","orthopnée","asthme","BPCO","embolie pulmonaire","pneumothorax","stridor"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"collegeIds":["cep"],"rm":3,"sc":6,"locked":true},{"id":"respi-examen","system":"respi","title":"Examen respiratoire et grands syndromes","summary":"Inspection, palpation, percussion, auscultation, puis reconnaître condensation, épanchement, pneumothorax et syndrome bronchique.","keywords":["examen pulmonaire","auscultation","crépitants","sibilants","souffle tubaire","vibrations vocales","matité","épanchement pleural","pneumothorax","condensation"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"collegeIds":["cep"],"rm":3,"sc":5,"locked":true},{"id":"cardio-hta","system":"cardio","title":"Hypertension artérielle : dépistage, bilan et complications","summary":"Mesurer correctement la tension, confirmer l’hypertension, évaluer son retentissement et reconnaître l’urgence hypertensive.","keywords":["hypertension artérielle","tension artérielle","HTA","MAPA","automesure","atteinte d’organe","hypertrophie ventriculaire","protéinurie","urgence hypertensive","inhibiteur calcique","diurétique","sel","grossesse"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":4,"sc":6,"locked":true},{"id":"cardio-syncope-palpitations","system":"cardio","title":"Syncope et palpitations","summary":"Distinguer la syncope bénigne de la syncope cardiaque, reconnaître les critères de gravité et conduire l’analyse d’un électrocardiogramme devant des palpitations.","keywords":["syncope","malaise","perte de connaissance","palpitations","hypotension orthostatique","syncope vagale","ECG","bloc auriculoventriculaire","tachycardie","Holter","mort subite","rythme cardiaque"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"cardio-fibrillation-atriale","system":"cardio","title":"Fibrillation atriale et troubles du rythme fréquents","summary":"Reconnaître la fibrillation atriale, évaluer le risque d’AVC avec le score CHA₂DS₂-VA, choisir entre contrôle de la fréquence et du rythme et savoir quand cardioverser en urgence.","keywords":["fibrillation atriale","arythmie complète","anticoagulation","CHA2DS2-VA","AVC","contrôle de la fréquence","cardioversion","flutter","tachycardie supraventriculaire","rétrécissement mitral","antivitamine K","AOD"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"cardio-sca","system":"cardio","title":"Syndrome coronarien aigu : diagnostic et prise en charge initiale","summary":"Reconnaître l’infarctus avec sus-décalage du segment ST, qui impose une reperfusion rapide, et distinguer les syndromes sans sus-décalage ; appliquer les premières mesures même sans troponine.","keywords":["syndrome coronarien aigu","infarctus","STEMI","sus-décalage du ST","troponine","ECG","angor instable","fibrinolyse","angioplastie","aspirine","douleur thoracique","bêtabloquant","statine"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"cardio-tvp-ep","system":"cardio","title":"Thrombose veineuse profonde et embolie pulmonaire","summary":"Estimer la probabilité clinique d’une thrombose ou d’une embolie pulmonaire, choisir les examens en fonction des moyens et débuter l’anticoagulation à temps.","keywords":["thrombose veineuse profonde","embolie pulmonaire","phlébite","D-dimères","score de Wells","échographie Doppler","angioscanner","anticoagulant","héparine","thrombolyse","immobilisation","prophylaxie","post-partum"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"cardio-valvulopathies","system":"cardio","title":"Valvulopathies et rhumatisme articulaire aigu","summary":"Reconnaître les souffles valvulaires par leur place dans le cycle, penser au rhumatisme articulaire aigu et à sa prévention, et savoir quand adresser le patient.","keywords":["valvulopathie","rhumatisme articulaire aigu","cardite rhumatismale","rétrécissement mitral","insuffisance mitrale","rétrécissement aortique","insuffisance aortique","souffle cardiaque","critères de Jones","pénicilline","échocardiographie"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":4,"sc":6,"locked":true},{"id":"cardio-endocardite","system":"cardio","title":"Endocardite infectieuse","summary":"Penser à l’endocardite devant une fièvre avec souffle chez un patient valvulaire, faire des hémocultures avant l’antibiotique et reconnaître les complications.","keywords":["endocardite","endocardite infectieuse","hémoculture","fièvre prolongée","souffle nouveau","végétation","critères de Duke","Osler","Janeway","Staphylococcus aureus","valve prothétique","toxicomanie intraveineuse"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec","cmit"],"rm":3,"sc":6,"locked":true},{"id":"endo-diabete-type-2","system":"endo","title":"Diabète de type 2 : diagnostic, bilan et suivi","summary":"Poser le diagnostic de diabète selon les seuils de glycémie ou d’HbA1c, dépister les complications et construire un suivi centré sur le mode de vie, la sécurité et le risque cardiovasculaire.","keywords":["diabète","diabète de type 2","glycémie à jeun","HbA1c","hyperglycémie provoquée","prédiabète","metformine","rétinopathie","néphropathie","pied diabétique","neuropathie","risque cardiovasculaire","éducation thérapeutique"],"free":true,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"sections":[{"heading":"Ce qu’il faut savoir","kind":"text","items":["Le diabète de type 2 résulte d’une insulinorésistance associée à un déficit relatif de sécrétion d’insuline. Il est favorisé par le surpoids, la sédentarité, l’âge et les antécédents familiaux. Il est fréquent en Haïti et souvent découvert tard, au stade de complications.","L’hyperglycémie chronique abîme les vaisseaux : œil, rein, nerfs, cœur, cerveau et membres inférieurs. L’objectif du suivi est de prévenir ces complications en contrôlant la glycémie, la tension, les lipides et le tabagisme.","Les Standards of Care de l’ADA 2026 et les recommandations de l’OMS donnent les critères actuels de diagnostic et de suivi."]},{"heading":"Signes à rechercher","kind":"signs","items":["Symptômes d’hyperglycémie : soif intense, besoin d’uriner fréquent (polyurie), amaigrissement, fatigue, vision floue, infections cutanées ou génitales répétées.","Souvent aucun symptôme : le dépistage chez les personnes à risque est donc essentiel (surpoids, hypertension, antécédent familial, diabète gestationnel, âge supérieur à 40 à 45 ans).","Complications déjà installées : plaie du pied qui ne guérit pas, perte de sensibilité, baisse de l’acuité visuelle, protéinurie, infarctus ou AVC.","Cherche l’acanthosis nigricans (peau épaissie et foncée du cou et des plis) et le syndrome métabolique associé."]},{"heading":"Diagnostic et bilan","kind":"steps","items":["Le diagnostic repose sur l’un de ces critères, confirmé par un second test sauf hyperglycémie évidente avec symptômes : glycémie à jeun de 7,0 mmol/L (1,26 g/L) ou plus, glycémie de 11,1 mmol/L (2,0 g/L) ou plus deux heures après une charge en glucose, HbA1c de 6,5 % ou plus, ou glycémie au hasard de 11,1 mmol/L ou plus avec symptômes.","Le prédiabète correspond à une glycémie à jeun de 5,6 à 6,9 mmol/L ou à une HbA1c de 5,7 à 6,4 % : conseille la perte de poids et l’activité physique.","À la découverte, demande créatininémie avec débit de filtration estimé, rapport albumine sur créatinine dans les urines, bilan lipidique, ECG, examen des pieds et fond d’œil.","Mesure le poids, la tension, le périmètre abdominal, et recherche une neuropathie (monofilament, vibration) et les pouls du pied.","Au suivi : glycémie capillaire selon le traitement, HbA1c tous les trois à six mois quand elle est disponible, tension à chaque visite, examen des pieds, dépistage annuel des complications.","Fixe un objectif individualisé : pour beaucoup d’adultes, une HbA1c inférieure à 7 % ; moins stricte chez la personne âgée ou fragile pour éviter l’hypoglycémie."]},{"heading":"Diagnostics différentiels","kind":"differential","items":["Diabète de type 1 : début brutal, amaigrissement, cétose, sujet jeune ; auto-anticorps positifs.","Diabète secondaire : corticoïdes, pancréatite chronique, hémochromatose, syndrome de Cushing.","Diabète gestationnel : découvert pendant la grossesse ; dépistage à 24-28 semaines.","Hyperglycémie de stress lors d’une infection ou d’un infarctus : à recontrôler après guérison.","Autres causes de soif et de polyurie : diabète insipide, hypercalcémie, insuffisance rénale."]},{"heading":"Signes de gravité : urgence","kind":"redflags","items":["Soif intense, vomissements, respiration ample, haleine acétonique, somnolence : acidocétose ou état hyperosmolaire.","Plaie du pied avec rougeur étendue, fièvre, odeur, nécrose : pied diabétique infecté, urgence.","Hypoglycémie sévère chez un patient traité.","Douleur thoracique, déficit neurologique, baisse brutale de la vision.","Glycémie très élevée avec déshydratation chez la personne âgée."]},{"heading":"Prise en charge : principes","kind":"text","items":["Le socle est l’éducation thérapeutique, l’alimentation équilibrée, l’activité physique et l’arrêt du tabac. Des changements de mode de vie bien soutenus améliorent beaucoup la glycémie.","La metformine reste souvent le premier médicament, sauf contre-indication (insuffisance rénale sévère). Chez les patients avec maladie cardiovasculaire, insuffisance cardiaque ou maladie rénale chronique, les standards actuels privilégient en plus des médicaments ayant un bénéfice démontré sur ces organes, selon leur disponibilité. L’insuline est utilisée en cas d’hyperglycémie sévère, de catabolisme ou d’échec des autres traitements.","Traite en parallèle la tension, les lipides et le risque cardiovasculaire ; apprends au patient à inspecter ses pieds chaque jour, à porter des chaussures adaptées et à reconnaître l’hypoglycémie. Suis les normes du MSPP pour les médicaments disponibles."]},{"heading":"Points clés","kind":"pearls","items":["Diagnostic : glycémie à jeun de 7,0 mmol/L ou plus, HbA1c de 6,5 % ou plus, ou glycémie à 2 heures de 11,1 mmol/L ou plus.","Dépiste les complications dès la découverte : œil, rein, pieds, cœur.","Un pied qui ne guérit pas est une urgence.","Individualise les objectifs et évite l’hypoglycémie.","Traite aussi la tension, les lipides et le tabac."]}],"references":[{"label":"American Diabetes Association. Standards of Care in Diabetes 2026 (communiqué de publication).","url":"https://diabetes.org/newsroom/press-releases/american-diabetes-association-releases-standards-care-diabetes-2026"},{"label":"OMS. Diabète : aide-mémoire (diabetes fact sheet).","url":"https://www.who.int/news-room/fact-sheets/detail/diabetes"},{"label":"OMS. Obésité et surpoids : aide-mémoire.","url":"https://www.who.int/news-room/fact-sheets/detail/obesity-and-overweight"},{"label":"MSPP (Haïti). Normes et protocoles nationaux : à consulter pour la conduite à tenir en vigueur dans le pays.","url":"https://www.mspp.gouv.ht/"}],"rm":4,"sc":6},{"id":"endo-acidocetose","system":"endo","title":"Diabète de type 1 et acidocétose diabétique","summary":"Reconnaître le diabète de type 1 et l’acidocétose, urgence métabolique, puis appliquer l’ordre des gestes : remplissage, potassium, insuline et recherche de la cause.","keywords":["diabète de type 1","acidocétose","cétose","insuline","déshydratation","respiration de Kussmaul","potassium","cétonurie","œdème cérébral","enfant","pompe","haleine acétonique","état hyperosmolaire"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"rm":3,"sc":6,"locked":true},{"id":"endo-hypoglycemie","system":"endo","title":"Hypoglycémie","summary":"Reconnaître et traiter une hypoglycémie, chercher sa cause (traitement du diabète, infection, alcool, foie, nutrition) et prévenir les récidives.","keywords":["hypoglycémie","triade de Whipple","glucagon","sulfamides","insuline","glycémie capillaire","malaise","sueurs","coma hypoglycémique","insulinome","paludisme","malnutrition","alcool"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"rm":3,"sc":6,"locked":true},{"id":"endo-hypothyroidie","system":"endo","title":"Hypothyroïdie","summary":"Reconnaître l’hypothyroïdie à ses signes discrets, la confirmer par la TSH et la T4 libre, et savoir traiter, surveiller et repérer le coma myxœdémateux.","keywords":["hypothyroïdie","TSH","T4 libre","lévothyroxine","thyroïdite de Hashimoto","carence en iode","goitre","myxœdème","fatigue","constipation","frilosité","coma myxœdémateux","hypothyroïdie congénitale"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"rm":4,"sc":6,"locked":true},{"id":"endo-hyperthyroidie-goitre","system":"endo","title":"Hyperthyroïdie, goitre et nodules thyroïdiens","summary":"Reconnaître le syndrome de thyrotoxicose, distinguer la maladie de Basedow du goitre nodulaire et des thyroïdites, et évaluer un nodule thyroïdien.","keywords":["hyperthyroïdie","thyrotoxicose","maladie de Basedow","goitre","nodule thyroïdien","TSH","exophtalmie","antithyroïdiens","iode radioactif","crise thyrotoxique","carence en iode","échographie thyroïdienne"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"rm":3,"sc":6,"locked":true},{"id":"endo-obesite-dyslipidemie","system":"endo","title":"Obésité, syndrome métabolique et dyslipidémies","summary":"Mesurer le risque cardiométabolique, classer l’excès de poids et les anomalies lipidiques, et proposer une prise en charge fondée sur le mode de vie puis sur le traitement.","keywords":["obésité","indice de masse corporelle","syndrome métabolique","dyslipidémie","cholestérol","LDL","triglycérides","statine","hypercholestérolémie familiale","tour de taille","risque cardiovasculaire","stéatose hépatique"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"rm":4,"sc":6,"locked":true},{"id":"endo-insuffisance-surrenale","system":"endo","title":"Insuffisance surrénale et corticothérapie prolongée","summary":"Reconnaître l’insuffisance surrénale et la crise surrénalienne, penser à la tuberculose et aux corticoïdes comme causes, et ne jamais arrêter brutalement une corticothérapie prolongée.","keywords":["insuffisance surrénale","maladie d’Addison","crise surrénalienne","cortisol","hydrocortisone","corticothérapie","sevrage","hyperpigmentation","hyponatrémie","hyperkaliémie","tuberculose surrénalienne","test au Synacthène"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["ceedmm"],"rm":3,"sc":6,"locked":true},{"id":"infect-paludisme","system":"infect","title":"Paludisme","summary":"Reconnaître un accès palustre, confirmer avant de traiter, repérer les signes de gravité et savoir que le paludisme grave est une urgence.","keywords":["paludisme","malaria","fièvre","Plasmodium falciparum","goutte épaisse","test de diagnostic rapide","TDR","splénomégalie","anémie","paludisme grave","artésunate","chloroquine","moustiquaire"],"free":true,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"sections":[{"heading":"Ce qu’il faut savoir","kind":"text","items":["Le paludisme est une infection des globules rouges par un parasite du genre Plasmodium, transmise par la piqûre d’un moustique anophèle femelle. Haïti est en zone d’endémie, et l’espèce en cause est surtout Plasmodium falciparum, la plus dangereuse.","Toute fièvre chez une personne vivant en zone d’endémie ou qui en revient est un paludisme jusqu’à preuve du contraire. Le diagnostic se confirme par un test ou un frottis : on ne traite pas sur la seule fièvre quand le test est disponible.","L’OMS recommande, dans la plupart des pays, des associations à base d’artémisinine pour le paludisme à P. falciparum non compliqué. En Haïti, la chloroquine est restée le traitement national de première ligne, car le parasite y est resté sensible : suis toujours le protocole du programme national du MSPP en vigueur."]},{"heading":"Signes à rechercher","kind":"signs","items":["Fièvre souvent irrégulière au début, avec frissons, sueurs, céphalées, courbatures, nausées et vomissements. Les accès réguliers tous les deux ou trois jours sont tardifs et inconstants.","Pâleur des conjonctives et des paumes (anémie), subictère, rate palpable (splénomégalie), parfois foie sensible.","Chez l’enfant : refus de manger ou de boire, vomissements répétés, somnolence, convulsions. Chez la femme enceinte : risque d’anémie sévère, d’hypoglycémie et d’accouchement prématuré.","Le voyage ou le séjour en zone d’endémie, l’absence de moustiquaire et les piqûres nocturnes orientent le diagnostic."]},{"heading":"Démarche et examens utiles","kind":"steps","items":["Prends la température, le pouls, la tension, la fréquence respiratoire et la saturation en oxygène : cherche immédiatement un signe de gravité.","Fais une glycémie capillaire chez tout patient fébrile somnolent, convulsif ou qui vomit : l’hypoglycémie complique souvent le paludisme grave.","Demande un test de diagnostic rapide (TDR) ou une goutte épaisse avec frottis mince : le frottis donne l’espèce et la densité parasitaire.","Si le premier frottis est négatif alors que le tableau est évocateur, répète-le à quelques heures d’intervalle avant d’écarter le diagnostic.","Si possible, demande une hémoglobine, une glycémie, une créatinine et un test de grossesse chez la femme en âge de procréer.","Recherche toujours une seconde cause de fièvre, car le paludisme peut coexister avec une autre infection."]},{"heading":"Diagnostics différentiels","kind":"differential","items":["Fièvre typhoïde : fièvre progressive, troubles digestifs, pouls relativement lent ; l’hémoculture tranche.","Dengue et autres arboviroses : douleurs articulaires intenses, éruption, thrombopénie ; le test palustre est négatif.","Leptospirose : exposition à l’eau ou aux rongeurs, myalgies des mollets, conjonctives rouges, ictère et atteinte rénale.","Méningite bactérienne : raideur de nuque et fièvre ; ne la manque pas devant un coma fébrile, car le test palustre positif n’exclut pas une méningite associée.","Sepsis d’origine urinaire, pulmonaire ou cutanée : cherche un foyer infectieux par l’examen."]},{"heading":"Signes de gravité : urgence","kind":"redflags","items":["Trouble de la conscience, prostration (incapable de s’asseoir ou de se tenir debout), convulsions répétées.","Détresse respiratoire, tension basse avec extrémités froides (choc), saignements spontanés.","Anémie sévère avec pâleur extrême et essoufflement, ictère franc, urines très foncées (couleur de thé ou de cola).","Hypoglycémie, oligurie ou anurie, vomissements incoercibles qui empêchent la prise du traitement oral.","Chez la femme enceinte et chez le jeune enfant, abaisse ton seuil d’alerte et demande un avis senior sans attendre."]},{"heading":"Prise en charge : principes","kind":"text","items":["Paludisme non compliqué confirmé : traitement oral antipaludique selon le protocole national, avec consigne de revenir si les vomissements empêchent la prise, si la fièvre persiste ou si l’état s’aggrave.","Paludisme grave : urgence hospitalière. L’OMS recommande l’artésunate par voie injectable, suivi d’un traitement oral complet quand le patient peut avaler. Traite aussi l’hypoglycémie, l’anémie sévère (transfusion selon les critères locaux), la fièvre et les convulsions.","Prévention : moustiquaire imprégnée, élimination des gîtes larvaires, consultation précoce devant toute fièvre. Un test rapide peut rester positif plusieurs semaines après la guérison : ne l’utilise pas pour juger d’un échec."]},{"heading":"Points clés","kind":"pearls","items":["Fièvre en zone d’endémie : on cherche le paludisme, on confirme, puis on traite selon le protocole national.","Un seul frottis négatif n’exclut pas la maladie si le tableau est typique.","Une glycémie capillaire fait partie de l’examen de tout enfant fébrile somnolent ou convulsif.","Un signe de gravité transforme la consultation en urgence : voie injectable et transfert.","Le paludisme peut s’associer à une autre infection ; cherche toujours un deuxième foyer."]}],"references":[{"label":"OMS. Lignes directrices de l’OMS pour le paludisme (WHO guidelines for malaria), mise à jour du 30 novembre 2024.","url":"https://app.magicapp.org/summary/guideline_9683.html"},{"label":"Malaria treatment policies and drug efficacy in Haiti from 1955 to 2012. Journal of Pharmaceutical Policy and Practice, 2013;6:10.","url":"https://link.springer.com/doi/10.1186/2052-3211-6-10"},{"label":"OMS. Paludisme : page thématique.","url":"https://www.who.int/health-topics/malaria"},{"label":"MSPP (Haïti). Normes et protocoles nationaux : à consulter pour la conduite à tenir en vigueur dans le pays.","url":"https://www.mspp.gouv.ht/"}],"rm":4,"sc":6},{"id":"infect-tuberculose","system":"infect","title":"Tuberculose","summary":"Dépister la tuberculose devant une toux prolongée, confirmer par un test moléculaire, ne jamais oublier le test VIH et savoir quand penser à une résistance.","keywords":["tuberculose","TB","toux chronique","hémoptysie","sueurs nocturnes","amaigrissement","Xpert MTB/RIF","BCG","VIH","multirésistance","mal de Pott","adénopathie","DOT"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":4,"sc":6,"locked":true},{"id":"infect-vih-sida","system":"infect","title":"Infection par le VIH et sida","summary":"Dépister, classer le stade clinique, reconnaître les infections opportunistes et comprendre pourquoi le traitement antirétroviral est proposé à tous.","keywords":["VIH","sida","antirétroviraux","ARV","infection opportuniste","CD4","charge virale","cryptococcose","pneumocystose","candidose","Kaposi","PrEP","transmission mère-enfant","test rapide"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":4,"sc":5,"locked":true},{"id":"infect-fievre-typhoide","system":"infect","title":"Fièvre typhoïde","summary":"Reconnaître une fièvre typhoïde par son évolution en trois semaines, la confirmer par l’hémoculture et dépister les complications digestives.","keywords":["fièvre typhoïde","Salmonella Typhi","typhoïde","hémoculture","Widal","perforation digestive","tuphos","bradycardie relative","taches rosées","fièvre prolongée","eau contaminée"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":3,"sc":5,"locked":true},{"id":"infect-arboviroses","system":"infect","title":"Dengue, chikungunya, Zika et fièvre jaune","summary":"Distinguer les arboviroses transmises par les moustiques Aedes, repérer les signes d’alarme de la dengue et savoir surveiller l’hydratation.","keywords":["dengue","chikungunya","Zika","fièvre jaune","arbovirose","Aedes aegypti","thrombopénie","signes d’alarme","arthralgies","éruption","hématocrite","choc","hydratation"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":4,"sc":6,"locked":true},{"id":"infect-cholera","system":"infect","title":"Choléra (Vibrio cholerae)","summary":"Reconnaître la diarrhée aqueuse profuse du choléra, évaluer le degré de déshydratation et savoir que la réhydratation sauve la vie.","keywords":["choléra","Vibrio cholerae","diarrhée aqueuse","eaux de riz","déshydratation","SRO","réhydratation","vaccin oral","épidémie","Haïti","plan A","plan B","plan C"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":3,"sc":6,"locked":true},{"id":"infect-leptospirose","system":"infect","title":"Leptospirose","summary":"Penser à la leptospirose devant une fièvre avec myalgies, ictère ou atteinte rénale après une exposition à l’eau ou aux rongeurs.","keywords":["leptospirose","maladie de Weil","Leptospira","rongeurs","eau contaminée","ictère","insuffisance rénale","myalgies","conjonctivite","hémorragie pulmonaire","inondations"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":3,"sc":6,"locked":true},{"id":"infect-ist","system":"infect","title":"Infections sexuellement transmissibles","summary":"Reconnaître les syndromes d’IST (écoulement, ulcération, douleur pelvienne), appliquer l’approche syndromique et dépister le VIH et la syphilis.","keywords":["IST","MST","écoulement urétral","ulcération génitale","syphilis","gonococcie","chlamydia","herpès génital","VPH","approche syndromique","préservatif","partenaire","cervicite","maladie inflammatoire pelvienne"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":3,"sc":6,"locked":true},{"id":"infect-tetanos","system":"infect","title":"Tétanos et plaies à risque","summary":"Reconnaître le trismus et les spasmes du tétanos, assurer la prise en charge d’une plaie à risque et comprendre le rôle de la vaccination.","keywords":["tétanos","trismus","Clostridium tetani","spasmes","plaie souillée","sérum antitétanique","immunoglobuline","vaccin antitétanique","tétanos néonatal","opisthotonos","rappel"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":4,"sc":6,"locked":true},{"id":"infect-filariose-helminthiases","system":"infect","title":"Filariose lymphatique et helminthiases","summary":"Reconnaître la filariose lymphatique, endémique en Haïti, et les vers intestinaux fréquents chez l’enfant, et connaître les principes de prévention.","keywords":["filariose lymphatique","éléphantiasis","hydrocèle","lymphœdème","Wuchereria bancrofti","helminthiases","ascaris","ankylostome","trichocéphale","albendazole","déparasitage","anémie","malnutrition"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cmit"],"rm":3,"sc":5,"locked":true},{"id":"gyneco-suivi-prenatal","system":"gyneco","title":"Suivi prénatal et consultation de grossesse","summary":"Organiser le suivi d’une grossesse : calcul du terme, examens de chaque consultation, dépistages, prévention et signes d’alerte à enseigner à la femme enceinte.","keywords":["grossesse","consultation prénatale","CPN","terme","date des dernières règles","hauteur utérine","bruits du cœur fœtal","échographie obstétricale","supplémentation en fer","tétanos","plan d’accouchement","signes de danger","mouvements actifs fœtaux"],"free":true,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"sections":[{"heading":"Ce qu’il faut savoir","kind":"text","items":["L’OMS (2016) recommande au moins huit contacts avec un professionnel de santé pendant la grossesse, le premier avant 12 semaines d’aménorrhée (SA), puis à 20, 26, 30, 34, 36, 38 et 40 SA. Ce modèle remplace l’ancien schéma à quatre visites.","Une consultation sert à dater la grossesse, repérer les facteurs de risque, dépister (anémie, hypertension, infections, diabète), prévenir (tétanos, fer et acide folique, paludisme) et préparer l’accouchement.","Une grossesse sans risque au départ peut devenir à risque : réévalue la situation à chaque visite. Un accouchement assisté par un personnel qualifié, avec une référence possible vers un établissement qui pratique la césarienne et la transfusion, réduit la mortalité maternelle."]},{"heading":"Interrogatoire à la première consultation","kind":"signs","items":["Date des dernières règles (DDR), régularité des cycles, contraception récente : ce sont les bases du calcul du terme.","Antécédents obstétricaux : nombre de grossesses et d’accouchements, césarienne, mort-né, fausses couches répétées, prématurité, pré-éclampsie, hémorragie du post-partum.","Antécédents médicaux : hypertension, diabète, drépanocytose, cardiopathie (dont rhumatisme articulaire aigu), asthme, épilepsie, tuberculose, VIH, infections sexuellement transmissibles.","Tabac, alcool, drogues, médicaments, alimentation, statut vaccinal antitétanique. Demande aussi, seule avec la patiente, s’il existe des violences conjugales.","Symptômes de la grossesse en cours : saignements, douleurs pelviennes, vomissements, fièvre, brûlures urinaires, pertes vaginales, céphalées, œdèmes, mouvements actifs du fœtus."]},{"heading":"Démarche et examens de chaque consultation","kind":"steps","items":["Calcule le terme à partir de la DDR (40 SA correspondent à environ 280 jours après le premier jour des règles). Si les dates sont incertaines, confirme-le par une échographie précoce ; l’OMS en recommande une avant 24 SA si elle est accessible.","Pèse la patiente (et mesure sa taille à la première visite), prends la tension artérielle au repos avec la même technique à chaque visite et recherche une protéinurie à la bandelette urinaire.","Examine les conjonctives (pâleur), les œdèmes, les varices et l’abdomen. Dose l’hémoglobine si possible.","À partir du deuxième trimestre, mesure la hauteur utérine et reporte-la sur la courbe. Écoute les bruits du cœur fœtal. Vers 36 SA, précise la présentation du fœtus.","Propose, avec explication et consentement, le groupe sanguin et le Rhésus, le dépistage du VIH, de la syphilis et de l’hépatite B, la recherche d’une bactériurie et le dépistage du diabète, selon les protocoles du MSPP et de l’établissement.","Vérifie le statut antitétanique, prescris le fer et l’acide folique selon le protocole, et prépare le lieu d’accouchement, le transport et les signes qui doivent faire consulter sans attendre."]},{"heading":"Écarts à explorer : hauteur utérine, pâleur, tension","kind":"differential","items":["Hauteur utérine trop grande : erreur de terme, grossesse multiple, hydramnios, macrosomie (diabète), môle hydatiforme en début de grossesse, fibrome.","Hauteur utérine trop petite : erreur de terme, retard de croissance intra-utérin (hypertension, dénutrition, tabac, paludisme, infection), oligoamnios, mort fœtale.","Pâleur : carence en fer, paludisme, drépanocytose, ankylostomiase, carence en folates, VIH. Les besoins en fer augmentent pendant la grossesse.","Tension élevée avec protéinurie ou céphalées : pré-éclampsie, à distinguer d’une hypertension chronique connue avant 20 SA. Un œdème isolé des chevilles est banal au troisième trimestre ; un œdème unilatéral douloureux évoque une thrombose veineuse.","Brûlures urinaires, fièvre, douleur lombaire : cystite, pyélonéphrite ; la bactériurie asymptomatique doit être traitée pendant la grossesse."]},{"heading":"Signes de gravité : urgence","kind":"redflags","items":["Saignement vaginal à tout terme, surtout au troisième trimestre : appelle le senior ; ne pratique pas de toucher vaginal avant d’avoir écarté un placenta praevia par échographie.","Tension à 140/90 mmHg ou plus avec céphalée intense, troubles visuels, douleur épigastrique ou convulsions : pré-éclampsie sévère ou éclampsie.","Diminution ou arrêt des mouvements actifs du fœtus, bruits du cœur absents ou anormaux.","Perte de liquide, contractions régulières avant 37 SA, fièvre.","Pâleur extrême avec essoufflement : anémie sévère. En zone d’endémie palustre, fièvre avec prostration, confusion ou convulsions : paludisme grave.","Vomissements incoercibles avec déshydratation, douleur abdominale brutale, malaise ou collapsus."]},{"heading":"Prévention et préparation : principes","kind":"text","items":["Fer et acide folique par voie orale chaque jour contre l’anémie (OMS 2016) ; calcium là où l’apport alimentaire est faible, pour réduire le risque de pré-éclampsie (OMS 2018). Les doses relèvent du protocole du MSPP.","Aspirine à faible dose à discuter chez les femmes à haut risque de pré-éclampsie : ACOG et SMFM la proposent à partir de 12 SA et au plus tard à 28 SA, idéalement avant 16 SA. Suis le protocole de ton établissement.","Vaccination antitétanique selon le statut vaccinal ; moustiquaire et prévention du paludisme selon la politique nationale du MSPP ; conseils sur l’alimentation, le tabac, l’alcool et les médicaments.","Parle de l’allaitement et de la contraception du post-partum avant l’accouchement."]},{"heading":"Points clés","kind":"pearls","items":["Tension artérielle et bandelette urinaire à chaque consultation : c’est le dépistage de base de la pré-éclampsie.","Une hauteur utérine qui s’écarte de plus de 2 à 3 cm du terme impose de revérifier la date, puis d’orienter vers une échographie.","Dépister le VIH, la syphilis et l’anémie : ce sont des causes traitables, avec un bénéfice direct pour l’enfant.","Jamais de toucher vaginal devant un saignement inexpliqué du troisième trimestre.","Chaque femme doit repartir en sachant quels signes l’obligent à revenir vite et comment venir : la qualité de la consultation compte autant que leur nombre."]}],"references":[{"label":"OMS. Recommandations de l’OMS sur les soins prénatals pour une expérience positive de la grossesse (WHO recommendations on antenatal care for a positive pregnancy experience). Genève, 2016.","url":"https://apo.who.int/publications/i/item/9789241549912"},{"label":"OMS. New guidelines on antenatal care for a positive pregnancy experience (communiqué, 7 novembre 2016).","url":"https://www.who.int/news/item/07-11-2016-new-guidelines-on-antenatal-care-for-a-positive-pregnancy-experience"},{"label":"HAS. Suivi et orientation des femmes enceintes en fonction des situations à risque identifiées. Recommandation de bonne pratique, 2016.","url":"https://www.has-sante.fr/jcms/c_547976/fr/suivi-et-orientation-des-femmes-enceintes-en-fonction-des-situations-a-risque-identifiees"},{"label":"ACOG, SMFM. Practice Advisory: Low-Dose Aspirin Use for the Prevention of Preeclampsia and Related Morbidity and Mortality. 2021.","url":"https://publications.smfm.org/publications/433-acog-smfm-practice-advisory-low-dose-aspirin-use/"},{"label":"MSPP Haïti. Manuel de Normes en Planification Familiale et en Soins Maternels. 2009.","url":"https://www.prb.org/wp-content/uploads/2020/06/Haiti-Manuel-de-Normes-en-Planification-Familiale-et-en-Soins-Maternels-2009.pdf"}],"rm":5,"sc":6},{"id":"gyneco-preeclampsie","system":"gyneco","title":"Pré-éclampsie et éclampsie","summary":"Dépister la pré-éclampsie, repérer les signes de gravité et l’éclampsie, et connaître les principes de prise en charge : tension, sulfate de magnésium, moment de la naissance.","keywords":["pré-éclampsie","éclampsie","hypertension gravidique","hypertension gestationnelle","HELLP","protéinurie","sulfate de magnésium","convulsions","toxémie","bandelette urinaire","aspirine","céphalées","douleur épigastrique"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":5,"sc":6,"locked":true},{"id":"gyneco-hemorragie-post-partum","system":"gyneco","title":"Hémorragie du post-partum","summary":"Prévenir, dépister tôt et traiter l’hémorragie du post-partum en suivant les quatre causes (tonus, traumatisme, tissu, thrombine) et en appelant de l’aide sans attendre.","keywords":["hémorragie du post-partum","HPP","atonie utérine","rétention placentaire","déchirure","massage utérin","ocytocine","acide tranexamique","tamponnement","4T","délivrance","choc hémorragique"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":4,"sc":6,"locked":true},{"id":"gyneco-saignements-t1","system":"gyneco","title":"Saignements du premier trimestre : fausse couche, grossesse extra-utérine, môle","summary":"Devant un saignement en début de grossesse, rechercher d’abord la grossesse extra-utérine, qui peut tuer, puis classer la fausse couche et reconnaître la môle.","keywords":["saignement premier trimestre","fausse couche","grossesse extra-utérine","GEU","môle hydatiforme","β-hCG","échographie pelvienne","menace d’avortement","anti-D","rupture tubaire","douleur pelvienne","aménorrhée"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":4,"sc":6,"locked":true},{"id":"gyneco-saignements-t3","system":"gyneco","title":"Hémorragies du troisième trimestre : placenta praevia et hématome rétroplacentaire","summary":"Distinguer le placenta praevia (sans douleur, sang rouge) de l’hématome rétroplacentaire (douleur, utérus dur) et ne jamais faire de toucher vaginal avant d’avoir localisé le placenta.","keywords":["placenta praevia","hématome rétroplacentaire","décollement placentaire","métrorragies","troisième trimestre","utérus hypertonique","hémorragie","césarienne","coagulation intravasculaire","anti-D","rupture utérine"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":3,"sc":6,"locked":true},{"id":"gyneco-accouchement","system":"gyneco","title":"Accouchement normal, partogramme et dystocies","summary":"Suivre un travail normal avec le partogramme ou le guide de soins du travail de l’OMS, reconnaître la dystocie et décider quand référer.","keywords":["accouchement","travail","partogramme","guide de soins du travail","dilatation","dystocie","dystocie des épaules","présentation du siège","rythme cardiaque fœtal","délivrance","déchirure périnéale","épisiotomie","césarienne"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":4,"sc":6,"locked":true},{"id":"gyneco-contraception","system":"gyneco","title":"Contraception","summary":"Conseiller une méthode contraceptive adaptée en s’appuyant sur les critères de recevabilité de l’OMS, l’efficacité, la tolérance et la situation de la femme.","keywords":["contraception","implant","stérilet","DIU","injectable","pilule","préservatif","MAMA","contraception d’urgence","critères de recevabilité","planification familiale","post-partum","oestroprogestatif"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":4,"sc":6,"locked":true},{"id":"gyneco-leucorrhees","system":"gyneco","title":"Leucorrhées et infections génitales basses","summary":"Distinguer vaginose, candidose, trichomonose et cervicite par l’aspect des pertes et les signes associés, et appliquer l’approche syndromique.","keywords":["leucorrhées","pertes vaginales","vaginose bactérienne","candidose","trichomonose","cervicite","prurit vulvaire","pH vaginal","critères d’Amsel","approche syndromique","gonocoque","chlamydia"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":3,"sc":6,"locked":true},{"id":"gyneco-cancer-col","system":"gyneco","title":"Cancer du col de l’utérus et dépistage","summary":"Comprendre le rôle du papillomavirus, appliquer le dépistage recommandé par l’OMS et reconnaître les signes d’un cancer invasif.","keywords":["cancer du col","papillomavirus","HPV","dépistage","inspection visuelle à l’acide acétique","frottis","lésion précancéreuse","vaccin HPV","colposcopie","saignement post-coïtal","FIGO","VIH"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof"],"rm":3,"sc":5,"locked":true},{"id":"gyneco-infections-grossesse","system":"gyneco","title":"Infections pendant la grossesse : syphilis, VIH, paludisme, bactériurie","summary":"Dépister et traiter à temps les infections qui menacent la mère et l’enfant : syphilis, VIH, bactériurie asymptomatique, paludisme et hépatite B.","keywords":["infection grossesse","syphilis congénitale","VIH grossesse","transmission mère-enfant","bactériurie asymptomatique","pyélonéphrite","paludisme grossesse","hépatite B","rubéole","toxoplasmose","dépistage prénatal"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cngof","cmit"],"rm":4,"sc":6,"locked":true},{"id":"pedia-examen-nouveau-ne","system":"pedia","title":"Examen du nouveau-né et réanimation néonatale","summary":"Accueillir un nouveau-né à la naissance, décider en quelques secondes s’il faut ventiler, et faire l’examen systématique du premier jour.","keywords":["nouveau-né","naissance","Apgar","réanimation néonatale","ventilation au ballon","hypothermie","soins essentiels","examen du nouveau-né","allaitement précoce","cordon","vitamine K","asphyxie périnatale"],"free":true,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"sections":[{"heading":"Ce qu’il faut savoir","kind":"text","items":["À la naissance, la plupart des nouveau-nés respirent seuls. Mais quelques-uns ont besoin d’aide, et chaque minute compte : le cerveau supporte mal le manque d’oxygène. Les soins essentiels sont donc appliqués à tous, et la réanimation est prête à chaque accouchement.","L’OMS recommande de sécher le nouveau-né, de le garder au chaud en peau à peau contre sa mère, de ne pas clamper le cordon trop tôt (pas avant environ une minute si l’enfant n’a pas besoin de réanimation) et de débuter l’allaitement dans la première heure.","Le score d’Apgar décrit l’état de l’enfant à une et cinq minutes, mais il ne sert pas à décider de débuter la réanimation : celle-ci se décide sur la respiration et la fréquence cardiaque."]},{"heading":"Accueil et réanimation à la naissance","kind":"steps","items":["Prépare avant l’accouchement une surface chaude, des linges propres et secs, une source de lumière, une aspiration, un ballon autogonflable avec masques de tailles adaptées et une source d’oxygène si elle existe.","Sèche immédiatement l’enfant en le frictionnant, retire le linge mouillé et couvre-le, tête comprise : le froid aggrave toutes les détresses.","Évalue la respiration, le tonus et la couleur : s’il pleure ou respire normalement, laisse-le en peau à peau avec sa mère.","S’il ne respire pas ou halète, dégage la bouche et le nez seulement si les voies aériennes sont encombrées, positionne la tête en légère extension et stimule en frottant le dos.","Si la respiration n’est pas efficace après quelques secondes, ventile au ballon et au masque dans la première minute, en vérifiant que le thorax se soulève.","Contrôle la fréquence cardiaque : si elle reste basse malgré une ventilation efficace, appelle une aide qualifiée et poursuis la ventilation ; les compressions thoraciques ne s’envisagent qu’en cas de ventilation efficace sans amélioration."]},{"heading":"Examen systématique du nouveau-né","kind":"steps","items":["Mesure le poids, la taille et le périmètre crânien et situe-les sur les courbes ; compare à l’âge gestationnel.","Observe la couleur, la respiration, la posture, le cri et le tonus ; compte la fréquence respiratoire sur une minute entière, enfant calme.","Palpe les fontanelles et les sutures, examine les yeux (réflexe rouge, conjonctivite), le palais et la bouche.","Ausculte le cœur, cherche un souffle et palpe les pouls fémoraux ; examine l’abdomen, le cordon, la perméabilité de l’anus et les organes génitaux.","Examine les hanches (manœuvres de recherche de luxation), le dos et le rachis, les membres, et teste les réflexes de succion, de Moro et de préhension.","Cherche un ictère, évalue la prise de la première tétée et vérifie les soins du cordon, la vitamine K et les soins oculaires selon le protocole national."]},{"heading":"Diagnostics différentiels de la détresse à la naissance","kind":"differential","items":["Asphyxie périnatale : souffrance fœtale pendant le travail, liquide teinté, cri absent, tonus bas.","Prématurité avec immaturité pulmonaire : respiration laborieuse dès les premières minutes, geignement.","Infection néonatale précoce : fièvre maternelle, rupture prolongée des membranes, détresse ou léthargie dans les premières heures.","Malformation (hernie diaphragmatique, atrésie de l’œsophage, cardiopathie cyanogène) : détresse qui persiste malgré une ventilation correcte, cyanose réfractaire.","Hypoglycémie et hypothermie : léthargie, mauvaise succion ; elles aggravent toute autre cause."]},{"heading":"Signes de danger du nouveau-né : urgence","kind":"redflags","items":["Ne tète pas ou ne boit pas, léthargique, convulsions.","Fréquence respiratoire de 60 par minute ou plus, tirage thoracique important, geignement, cyanose.","Température inférieure à 35,5 °C ou supérieure à 37,5 °C.","Ictère apparu dans les premières 24 heures, ou ictère jusqu’aux paumes et plantes.","Pus au cordon avec rougeur étendue, ou nombreuses pustules cutanées ; saignement, abdomen distendu, vomissements bilieux."]},{"heading":"Points clés","kind":"pearls","items":["Sécher et réchauffer est le premier geste de réanimation.","Un nouveau-né qui ne respire pas bien est ventilé au ballon et au masque, sans retard, avant tout autre geste.","La décision de ventiler se prend sur la respiration, pas sur l’Apgar.","L’examen du premier jour cherche les malformations, la luxation de hanche et la cardiopathie, pas seulement les mensurations.","Tout nouveau-né qui ne tète pas bien est suspect d’infection grave."]}],"references":[{"label":"OMS. Guidelines on basic newborn resuscitation (2012).","url":"https://www.who.int/publications-detail-redirect/9789241503693"},{"label":"OMS. Soins essentiels du nouveau-né (essential newborn care).","url":"https://www.who.int/teams/maternal-newborn-child-adolescent-health-and-ageing/newborn-health/essential-newborn-care"},{"label":"OMS. Management of the sick young infant aged up to 2 months: chart booklet.","url":"https://www.who.int/publications/i/item/9789241516365"},{"label":"MSPP (Haïti). Normes et protocoles nationaux : à consulter pour la conduite à tenir en vigueur dans le pays.","url":"https://www.mspp.gouv.ht/"}],"rm":4,"sc":12},{"id":"pedia-croissance-vaccination","system":"pedia","title":"Croissance, développement psychomoteur et vaccination","summary":"Suivre la croissance sur les courbes, repérer un retard de développement et appliquer le calendrier vaccinal du programme élargi (PEV).","keywords":["croissance","courbe de poids","développement psychomoteur","retard","marche","sourire","vaccination","PEV","BCG","pentavalent","rougeole","rotavirus","allaitement exclusif","vitamine A"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":4,"sc":6,"locked":true},{"id":"pedia-deshydratation-diarrhee","system":"pedia","title":"Diarrhée aiguë et déshydratation de l’enfant","summary":"Évaluer le degré de déshydratation d’un enfant qui a la diarrhée, choisir entre réhydratation orale et intraveineuse et savoir quand un antibiotique est indiqué.","keywords":["diarrhée","déshydratation","SRO","solution de réhydratation orale","zinc","pli cutané","dysenterie","rotavirus","plan A","plan B","plan C","allaitement","choc","diarrhée persistante"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":4,"sc":6,"locked":true},{"id":"pedia-bronchiolite-pneumonie","system":"pedia","title":"Bronchiolite et pneumonie de l’enfant","summary":"Compter la fréquence respiratoire selon l’âge, distinguer bronchiolite et pneumonie, repérer les signes de danger et décider entre domicile et hospitalisation.","keywords":["pneumonie","bronchiolite","toux","tirage","polypnée","fréquence respiratoire","saturation","VRS","sifflements","amoxicilline","oxygène","enfant","nourrisson"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":3,"sc":6,"locked":true},{"id":"pedia-malnutrition","system":"pedia","title":"Malnutrition aiguë de l’enfant","summary":"Dépister la malnutrition aiguë par le périmètre brachial et l’œdème, distinguer forme sévère compliquée ou non, et appliquer les principes de prise en charge.","keywords":["malnutrition","malnutrition aiguë sévère","kwashiorkor","marasme","périmètre brachial","MUAC","œdème","ATPE","aliment thérapeutique","F-75","hypoglycémie","nutrition"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":3,"sc":6,"locked":true},{"id":"pedia-fievre-convulsions","system":"pedia","title":"Fièvre et convulsions de l’enfant","summary":"Évaluer un enfant fébrile, distinguer la convulsion fébrile simple d’une crise qui doit faire chercher une méningite, un paludisme ou une hypoglycémie.","keywords":["fièvre","convulsion fébrile","convulsions","méningite","paludisme cérébral","hypoglycémie","épilepsie","état de mal convulsif","nourrisson","ponction lombaire","enfant fébrile"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":3,"sc":6,"locked":true},{"id":"pedia-ictere-infection-neonatale","system":"pedia","title":"Ictère et infection du nouveau-né","summary":"Distinguer l’ictère physiologique de l’ictère pathologique, reconnaître une infection bactérienne grave du jeune nourrisson et agir vite.","keywords":["ictère néonatal","bilirubine","photothérapie","incompatibilité ABO","rhésus","infection néonatale","septicémie","sepsis du nouveau-né","jeune nourrisson","omphalite","fièvre","hypothermie","allaitement"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":4,"sc":6,"locked":true},{"id":"pedia-pcime","system":"pedia","title":"Évaluer un enfant malade : signes de danger et approche PCIME","summary":"Appliquer la démarche PCIME (OMS) : chercher les signes généraux de danger, évaluer toux, diarrhée, fièvre, oreille, nutrition, puis classer et décider.","keywords":["PCIME","IMCI","signes de danger","enfant malade","classification","triage","fièvre","toux","diarrhée","oreille","nutrition","référence","TAU","urgence pédiatrique"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnpu"],"rm":3,"sc":5,"locked":true},{"id":"urgence-arret-cardiaque","system":"urgence","title":"Arrêt cardiaque et réanimation cardio-pulmonaire","summary":"Reconnaître un arrêt cardiaque en quelques secondes, débuter des compressions thoraciques de qualité, défibriller tôt et chercher les causes réversibles.","keywords":["arrêt cardiaque","réanimation cardio-pulmonaire","RCP","massage cardiaque","défibrillateur","fibrillation ventriculaire","asystolie","adrénaline","chaîne de survie","causes réversibles","ventilation","BLS"],"free":true,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"sections":[{"heading":"Ce qu’il faut savoir","kind":"text","items":["L’arrêt cardiaque est l’absence de pouls et de circulation efficace. Le cerveau souffre en quelques minutes : la survie dépend de la rapidité des compressions thoraciques et, quand le rythme est choquable, de la défibrillation précoce.","On distingue les rythmes choquables (fibrillation ventriculaire, tachycardie ventriculaire sans pouls) et non choquables (asystolie, activité électrique sans pouls). Chez l’adulte, la cause est souvent cardiaque ; chez l’enfant et dans la noyade, elle est le plus souvent respiratoire.","Les recommandations 2025 de l’AHA et de l’ERC insistent sur la qualité des compressions, la limitation des interruptions et la formation du public ; les gestes de base sont à connaître par tout soignant."]},{"heading":"Démarche pas à pas","kind":"steps","items":["Sécurise la scène, vérifie la réponse en secouant les épaules et en appelant fort.","Si la personne ne répond pas et ne respire pas normalement (pas de respiration ou simples halètements), crie pour appeler de l’aide, fais chercher le défibrillateur et déclenche l’alerte.","Place la personne sur un plan dur, le talon de la main au centre du thorax, bras tendus : comprime fort et vite, à un rythme de 100 à 120 par minute, avec une profondeur d’environ 5 à 6 cm chez l’adulte, en laissant le thorax se relever complètement.","Si tu es formé, alterne 30 compressions et 2 insufflations, en limitant à quelques secondes les pauses ; sinon, poursuis les compressions seules.","Dès que le défibrillateur est là, mets les électrodes et suis ses instructions ; reprends immédiatement les compressions après un choc ou si aucun choc n’est indiqué.","Toutes les deux minutes environ, change de sauveteur pour garder la qualité, réévalue le rythme, et cherche les causes réversibles ; en équipe médicale, pose un accès vasculaire et administre l’adrénaline selon le protocole d’urgence."]},{"heading":"Reconnaître l’arrêt","kind":"signs","items":["Perte de conscience brutale, aucune réaction aux stimulations.","Absence de respiration normale ou respiration agonique (gasps, bruyante et irrégulière).","Absence de pouls central chez le soignant formé, mais ne perds pas de temps à le chercher plus de dix secondes.","Pâleur ou cyanose, pupilles dilatées. Contexte : douleur thoracique, noyade, électrocution, choc, intoxication, traumatisme."]},{"heading":"Causes réversibles à chercher (4 H et 4 T)","kind":"differential","items":["Hypoxie, hypovolémie (hémorragie), hypo ou hyperkaliémie et autres troubles métaboliques, hypothermie.","Thrombose coronaire ou pulmonaire (infarctus, embolie pulmonaire).","Tamponnade cardiaque, pneumothorax suffocant, toxiques (intoxication médicamenteuse, monoxyde de carbone).","Évanouissement simple, crise convulsive ou hypoglycémie : la personne respire et a un pouls.","Dans un contexte de noyade, de paludisme grave ou d’asphyxie, la ventilation prend plus d’importance."]},{"heading":"Erreurs à éviter","kind":"redflags","items":["Perdre du temps à chercher le pouls ou à compter pendant que le cœur ne bat plus.","Interrompre les compressions plus de quelques secondes pour d’autres gestes.","Comprimer trop mollement, trop lentement ou trop superficiellement, ou s’appuyer sur le thorax entre deux compressions.","Hyperventiler la personne, ce qui diminue le retour veineux.","Arrêter trop tôt : la décision d’arrêt revient au médecin, selon le contexte et les protocoles."]},{"heading":"Après le retour d’une circulation spontanée","kind":"text","items":["Une fois le pouls revenu, assure la ventilation, évite l’hypoxie et l’hypotension, cherche et traite la cause (infarctus, embolie, trouble métabolique, intoxication) et transfère vers un service de soins intensifs si possible.","Contrôle la glycémie et la température, évite la fièvre, et informe la famille avec respect et clarté.","Dans les structures sans défibrillateur, des compressions et ventilations de qualité restent le geste qui sauve : forme les équipes régulièrement par la simulation."]},{"heading":"Points clés","kind":"pearls","items":["Pas de réponse et pas de respiration normale : débute les compressions sans attendre.","Comprime fort, vite (100 à 120 par minute), en relâchant complètement.","Limite les interruptions et change de sauveteur toutes les deux minutes.","Le choc électrique ne s’applique qu’aux rythmes choquables, d’où l’intérêt du défibrillateur.","Cherche systématiquement les causes réversibles."]}],"references":[{"label":"American Heart Association. 2025 Guidelines for Cardiopulmonary Resuscitation and Emergency Cardiovascular Care.","url":"https://professional.heart.org/en/science-news/2025-aha-guidelines-for-cpr-and-ecc"},{"label":"European Resuscitation Council. Guidelines 2025: executive summary (PubMed).","url":"https://pubmed.ncbi.nlm.nih.gov/41117573/"},{"label":"European Resuscitation Council (ERC) : page d’accueil des recommandations.","url":"https://www.erc.edu/"},{"label":"MSPP (Haïti). Normes et protocoles nationaux : à consulter pour la conduite à tenir en vigueur dans le pays.","url":"https://www.mspp.gouv.ht/"}],"rm":4,"sc":6},{"id":"urgence-etat-de-choc","system":"urgence","title":"État de choc","summary":"Reconnaître le choc par les signes de mauvaise perfusion, identifier son type (hypovolémique, cardiogénique, obstructif, distributif) et débuter la réanimation sans attendre la tension basse.","keywords":["choc","état de choc","hypotension","choc septique","choc hémorragique","choc cardiogénique","remplissage","vasopresseurs","lactate","temps de recoloration","oligurie","marbrures","indice de choc"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"urgence-polytraumatise","system":"urgence","title":"Prise en charge initiale du polytraumatisé","summary":"Appliquer la séquence ABCDE devant un traumatisé grave, traiter les lésions qui tuent d’abord et décider du transfert.","keywords":["polytraumatisé","traumatisme","ABCDE","hémorragie","pneumothorax sous tension","hémothorax","rachis cervical","Glasgow","FAST","hypothermie","acide tranexamique","accident de moto","plaie par balle"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":4,"sc":6,"locked":true},{"id":"urgence-brulures","system":"urgence","title":"Brûlures","summary":"Évaluer la profondeur et la surface d’une brûlure, donner les premiers soins efficaces, et décider qui doit être transféré vers un centre spécialisé.","keywords":["brûlures","surface brûlée","règle des neuf","brûlure profonde","inhalation de fumées","refroidissement","remplissage","brûlure électrique","brûlure chimique","escarre","tétanos","enfant brûlé"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":4,"sc":6,"locked":true},{"id":"urgence-anaphylaxie","system":"urgence","title":"Anaphylaxie","summary":"Reconnaître l’anaphylaxie à ses signes cutanés, respiratoires et circulatoires, et injecter l’adrénaline sans attendre : elle est le traitement de première intention.","keywords":["anaphylaxie","choc anaphylactique","adrénaline intramusculaire","urticaire","œdème de Quincke","bronchospasme","allergie alimentaire","piqûre d’insecte","antibiotique","réaction biphasique","auto-injecteur"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"urgence-intoxications-envenimations","system":"urgence","title":"Intoxications et envenimations","summary":"Aborder un patient intoxiqué : stabiliser, identifier le produit, reconnaître le syndrome toxique et connaître les antidotes principaux.","keywords":["intoxication","empoisonnement","paracétamol","organophosphorés","monoxyde de carbone","caustiques","méthanol","charbon actif","antidote","envenimation","morsure de serpent","centre antipoison"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cnec"],"rm":3,"sc":6,"locked":true},{"id":"urgence-detresse-respiratoire","system":"urgence","title":"Détresse respiratoire aiguë et oxygénothérapie","summary":"Reconnaître une détresse respiratoire, chercher la cause la plus dangereuse, oxygéner avec des objectifs adaptés et décider de la ventilation.","keywords":["détresse respiratoire","dyspnée aiguë","oxygénothérapie","saturation","hypoxie","hypercapnie","œdème aigu du poumon","crise d’asthme","pneumothorax","embolie pulmonaire","ventilation non invasive","tirage","cyanose"],"free":false,"updatedAt":"2026-10-17","reviewed":false,"collegeIds":["cep"],"rm":4,"sc":6,"locked":true}],"cases":[{"id":"cas-sepsis-urinaire","title":"Une patiente âgée fébrile et confuse","system":"general","level":"debutant","free":true,"tags":["sepsis","constantes","urgences"],"summary":"Fièvre, confusion et hypotension chez une femme de 72 ans : reconnaître les signes de gravité et le foyer.","intro":"Salle d’urgence. Une femme de 72 ans, diabétique, est amenée par sa fille : fièvre depuis deux jours, brûlures en urinant. Depuis ce matin elle est « bizarre » et ne reconnaît plus sa fille.","ficheIds":["general-signes-vitaux","general-fievre-sepsis"],"steps":[{"reveal":"Constantes : température 38,9 °C, fréquence cardiaque 118/min, fréquence respiratoire 26/min, tension 88/50 mmHg, SpO2 94 % à l’air ambiant. Glasgow 14 (réponse verbale confuse). Extrémités froides, marbrures aux genoux. Elle n’a presque pas uriné depuis hier.","question":"Quelle est votre première impression ?","options":["Une fièvre banale : donner du paracétamol et rassurer la famille","Des signes de gravité évoquant un sepsis avec mauvaise perfusion : évaluation immédiate et appel d’un médecin senior","Une anxiété liée à l’hospitalisation","Une simple déshydratation sans urgence"],"correct":1,"explanation":"Fréquence respiratoire élevée, confusion, tension basse, marbrures et oligurie traduisent une défaillance de perfusion. Il faut agir sans attendre, pas rassurer."},{"reveal":"Vous complétez l’évaluation avec les repères d’alerte.","question":"Combien de critères qSOFA cette patiente présente-t-elle ?","options":["0","1","2","3"],"correct":3,"explanation":"Fréquence respiratoire 26 (≥ 22), altération de la conscience (Glasgow 14) et tension systolique 88 (≤ 100) : les trois critères sont présents. Rappel : la Surviving Sepsis Campaign 2021 déconseille de s’appuyer sur le qSOFA seul, car un score négatif ne rassure pas."},{"reveal":"Examen : abdomen souple, douleur à l’ébranlement de la fosse lombaire droite. Bandelette urinaire : leucocytes et nitrites positifs. Pas de raideur de nuque, pas de purpura, poumons clairs, peau saine.","question":"Quel est le foyer infectieux le plus probable ?","options":["Pneumonie","Pyélonéphrite (infection urinaire haute)","Méningite","Cellulite d’un membre"],"correct":1,"explanation":"Fièvre, brûlures mictionnelles, douleur lombaire à l’ébranlement et bandelette positive : pyélonéphrite. L’absence de signe méningé, de purpura, de toux et de lésion cutanée écarte les autres foyers à ce stade."},{"reveal":"Le médecin arrive dans quinze minutes. Vous êtes seul avec la patiente.","question":"Que faites-vous en attendant ?","options":["La renvoyer à domicile avec un antibiotique par voie orale","La mettre sous surveillance rapprochée : scope, voie veineuse, glycémie capillaire, oxygène si besoin, prélèvements (hémocultures avant l’antibiotique si cela ne retarde pas le traitement), et préparer le traitement rapide","Attendre les résultats d’une imagerie avant tout traitement","Donner un antipyrétique et la réévaluer dans six heures"],"correct":1,"explanation":"Le sepsis est une urgence dépendante du temps : surveillance continue, accès veineux, glycémie, prélèvements, puis antibiotique rapide (idéalement dans l’heure en cas de choc septique ou de forte probabilité de sepsis, selon la Surviving Sepsis Campaign 2021)."}],"debrief":{"keyPoints":["Fréquence respiratoire, conscience et tension suffisent à repérer un patient en danger : mesurez-les, notez-les, répétez-les.","Chez la personne âgée, la confusion est souvent le premier signe d’une infection grave, parfois sans fièvre élevée.","Les marbrures, les extrémités froides et l’oligurie signent la mauvaise perfusion.","Un qSOFA négatif ne rassure jamais seul ; un patient qui vous inquiète mérite une évaluation complète."]},"references":[{"label":"Evans L, et al. Surviving Sepsis Campaign : International Guidelines 2021. Crit Care Med 2021.","url":"https://doi.org/10.1097/CCM.0000000000005337"},{"label":"Singer M, et al. Sepsis-3. JAMA 2016;315:801-810.","url":"https://doi.org/10.1001/jama.2016.0287"},{"label":"Royal College of Physicians. NEWS2, 2017.","url":"https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"}],"reviewed":fal   var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function dateFr(iso) { var p = String(iso).split('-'); return p.length === 3 ? (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0] : ''; }
  function clock(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }

  /* ---------- Paiement NatCash et codes d'accès ----------
     Principe : le client paie par NatCash, envoie sa demande (nom + numéro de transaction), l'administrateur
     vérifie le SMS NatCash puis génère un code signé. Le code contient la clé qui ouvre le contenu payant
     et une date de fin. Sans code signé par l'administrateur, le contenu payant reste chiffré. */
  var PAY = { number: '50940724822', shown: '509 4072 4822' };
  var TRIAL = { id: 'essai', label: 'Essai 7 jours', price: 0, days: 7 };
  var PLAN_IDX = ['mensuel', 'trimestriel', 'annuel', 'essai'];
  var CREDIT = { id: 'credit', label: 'Recharge de crédit', price: 0, days: 0 };
  function planById(id) { return PLANS.concat([TRIAL, CREDIT]).filter(function (p) { return p.id === id; })[0]; }
  var enc = new TextEncoder(), dec = new TextDecoder();
  var subtle = (window.crypto && window.crypto.subtle) || null;
  var ALG = { name: 'ECDSA', hash: 'SHA-256' }, CURVE = { name: 'ECDSA', namedCurve: 'P-256' };

  function b64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

  function hex(b) { var s = ''; for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2); return s; }
  function unhex(h) { var b = new Uint8Array(h.length / 2); for (var i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16); return b; }
  function randBytes(n) { var a = new Uint8Array(n); if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); return a; }
  function clientTag() { var t = store.get('cid', null); if (!t || !/^[0-9a-f]{8}$/.test(t)) { t = hex(randBytes(4)); store.set('cid', t); } return t; }
  function tagFmt(t) { return t.slice(0, 4).toUpperCase() + '-' + t.slice(4).toUpperCase(); }
  function tagParse(s) { var h = String(s || '').replace(/[^0-9a-fA-F]/g, '').toLowerCase(); return h.length === 8 ? h : null; }
  function dateOfSec(sec) { var d = new Date(sec * 1000); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function isSub() { return !!(S.sub && S.sub.exp * 1000 > Date.now()); }
  function daysLeft() { return S.sub ? Math.max(0, Math.ceil((S.sub.exp * 1000 - Date.now()) / DAY)) : 0; }

  function importPub() { return subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: DATA.sec.x, y: DATA.sec.y, ext: true }, CURVE, false, ['verify']); }

  /* Lit un code : forme, signature de l'administrateur. Ne regarde pas encore la date. */
  async function parseCode(body) {
    if (!subtle) throw { code: 'crypto' };
    if (!/^[A-Za-z0-9_-]{142}$/.test(body)) throw { code: 'format' };
    var b = unb64u(body);
    if (b.length !== 106 || b[0] !== 1) throw { code: 'format' };
    var ok = await subtle.verify(ALG, await importPub(), b.slice(42), b.slice(0, 42));
    if (!ok) throw { code: 'signature' };
    return { plan: PLAN_IDX[b[1]] || 'mensuel', exp: new DataView(b.buffer).getUint32(2), tag: hex(b.slice(6, 10)), key: b.slice(10, 42) };
  }
  function extractCode(raw) { var m = String(raw || '').replace(/\s+/g, '').match(/KLK-([A-Za-z0-9_-]{142})/); return m ? m[1] : null; }

  /* Déchiffre le contenu payant et le remet dans les fiches, cas et questions. */
  async function unlock(key) {
    var k = await subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: unb64u(DATA.sec.iv) }, k, unb64u(DATA.sec.ct));
    var p = JSON.parse(dec.decode(pt));
    ['fiches', 'cases', 'questions'].forEach(function (kind) {
      DATA[kind].forEach(function (it) { var x = p[kind][it.id]; if (x) for (var f in x) it[f] = x[f]; });
    });
    S.unlocked = true;
  }

  async function activate(raw) {
    var body = extractCode(raw);
    if (!body) throw { code: 'format' };
    var info = await parseCode(body);
    if (info.exp * 1000 <= Date.now()) throw { code: 'expired', info: info };
    try { await unlock(info.key); } catch (e) { throw { code: 'key' }; }
    if (isSub() && S.sub.exp > info.exp) return { kept: true, info: info };
    S.sub = { plan: info.plan, exp: info.exp, tag: info.tag };
    store.set('code', 'KLK-' + body);
    return { kept: false, info: info };
  }
  var ERR = {
    format: 'Ce code n’est pas reconnu. Copie-le en entier, de « KLK- » jusqu’à la dernière lettre.',
    signature: 'Ce code n’est pas valide. Vérifie que tu l’as copié en entier, sans rien changer.',
    expired: 'Ce code est expiré. Si tu viens de payer, demande un nouveau code.',
    key: 'Ce code ne correspond plus à cette version de ' + NAME + '. Demande un nouveau code.',
    used: 'Ce code de recharge a déjà été utilisé sur cet appareil.',
    crypto: 'Ce navigateur ne permet pas l’activation. Ouvre ' + NAME + ' dans Chrome ou Safari.',
    adm: 'Cette clé administrateur n’est pas la bonne pour cette version de ' + NAME + '.'
  };
  function errMsg(e) { return ERR[e && e.code] || 'Une erreur est survenue. Réessaie.'; }

  /* Demande du client */
  function normPhone(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 8) d = '509' + d; return d; }
  function buildRequest() {
    var f = S.form, plan = S.mode === 'credit' ? { id: 'credit', label: 'Recharge de crédit', price: S.topup } : planById(S.plan);
    var req = { n: f.name.trim(), p: plan.id, a: plan.price, t: f.tx.trim(), c: clientTag(), w: normPhone(f.phone) };
    return ['Klinik : demande d’accès', 'Nom : ' + req.n, 'Formule : ' + plan.label + ' (' + htg(plan.price).replace(/[\u00a0\u202f]/g, ' ') + ')', 'Transaction NatCash : ' + req.t, 'Code client : ' + tagFmt(req.c), 'KLK-REQ:' + b64u(enc.encode(JSON.stringify(req)))].join('\n');
  }
  function parseRequest(text) {
    var m = String(text || '').match(/KLK-REQ:([A-Za-z0-9_-]+)/);
    if (!m) return null;
    var r; try { r = JSON.parse(dec.decode(unb64u(m[1]))); } catch (e) { return null; }
    var plan = r && planById(r.p);
    if (plan && plan.id === 'credit') { if (!(Number.isInteger(r.a) && r.a >= 10 && r.a <= 5000)) return null; plan = { id: 'credit', label: CREDIT.label, price: r.a, days: 0 }; }
    if (!plan || plan.id === 'essai' || typeof r.n !== 'string' || typeof r.t !== 'string' || !/^[0-9a-f]{8}$/.test(r.c || '')) return null;
    return { name: r.n.slice(0, 80), plan: plan, tx: r.t.slice(0, 40), tag: r.c, phone: /^\d{8,15}$/.test(r.w || '') ? r.w : '' };
  }

  /* Administration */
  async function admLoad() {
    var raw = store.get('adm', null); if (!raw || !subtle) throw { code: 'adm' };
    var o; try { o = JSON.parse(dec.decode(unb64u(String(raw).replace(/^KLKADM-/i, '')))); } catch (e) { throw { code: 'adm' }; }
    if (!o || o.x !== DATA.sec.x || o.y !== DATA.sec.y || !o.d || !o.k) throw { code: 'adm' };
    var pk = await subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: o.x, y: o.y, d: o.d, ext: true }, CURVE, false, ['sign']);
    var probe = enc.encode('klinik'), sig = await subtle.sign(ALG, pk, probe);
    if (!(await subtle.verify(ALG, await importPub(), sig, probe))) throw { code: 'adm' };
    var k = unb64u(o.k); if (k.length !== 32) throw { code: 'adm' };
    return { pk: pk, k: k };
  }
  async function issue(planId, tag, baseExp) {
    var adm = await admLoad(), plan = planById(planId), now = Math.floor(Date.now() / 1000);
    var exp = Math.max(now, baseExp || 0) + plan.days * 86400;
    var buf = new Uint8Array(42), dv = new DataView(buf.buffer);
    buf[0] = 1; buf[1] = PLAN_IDX.indexOf(planId); dv.setUint32(2, exp); buf.set(unhex(tag), 6); buf.set(adm.k, 10);
    var sig = new Uint8Array(await subtle.sign(ALG, adm.pk, buf)), out = new Uint8Array(106);
    out.set(buf, 0); out.set(sig, 42);
    return { code: 'KLK-' + b64u(out), exp: exp, plan: plan };
  }
  function journal() { return store.get('journal', []); }
  function journalAdd(e) { store.set('journal', [e].concat(journal()).slice(0, 400)); }
  function lastExpFor(tag) { var now = Math.floor(Date.now() / 1000); return journal().filter(function (j) { return j.plan !== 'credit' && j.tag === tag && j.exp > now; }).reduce(function (m, j) { return Math.max(m, j.exp); }, 0); }
  function dupTx(tx) { var t = String(tx || '').trim().toLowerCase(); if (!t) return null; return journal().filter(function (j) { return j.tx && j.tx.toLowerCase() === t; })[0] || null; }
  function clientMessage(out) {
    if (out.credit) return NAME + ' : ton crédit de ' + htg(out.credit) + ' est prêt.\nOuvre ' + NAME + ', touche Profil, puis « Recharger mon crédit », et colle ce code dans la case « Active ton code » :\n\n' + out.code + '\n\nGarde ce message, il contient ton code. Merci ! ' + AUTHOR;
    return NAME + ' : ton accès est activé jusqu’au ' + dateFr(dateOfSec(out.exp)) + '.\nOuvre ' + NAME + ', touche Profil, puis « Recharger mon crédit », et colle ce code dans la case « Active ton code » :\n\n' + out.code + '\n\nMerci ! ' + AUTHOR;
  }
  function copyText(t) {
    function fallback() {
      try { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e) { return false; }
    }
