  /* ---------- Paiement NatCash et codes d'accès ----------
     Principe : le client paie par NatCash, envoie sa demande (nom + numéro de transaction), l'administrateur
     vérifie le SMS NatCash puis génère un code signé. Le code contient la clé qui ouvre le contenu payant
     et une date de fin. Sans code signé par l'administrateur, le contenu payant reste chiffré. */
  var PAY = { number: '50940724822', shown: '509 4072 4822' };
  var TRIAL = { id: 'essai', label: 'Essai 7 jours', price: 0, days: 7 };
  var PLAN_IDX = ['mensuel', 'trimestriel', 'annuel', 'essai'];
  var CREDIT = { id: 'credit', label: 'Recharge de crédit', price: 0, days: 0 };
  function planById(id) { return PLANS.concat([TRIAL, CREDIT]).filter(function (p) { return p.id === id; })[0]; }
  var enc = new TextEncoder(), dec = new TextDecoder();
  var subtle = (window.crypto && window.crypto.subtle) || null;
  var ALG = { name: 'ECDSA', hash: 'SHA-256' }, CURVE = { name: 'ECDSA', namedCurve: 'P-256' };

  function b64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(str) { str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; var s = atob(str), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  function hex(b) { var s = ''; for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2); return s; }
  function unhex(h) { var b = new Uint8Array(h.length / 2); for (var i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16); return b; }
  function randBytes(n) { var a = new Uint8Array(n); if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); return a; }
  function clientTag() { var t = store.get('cid', null); if (!t || !/^[0-9a-f]{8}$/.test(t)) { t = hex(randBytes(4)); store.set('cid', t); } return t; }
  function tagFmt(t) { return t.slice(0, 4).toUpperCase() + '-' + t.slice(4).toUpperCase(); }
  function tagParse(s) { var h = String(s || '').replace(/[^0-9a-fA-F]/g, '').toLowerCase(); return h.length === 8 ? h : null; }
  function dateOfSec(sec) { var d = new Date(sec * 1000); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function isSub() { return !!(S.sub && S.sub.exp * 1000 > Date.now()); }
  function daysLeft() { return S.sub ? Math.max(0, Math.ceil((S.sub.exp * 1000 - Date.now()) / DAY)) : 0; }

  function importPub() { return subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: DATA.sec.x, y: DATA.sec.y, ext: true }, CURVE, false, ['verify']); }

  /* Lit un code : forme, signature de l'administrateur. Ne regarde pas encore la date. */
  async function parseCode(body) {
    if (!subtle) throw { code: 'crypto' };
    if (!/^[A-Za-z0-9_-]{142}$/.test(body)) throw { code: 'format' };
    var b = unb64u(body);
    if (b.length !== 106 || b[0] !== 1) throw { code: 'format' };
    var ok = await subtle.verify(ALG, await importPub(), b.slice(42), b.slice(0, 42));
    if (!ok) throw { code: 'signature' };
    return { plan: PLAN_IDX[b[1]] || 'mensuel', exp: new DataView(b.buffer).getUint32(2), tag: hex(b.slice(6, 10)), key: b.slice(10, 42) };
  }
  function extractCode(raw) { var m = String(raw || '').replace(/\s+/g, '').match(/KLK-([A-Za-z0-9_-]{142})/); return m ? m[1] : null; }

  /* Déchiffre le contenu payant et le remet dans les fiches, cas et questions. */
  async function unlock(key) {
    var k = await subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: unb64u(DATA.sec.iv) }, k, unb64u(DATA.sec.ct));
    var p = JSON.parse(dec.decode(pt));
    ['fiches', 'cases', 'questions'].forEach(function (kind) {
      DATA[kind].forEach(function (it) { var x = p[kind][it.id]; if (x) for (var f in x) it[f] = x[f]; });
    });
    S.unlocked = true;
  }

  async function activate(raw) {
    var body = extractCode(raw);
    if (!body) throw { code: 'format' };
    var info = await parseCode(body);
    if (info.exp * 1000 <= Date.now()) throw { code: 'expired', info: info };
    try { await unlock(info.key); } catch (e) { throw { code: 'key' }; }
    if (isSub() && S.sub.exp > info.exp) return { kept: true, info: info };
    S.sub = { plan: info.plan, exp: info.exp, tag: info.tag };
    store.set('code', 'KLK-' + body);
    return { kept: false, info: info };
  }
  var ERR = {
    format: 'Ce code n’est pas reconnu. Copie-le en entier, de « KLK- » jusqu’à la dernière lettre.',
    signature: 'Ce code n’est pas valide. Vérifie que tu l’as copié en entier, sans rien changer.',
    expired: 'Ce code est expiré. Si tu viens de payer, demande un nouveau code.',
    key: 'Ce code ne correspond plus à cette version de ' + NAME + '. Demande un nouveau code.',
    used: 'Ce code de recharge a déjà été utilisé sur cet appareil.',
    crypto: 'Ce navigateur ne permet pas l’activation. Ouvre ' + NAME + ' dans Chrome ou Safari.',
    adm: 'Cette clé administrateur n’est pas la bonne pour cette version de ' + NAME + '.'
  };
  function errMsg(e) { return ERR[e && e.code] || 'Une erreur est survenue. Réessaie.'; }

  /* Demande du client */
  function normPhone(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 8) d = '509' + d; return d; }
  function buildRequest() {
    var f = S.form, plan = S.mode === 'credit' ? { id: 'credit', label: 'Recharge de crédit', price: S.topup } : planById(S.plan);
    var req = { n: f.name.trim(), p: plan.id, a: plan.price, t: f.tx.trim(), c: clientTag(), w: normPhone(f.phone) };
    return ['Klinik : demande d’accès', 'Nom : ' + req.n, 'Formule : ' + plan.label + ' (' + htg(plan.price).replace(/[\u00a0\u202f]/g, ' ') + ')', 'Transaction NatCash : ' + req.t, 'Code client : ' + tagFmt(req.c), 'KLK-REQ:' + b64u(enc.encode(JSON.stringify(req)))].join('\n');
  }
  function parseRequest(text) {
    var m = String(text || '').match(/KLK-REQ:([A-Za-z0-9_-]+)/);
    if (!m) return null;
    var r; try { r = JSON.parse(dec.decode(unb64u(m[1]))); } catch (e) { return null; }
    var plan = r && planById(r.p);
    if (plan && plan.id === 'credit') { if (!(Number.isInteger(r.a) && r.a >= 10 && r.a <= 5000)) return null; plan = { id: 'credit', label: CREDIT.label, price: r.a, days: 0 }; }
    if (!plan || plan.id === 'essai' || typeof r.n !== 'string' || typeof r.t !== 'string' || !/^[0-9a-f]{8}$/.test(r.c || '')) return null;
    return { name: r.n.slice(0, 80), plan: plan, tx: r.t.slice(0, 40), tag: r.c, phone: /^\d{8,15}$/.test(r.w || '') ? r.w : '' };
  }

  /* Administration */
  async function admLoad() {
    var raw = store.get('adm', null); if (!raw || !subtle) throw { code: 'adm' };
    var o; try { o = JSON.parse(dec.decode(unb64u(String(raw).replace(/^KLKADM-/i, '')))); } catch (e) { throw { code: 'adm' }; }
    if (!o || o.x !== DATA.sec.x || o.y !== DATA.sec.y || !o.d || !o.k) throw { code: 'adm' };
    var pk = await subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: o.x, y: o.y, d: o.d, ext: true }, CURVE, false, ['sign']);
    var probe = enc.encode('klinik'), sig = await subtle.sign(ALG, pk, probe);
    if (!(await subtle.verify(ALG, await importPub(), sig, probe))) throw { code: 'adm' };
    var k = unb64u(o.k); if (k.length !== 32) throw { code: 'adm' };
    return { pk: pk, k: k };
  }
  async function issue(planId, tag, baseExp) {
    var adm = await admLoad(), plan = planById(planId), now = Math.floor(Date.now() / 1000);
    var exp = Math.max(now, baseExp || 0) + plan.days * 86400;
    var buf = new Uint8Array(42), dv = new DataView(buf.buffer);
    buf[0] = 1; buf[1] = PLAN_IDX.indexOf(planId); dv.setUint32(2, exp); buf.set(unhex(tag), 6); buf.set(adm.k, 10);
    var sig = new Uint8Array(await subtle.sign(ALG, adm.pk, buf)), out = new Uint8Array(106);
    out.set(buf, 0); out.set(sig, 42);
    return { code: 'KLK-' + b64u(out), exp: exp, plan: plan };
  }
  function journal() { return store.get('journal', []); }
  function journalAdd(e) { store.set('journal', [e].concat(journal()).slice(0, 400)); }
  function lastExpFor(tag) { var now = Math.floor(Date.now() / 1000); return journal().filter(function (j) { return j.plan !== 'credit' && j.tag === tag && j.exp > now; }).reduce(function (m, j) { return Math.max(m, j.exp); }, 0); }
  function dupTx(tx) { var t = String(tx || '').trim().toLowerCase(); if (!t) return null; return journal().filter(function (j) { return j.tx && j.tx.toLowerCase() === t; })[0] || null; }
  function clientMessage(out) {
    if (out.credit) return NAME + ' : ton crédit de ' + htg(out.credit) + ' est prêt.\nOuvre ' + NAME + ', touche Profil, puis « Recharger mon crédit », et colle ce code dans la case « Active ton code » :\n\n' + out.code + '\n\nGarde ce message, il contient ton code. Merci ! ' + AUTHOR;
    return NAME + ' : ton accès est activé jusqu’au ' + dateFr(dateOfSec(out.exp)) + '.\nOuvre ' + NAME + ', touche Profil, puis « Recharger mon crédit », et colle ce code dans la case « Active ton code » :\n\n' + out.code + '\n\nMerci ! ' + AUTHOR;
  }
  function copyText(t) {
    function fallback() {
      try { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e) { return false; }
    }

      res(fallback());
    });
  }
  function field(f, label, o) {
    o = o || {}; var v = esc(S.form[f] || '');
    return '<label class="fld"><span class="label">' + esc(label) + '</span>' + (o.area
      ? '<textarea data-f="' + f + '" rows="' + (o.rows || 4) + '" placeholder="' + esc(o.ph || '') + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' + v + '</textarea>'
      : '<input type="' + (o.type || 'text') + '" data-f="' + f + '" value="' + v + '" placeholder="' + esc(o.ph || '') + '" autocomplete="' + (o.ac || 'off') + '"' + (o.mode ? ' inputmode="' + o.mode + '"' : '') + '>') + '</label>';
  }
  function note(tone, text) { return text ? banner(tone, '', esc(text)) : ''; }

  /* ---------- Paiement à l'usage ----------
     Le client recharge un crédit en gourdes (HTG) par NatCash. Chaque contenu payant ouvert est déduit du solde.
     Le solde est tenu sur l'appareil. Comme les codes, il peut être contourné par quelqu'un de très motivé :
     c'est une barrière honnête, pas une banque. Les prix ci-dessous sont provisoires. */
  var USAGE = { fiche: 5, cas: 15, qcm: 2, concours: 3, cartes: 5, check: 3, cap: 500, capDays: 30, topups: [50, 100, 250, 500] };
  function today() { return dateOfSec(Date.now() / 1000); }
  function loadUsage() {
    var u = store.get('usage', null) || {}, day = today(), seen = {};
    for (var k in (u.seen || {})) if (u.seen[k] === day) seen[k] = day;
    return { bal: Math.max(0, +u.bal || 0), cw: u.cw && u.cw.start ? u.cw : null, seen: seen, used: u.used || [], log: u.log || [] };
  }
  var U = loadUsage();
  function saveUsage() { store.set('usage', U); }
  function windowOn() { return !!(U.cw && Date.now() < U.cw.start + USAGE.capDays * DAY); }
  function windowSpent() { return windowOn() ? U.cw.spent : 0; }
  function capEnd() { return windowOn() ? U.cw.start + USAGE.capDays * DAY : 0; }
  function capActive() { return windowOn() && U.cw.spent >= USAGE.cap; }
  function hasCredit() { return !!(S.unlocked && (U.bal > 0 || capActive())); }
  function pillHtml() {
    if (isSub()) return '<span class="pill ok">Illimité</span>';
    if (hasCredit()) return '<span class="pill ok">' + (capActive() ? 'Illimité' : 'Crédit ' + htg(U.bal)) + '</span>';
    return '<span class="pill">Gratuit</span>';
  }
  /* Combien sera réellement déduit pour une suite de prix, selon le solde et le plafond. */
  function planSpend(prices) {
    var bal = U.bal, spent = windowSpent(), total = 0, n = 0;
    for (var i = 0; i < prices.length; i++) {
      var pay = Math.max(0, Math.min(prices[i], USAGE.cap - spent));
      if (pay > bal) break;
      bal -= pay; spent += pay; total += pay; n++;
    }
    return { n: n, total: total };
  }
  function logUse(label, amt, plus) { U.log = [{ at: Date.now(), label: label, amt: amt, plus: !!plus }].concat(U.log).slice(0, 60); }
  function commitSpend(total, label) {
    if (total > 0) {
      if (!windowOn()) U.cw = { start: Date.now(), spent: 0 };
      U.cw.spent += total; U.bal -= total;
    }
    logUse(label, total); saveUsage();
  }
  function balNote(paid) {
    if (capActive()) return (paid ? htg(paid) + ' déduits. ' : '') + 'Plafond de ' + htg(USAGE.cap) + ' atteint : tout est gratuit jusqu’au ' + dateFr(dateOfSec(capEnd() / 1000)) + '.';
    return htg(paid) + ' déduits. Solde : ' + htg(U.bal) + '.';
  }
  /* Facture l'ouverture d'un contenu payant (une seule fois par jour pour le même contenu). */
  function chargeItem(kind, key, label) {
    if (isSub()) return { ok: true, paid: 0, note: '' };
    var sk = kind + ':' + key;
    if (U.seen[sk] === today()) return { ok: true, paid: 0, note: 'Déjà compté aujourd’hui : rien n’est déduit.' };
    var p = USAGE[kind], pl = planSpend([p]);
    if (pl.n < 1) return { ok: false, need: p };
    commitSpend(pl.total, label); U.seen[sk] = today(); saveUsage();
    return { ok: true, paid: pl.total, note: balNote(pl.total) };
  }
  /* Séries de questions : seules les questions payantes que le solde permet sont gardées. */
  function budgetQuestions(qs, unit) {
    if (isSub()) return { qs: qs, total: 0, dropped: 0 };
    var bal = U.bal, spent = windowSpent(), kept = [], total = 0;
    qs.forEach(function (q) {
      if (q.free) { kept.push(q); return; }
      var pay = Math.max(0, Math.min(unit, USAGE.cap - spent));
      if (pay > bal) return;
      bal -= pay; spent += pay; total += pay; kept.push(q);
    });
    return { qs: kept, total: total, dropped: qs.length - kept.length };
  }
  function noteBanner() { return S.route && S.route.note ? banner('info', '', esc(S.route.note)) : ''; }
  function goRecharge(msg) { nav({ n: 'plans', title: 'Crédit' }); S.need = msg; if (msg) notify('credit'); render(false); }
  function needMsg(need) { return 'Il te reste ' + htg(U.bal) + ' et il en faut ' + htg(need) + ' pour ouvrir ce contenu. Recharge ton crédit pour continuer.'; }
  function lockedMsg(kind) { return 'Ce contenu est payant (' + htg(USAGE[kind]) + '). Recharge ton crédit pour l’ouvrir.'; }

  /* Codes de recharge : KLC- + 112 octets (version 2, genre 4, fin de validité, code client, clé de contenu, montant, nonce, signature). */
  async function parseCredit(body) {
    if (!subtle) throw { code: 'crypto' };
    if (!/^[A-Za-z0-9_-]{150}$/.test(body)) throw { code: 'format' };
    var b = unb64u(body);
    if (b.length !== 112 || b[0] !== 2 || b[1] !== 4) throw { code: 'format' };
    var ok = await subtle.verify(ALG, await importPub(), b.slice(48), b.slice(0, 48));
    if (!ok) throw { code: 'signature' };
    var dv = new DataView(b.buffer);
    return { exp: dv.getUint32(2), tag: hex(b.slice(6, 10)), key: b.slice(10, 42), amount: dv.getUint16(42), nonce: hex(b.slice(44, 48)) };
  }
  function codeKind(raw) {
    var s = String(raw || '').replace(/\s+/g, ''), a = s.indexOf('KLK-'), c = s.indexOf('KLC-');
    if (a < 0 && c < 0) return null;
    if (c < 0) return 'plan'; if (a < 0) return 'credit';
    return c < a ? 'credit' : 'plan';
  }
  function extractCredit(raw) { var m = String(raw || '').replace(/\s+/g, '').match(/KLC-([A-Za-z0-9_-]{150})/); return m ? m[1] : null; }
  async function redeem(raw) {
    var body = extractCredit(raw);
    if (!body) throw { code: 'format' };
    var info = await parseCredit(body);
    if (info.exp * 1000 <= Date.now()) throw { code: 'expired', info: info };
    if (U.used.indexOf(info.nonce) !== -1) throw { code: 'used' };
    try { await unlock(info.key); } catch (e) { throw { code: 'key' }; }
    U.bal += info.amount; U.used = U.used.concat([info.nonce]).slice(-200);
    logUse('Recharge', info.amount, true); saveUsage();
    store.set('ccode', 'KLC-' + body);
    return info;
  }
  async function issueCredit(amount, tag) {
    var adm = await admLoad(), now = Math.floor(Date.now() / 1000), exp = now + 90 * 86400;
    var buf = new Uint8Array(48), dv = new DataView(buf.buffer);
    buf[0] = 2; buf[1] = 4; dv.setUint32(2, exp); buf.set(unhex(tag), 6); buf.set(adm.k, 10); dv.setUint16(42, amount); buf.set(randBytes(4), 44);
    var sig = new Uint8Array(await subtle.sign(ALG, adm.pk, buf)), out = new Uint8Array(112);
    out.set(buf, 0); out.set(sig, 48);
    return { code: 'KLC-' + b64u(out), exp: exp, credit: amount };
  }
  function creditCard(inPlans) {
    if (!U.used.length && !(U.bal > 0)) {
      if (inPlans) return '';
      return '<div class="card stack"><span class="label">Mon crédit</span><h3>' + htg(0) + '</h3><p class="small muted">Les contenus gratuits restent gratuits. Le reste se paie à l’usage, à partir de ' + htg(USAGE.fiche) + ' la fiche, depuis un crédit que tu recharges par NatCash.</p><button class="btn" data-act="plans">Recharger mon crédit</button></div>';
    }
    var spent = windowSpent();
    var out = '<div class="card stack"><span class="label">Mon crédit</span><h3 style="color:' + (hasCredit() ? 'var(--ok)' : 'inherit') + '">' + htg(U.bal) + '</h3>' +
      '<p class="small muted">Dépensé sur 30 jours : ' + htg(spent) + ' sur ' + htg(USAGE.cap) + ' (plafond).' + (capActive() ? ' Plafond atteint : tout est gratuit jusqu’au ' + esc(dateFr(dateOfSec(capEnd() / 1000))) + '.' : '') + '</p>';
    if (U.log.length) out += '<div class="stack">' + U.log.slice(0, 5).map(function (l) {
      return '<p class="small">' + esc(dateFr(dateOfSec(l.at / 1000))) + ' · ' + esc(l.label) + ' : ' + (l.plus ? '+' + htg(l.amt) : l.amt ? '−' + htg(l.amt) : 'inclus') + '</p>';
    }).join('') + '</div>';
    return out + (inPlans ? '' : '<button class="btn sec" data-act="plans">Recharger mon crédit</button>') + '<p class="small muted">Ton solde est enregistré sur ce téléphone. Si tu effaces les données du navigateur, il est perdu.</p></div>';
  }
  function startDeck() {
    buildDeck(false);
    var d = S.deck;
    if (isSub() || !d.session.some(function (c) { return !c.free; })) return;

        } else {
          var r = await activate(S.form.code);
          S.form.code = '';
          S.act = r.kept ? { tone: 'info', msg: 'Ton forfait actuel dure plus longtemps que ce code : rien n’a changé.' } : { tone: 'ok', msg: 'Accès activé jusqu’au ' + dateFr(dateOfSec(S.sub.exp)) + '. Bonne révision !' };
          if (!r.kept) notify('active', { what: 'Forfait activé jusqu’au ' + dateFr(dateOfSec(S.sub.exp)) });
        }
      } catch (e) { S.act = { tone: 'alert', msg: errMsg(e) }; }
      render(false);
    },
    /* administration */
    admin: function () { S.adm = {}; S.admErr = ''; S.admOut = false; nav({ n: 'admin', title: 'Administration' }); },
    'adm-login': async function () {
      S.admErr = '';
      var raw = S.form.admkey || '';
      store.set('adm', raw.replace(/\s+/g, ''));
      try { await admLoad(); S.form.admkey = ''; } catch (e) { store.set('adm', null); S.admErr = errMsg(e); }
      render(false);
    },
    'adm-read': function () {
      var r = parseRequest(S.form.admreq);
      S.adm.out = null; S.adm.selfMsg = '';
      if (!r) { S.adm.req = null; S.adm.readErr = 'Message non reconnu. Demande au client de renvoyer le message préparé par ' + NAME + ', ou utilise « Générer un code à la main ».'; }
      else { S.adm.req = r; S.adm.readErr = ''; }
      render(false);
    },
    'adm-issue': async function () {
      var r = S.adm.req; if (!r) return;
      try {
        var o = r.plan.id === 'credit' ? await issueCredit(r.plan.price, r.tag) : await issue(r.plan.id, r.tag, lastExpFor(r.tag));
        journalAdd({ at: Date.now(), name: r.name, plan: r.plan.id, amt: r.plan.price, tx: r.tx, tag: r.tag, exp: o.exp });
        S.adm.out = { code: o.code, exp: o.exp, name: r.name, phone: r.phone, credit: o.credit || 0 }; S.adm.req = null; S.adm.readErr = ''; S.form.admreq = '';
      } catch (e) { S.adm.readErr = errMsg(e); }
      render(false);
      var b = document.getElementById('outbox'); if (b && b.scrollIntoView) b.scrollIntoView({ block: 'center', behavior: 'smooth' });
    },
    'adm-plan': function (d) { S.adm.mplan = d.id; render(false); },
    'adm-manual': async function () {
      var f = S.form, name = (f.mname || '').trim(), planId = S.adm.mplan || 'credit', amount = parseInt(String(f.mamount || '').replace(/\D/g, ''), 10);
      S.adm.manErr = '';
      if (name.length < 2) { S.adm.manErr = 'Écris le nom du client.'; render(false); return; }
      var tag = f.mtag && f.mtag.trim() ? tagParse(f.mtag) : hex(randBytes(4));
      if (!tag) { S.adm.manErr = 'Le code client doit avoir 8 caractères (chiffres et lettres de A à F), par exemple 1A2B-3C4D.'; render(false); return; }
      if (planId === 'credit' && !(amount >= 10 && amount <= 5000)) { S.adm.manErr = 'Écris un montant entre 10 et 5 000 HTG.'; render(false); return; }
      try {
        var o = planId === 'credit' ? await issueCredit(amount, tag) : await issue(planId, tag, lastExpFor(tag)), plan = planById(planId);
        journalAdd({ at: Date.now(), name: name, plan: planId, amt: planId === 'credit' ? amount : plan.price, tx: (f.mtx || '').trim(), tag: tag, exp: o.exp });
        S.adm.out = { code: o.code, exp: o.exp, name: name, phone: normPhone(f.mphone), credit: o.credit || 0 };
        S.form.mname = ''; S.form.mtx = ''; S.form.mphone = ''; S.form.mtag = ''; S.form.mamount = '';
      } catch (e) { S.adm.manErr = errMsg(e); }
      render(false);
      var b = document.getElementById('outbox'); if (b && b.scrollIntoView) b.scrollIntoView({ block: 'center', behavior: 'smooth' });
    },
    'adm-self': async function () {
      try {
        var tag = clientTag(), o = await issue('annuel', tag, lastExpFor(tag));
        journalAdd({ at: Date.now(), name: AUTHOR + ' (moi)', plan: 'annuel', amt: 0, tx: '', tag: tag, exp: o.exp });
        await activate(o.code);
        S.adm.selfMsg = 'Accès complet activé jusqu’au ' + dateFr(dateOfSec(S.sub.exp)) + '.';
      } catch (e) { S.adm.selfMsg = ''; S.adm.manErr = errMsg(e); }
      render(false);
    },
    'adm-stats': function () { loadStats(); render(false); },
    'adm-ntest': function () {
      var ok = pingRaw('Test Klinik', 'Si tu lis ceci, les notifications marchent (' + today() + ').', 3, 'tada');
      S.adm.ntMsg = ok ? 'Notification de test envoyée. Elle arrive en quelques secondes si ntfy est installé et abonné au sujet ci-dessus.' : 'Impossible d’envoyer depuis ce navigateur.';
      render(false);
    },
    'adm-logout': function () { S.admOut = true; render(false); },
    'adm-logout-no': function () { S.admOut = false; render(false); },
    'adm-logout-yes': function () { store.set('adm', null); S.admOut = false; S.adm = {}; render(false); },
    go: function (d) {
      var id = d.id;
      if (id === 'cases') nav({ n: 'cases', title: 'Cas cliniques' });
      else if (id.indexOf('quizsetup:') === 0) nav({ n: 'quizsetup', mode: id.split(':')[1], title: id.split(':')[1] === 'concours' ? 'Mode concours' : 'QCM rapides' });
      else if (id === 'cards') { startDeck(); nav({ n: 'cards', title: 'Cartes de révision' }); }
      else if (id === 'checks') nav({ n: 'checks', title: 'Listes de vérification' });
      else if (id === 'sources') nav({ n: 'sources', title: 'Sources' });
      else if (id === 'about') nav({ n: 'about', title: 'À propos' });
      else if (id === 'news') { if (DATA.news && DATA.news.length) store.set('newsSeen', DATA.news[0].id); nav({ n: 'news', title: 'Nouveautés' }); }
    },
    /* cas */
    case: function (d) {
      var c = DATA.cases.filter(function (x) { return x.id === d.id; })[0]; if (!c) return;
      if (!canSee(c)) { goRecharge(lockedMsg('cas')); return; }
      var ch = c.free ? { ok: true, note: '' } : chargeItem('cas', c.id, 'Cas : ' + c.title);
      if (!ch.ok) { goRecharge(needMsg(ch.need)); return; }
      S.kase = { id: c.id, step: -1, answers: [], revealed: false, saved: false };
      nav({ n: 'case', title: c.title, note: ch.note });
    },
    'case-go': function () { S.kase.step = 0; render(true); },
    'case-pick': function (d) { var k = S.kase; if (k.revealed) return; k.answers[k.step] = +d.i; k.revealed = true; render(false); revealFeedback(); },
    'case-next': function () {
      var k = S.kase, c = caseOf(); k.revealed = false; k.step += 1;
      if (k.step >= c.steps.length && !k.saved) {
        k.saved = true;
        addResult('cas', 'cas:' + c.id, c.title, c.steps.filter(function (s, i) { return k.answers[i] === s.correct; }).length, c.steps.length);
      }
      render(true);
    },
    'case-again': function () { S.route.note = ''; S.kase = { id: S.kase.id, step: -1, answers: [], revealed: false, saved: false }; render(true); },
    /* QCM / concours */
    'setup-sys': function (d) { S.setup.system = d.id || null; render(false); },
    'setup-count': function (d) { S.setup.count = +d.id; render(false); },
    'quiz-start': startQuiz,
    'quiz-pick': function (d) {
      var q = S.quiz; if (!q || q.done) return;
      if (q.mode !== 'concours') { if (q.revealed) return; q.answers[q.idx] = +d.i; q.revealed = true; render(false); revealFeedback(); }
      else { q.answers[q.idx] = +d.i; render(false); }
    },
    'quiz-next': function () { var q = S.quiz; q.revealed = false; if (q.idx >= q.qs.length - 1) finishQuiz(); else { q.idx += 1; render(true); } },
    'quiz-prev': function () { S.quiz.idx = Math.max(0, S.quiz.idx - 1); render(true); },
    'quiz-skip': function () { S.quiz.idx = Math.min(S.quiz.qs.length - 1, S.quiz.idx + 1); render(true); },
    'quiz-finish': function () {
      var q = S.quiz; if (q.answers.every(function (a) { return a !== null; })) finishQuiz(); else { q.confirm = true; render(false); }
    },
    'quiz-cancel': function () { S.quiz.confirm = false; render(false); },
    'quiz-finish-now': function () { S.quiz.confirm = false; finishQuiz(); },
    'quiz-again': function () { startQuiz(); },
    'quiz-exit': function () { stopTimer(); S.stack = []; S.route = { n: 'tab' }; S.tab = 'train'; render(true); },
    /* cartes */
    'card-flip': function () { S.deck.flip = true; render(false); },
    'card-rate': function (d) {
      var dk = S.deck, c = dk.session[dk.pos], ok = d.ok === '1', st = S.cards[c.id];
      var box = ok ? Math.min((st ? st.box : 0) + 1, LEITNER.length - 1) : 0;
      S.cards[c.id] = { box: box, dueAt: Date.now() + LEITNER[box] * DAY }; store.set('cards', S.cards);
      if (ok) dk.known += 1;
      if (dk.pos + 1 >= dk.session.length) dk.done = true; else { dk.pos += 1; dk.flip = false; }
      render(true);
    },
    'cards-again': function () { startDeck(); render(true); },
    /* listes de vérification */
    check: function (d) {
      var f = ficheById(d.id); if (!f) return;
      if (!canSee(f)) { goRecharge(lockedMsg('check')); return; }
      var ch = f.free ? { ok: true, note: '' } : chargeItem('check', f.id, 'Liste : ' + f.title);
      if (!ch.ok) { goRecharge(needMsg(ch.need)); return; }
      S.check = { id: f.id, done: checkItems(f).map(function () { return false; }), finished: false };
      nav({ n: 'check', title: 'Examen clinique', note: ch.note });
    },
    'check-toggle': function (d) { S.check.done[+d.i] = !S.check.done[+d.i]; render(false); },
    'check-finish': function () {
      var c = S.check, f = ficheById(c.id); c.finished = true;
      addResult('checklist', 'check:' + f.id, f.title, c.done.filter(Boolean).length, c.done.length); render(true);
    },
    'check-again': function () { S.route.note = ''; var f = ficheById(S.check.id); S.check = { id: f.id, done: checkItems(f).map(function () { return false; }), finished: false }; render(true); },
    /* profil */
    'reset-ask': function () { S.resetAsk = true; render(false); },
    'reset-no': function () { S.resetAsk = false; render(false); },
    'reset-yes': function () { S.history = []; S.cards = {}; store.set('history', []); store.set('cards', {}); S.resetAsk = false; render(false); }
  };

  app.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var fn = A[el.getAttribute('data-act')];
    if (fn) fn(el.dataset);
  });
  app.addEventListener('input', function (e) {
    var t = e.target; if (!t) return;
    if (t.id === 'q') {
      S.q = t.value;
      var box = document.getElementById('flist'); if (box) box.innerHTML = ficheListHtml();
    } else if (t.dataset && t.dataset.f) {
      S.form[t.dataset.f] = t.value;
      if (t.dataset.f === 'name' || t.dataset.f === 'phone') store.set('form', { name: S.form.name, phone: S.form.phone });
    }
  });

  render(true);
  notifyVisit();
  (async function () {
    if (!subtle) return;
    var raw = store.get('code', null);
    if (raw) {
      try { await activate(raw); render(false); }
      catch (e) { if (e && e.code === 'expired' && e.info) { S.sub = { plan: e.info.plan, exp: e.info.exp, tag: e.info.tag }; render(false); } }
    }
    var cc = store.get('ccode', null);
    if (cc && (U.bal > 0 || capActive())) {
      try { var ci = await parseCredit(extractCredit(cc)); await unlock(ci.key); render(false); } catch (e) { /* ignoré */ }
    }
  })();
})();
</script>

</body></html>
