<title>Klinik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Mise en page : une colonne mobile, barre d'onglets en bas, en-tête sur papier millimétré d'ECG.
   Couleurs : encre bleu-vert, vert sarcelle pour l'action, rouge réservé aux signes d'alarme.
   Polices : Bricolage Grotesque (titres), Atkinson Hyperlegible (texte, conçue pour la lisibilité), Plex Mono (chiffres). */
:root{
  --bg:#F2F7F7; --surface:#FFFFFF; --ink:#0F2329; --muted:#476067; --line:#D3E0E2; --grid:rgba(14,107,102,.09);
  --brand:#0E6B66; --brand-ink:#FFFFFF; --brand-soft:#DCF0EE;
  --alert:#A8231B; --alert-bg:#FDEDEB; --warn:#7E4300; --warn-bg:#FFF3DC;
  --ok:#185F35; --ok-bg:#E4F4EA; --info:#1B4A97; --info-bg:#E7EFFC;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1519; --surface:#10222A; --ink:#E5EFF0; --muted:#9EB5BB; --line:#23393F; --grid:rgba(56,209,193,.07);
    --brand:#38D1C1; --brand-ink:#04211E; --brand-soft:#123436;
    --alert:#FFA8A0; --alert-bg:#341719; --warn:#FFCC72; --warn-bg:#2E2208;
    --ok:#8DE3A8; --ok-bg:#0F2B1B; --info:#9DC2FF; --info-bg:#11233F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1519; --surface:#10222A; --ink:#E5EFF0; --muted:#9EB5BB; --line:#23393F; --grid:rgba(56,209,193,.07);
  --brand:#38D1C1; --brand-ink:#04211E; --brand-soft:#123436;
  --alert:#FFA8A0; --alert-bg:#341719; --warn:#FFCC72; --warn-bg:#2E2208;
  --ok:#8DE3A8; --ok-bg:#0F2B1B; --info:#9DC2FF; --info-bg:#11233F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:29px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:680px;margin-inline:auto;padding-inline:16px;padding-block:0 104px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* En-tête */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.wm{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--brand);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.wm svg{width:46px;height:18px;flex:none}
.by{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 9px;white-space:nowrap}
.back{display:flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--brand);font-weight:700;padding:0 8px 0 0;cursor:pointer}
.back svg{width:20px;height:20px}
.bar-title{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;max-width:680px;margin-inline:auto}
.tab{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand)}

/* Composants */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:block;width:100%;text-align:left;min-width:0}
button.card{cursor:pointer}
button.card:active{background:var(--brand-soft)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.between>*{min-width:0}
.between>:last-child{flex:none}
.between>h3{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.info{color:var(--info)} .badge.alert{color:var(--alert)}
.badge svg{width:12px;height:12px}
.banner{border:1px solid currentColor;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.banner.info{color:var(--info);background:var(--info-bg)} .banner.warn{color:var(--warn);background:var(--warn-bg)}
.banner.alert{color:var(--alert);background:var(--alert-bg)} .banner.ok{color:var(--ok);background:var(--ok-bg)}
.banner .t{font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.banner ul,.banner ol{color:var(--ink)}
.btn{min-height:50px;width:100%;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;padding:10px 18px;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand);border-color:var(--line)}
.btn.danger{background:var(--alert-bg);color:var(--alert);border-color:var(--alert)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:12px}.btn-row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:400}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
input[type=search],input[type=text],input[type=password]{width:100%;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand)}
ul.b,ol.b{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:8px}
ol.b{padding-left:1.5em}
.doc{display:flex;flex-direction:column;gap:16px}
.doc section{display:flex;flex-direction:column;gap:10px}
.pearls{background:var(--brand-soft);border-color:var(--brand)}
.lead{color:var(--muted)}
.refs{display:flex;flex-direction:column;gap:6px}
.refs a{display:block;padding:6px 0;overflow-wrap:anywhere}
.sig{text-align:center;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted)}

/* Choix de réponse */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.opt .mk{flex:none;width:26px;font-family:var(--f-mono);font-weight:500}
.opt.sel{border:2px solid var(--brand);background:var(--brand-soft);padding:11px 13px}
.opt.right{border:2px solid var(--ok);background:var(--ok-bg);padding:11px 13px}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border:2px solid var(--alert);background:var(--alert-bg);padding:11px 13px}
.opt.wrong .mk{color:var(--alert)}
.opt.dim{opacity:.65}
.opt:disabled{cursor:default;color:var(--ink)}
.q-prompt{font-size:18px}
.clock{font-family:var(--f-mono);font-weight:500;font-size:22px}
.clock.low{color:var(--alert)}
.score{font-family:var(--f-display);font-weight:800;font-size:34px}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:54px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.check .bx{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.check[aria-checked="true"]{border:2px solid var(--brand);background:var(--brand-soft);padding:11px 13px}
.check[aria-checked="true"] .bx{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.check .bx svg{width:16px;height:16px;display:none}
.check[aria-checked="true"] .bx svg{display:block}
.gate{display:flex;flex-direction:column;gap:16px;padding-top:32px}
.gate .wm{font-size:44px;justify-content:center}
.gate .by{text-align:center}
.plan{border:1px solid var(--line)}
.plan[aria-pressed="true"]{border:2px solid var(--brand);padding:15px}
.price{font-family:var(--f-mono);font-weight:500;font-size:19px;color:var(--brand);white-space:nowrap}
.empty{text-align:center;padding:32px 8px}

/* Paiement par code */
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
a.btn:not(.sec){color:var(--brand-ink)} a.btn.sec{color:var(--brand)}
.fld{display:flex;flex-direction:column;gap:6px}
input[type=tel],textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
input[type=tel]{min-height:50px;padding:0 14px}
textarea{padding:12px 14px;min-height:96px;resize:vertical;font-family:var(--f-mono);font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.num{font-size:28px;font-weight:500;letter-spacing:.02em;color:var(--brand)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;cursor:pointer;font-size:14px}
.pill.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
@media (prefers-reduced-motion:no-preference){.opt,.card,.btn{transition:background-color .15s,border-color .15s}}
</style>

"rm":4,"sc":8,"locked":true},{"id":"abdo-douleur-aigue","system":"abdo","title":"Douleur abdominale aiguë : orientation par localisation","summary":"Raisonner par quadrant, repérer les urgences chirurgicales et vasculaires, ne pas oublier les causes extra-abdominales.","keywords":["douleur abdominale","appendicite","cholécystite","pancréatite","occlusion","colique néphrétique","diverticulite","grossesse extra-utérine","perforation","péritonite"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":5,"locked":true},{"id":"general-signes-vitaux","system":"general","title":"Signes vitaux et scores d’alerte","summary":"Prendre, interpréter et noter les constantes ; repérer un patient qui se dégrade (NEWS2, qSOFA).","keywords":["constantes","signes vitaux","NEWS2","qSOFA","TA","fréquence cardiaque","SpO2","température","dégradation"],"free":true,"updatedAt":"2026-10-05","reviewed":false,"sections":[{"heading":"Les sept constantes à relever","kind":"steps","items":["Fréquence respiratoire : compter pendant 60 secondes, sans prévenir le patient (il modifierait sa respiration). C’est le signe vital le plus souvent négligé et l’un des plus précoces dans la dégradation.","Saturation en oxygène (SpO2) : doigt propre, chaud, sans vernis foncé ; noter si le patient est sous air ambiant ou sous oxygène (et le débit).","Tension artérielle : brassard adapté au bras, patient au repos depuis quelques minutes, bras au niveau du cœur. Mesurer aux deux bras lors d’une première évaluation ou si une dissection aortique est suspectée.","Fréquence cardiaque : palper le pouls radial 30 à 60 secondes ; noter fréquence, régularité, amplitude. Un pouls irrégulier nécessite un ECG.","Température : noter la voie de mesure ; une fièvre est habituellement définie par une température ≥ 38,0 °C.","État de conscience : alerte, réagit à la voix, réagit à la douleur, ne réagit pas (échelle AVPU) ; toute confusion nouvelle est un signe de gravité.","Glycémie capillaire : à faire devant toute altération de la conscience ou tout déficit neurologique brutal."]},{"heading":"Valeurs de repos habituelles chez l’adulte (repères, pas des normes absolues)","kind":"signs","items":["Fréquence respiratoire : environ 12 à 20 par minute.","Fréquence cardiaque : environ 60 à 100 par minute au repos.","SpO2 : ≥ 94 à 96 % sous air ambiant chez un adulte sans maladie pulmonaire chronique.","Chez un patient à risque d’insuffisance respiratoire hypercapnique (par exemple BPCO sévère), la cible d’oxygénothérapie recommandée est plus basse : 88 à 92 %.","Tension artérielle systolique : une valeur ≤ 100 mmHg avec signes de mauvaise perfusion doit alerter, même si le patient « parle bien »."]},{"heading":"Signes qui doivent faire appeler à l’aide immédiatement","kind":"redflags","items":["Fréquence respiratoire ≥ 25 par minute, ou ≤ 8, ou épuisement respiratoire.","SpO2 basse ou en baisse malgré l’oxygène ; cyanose.","Tension artérielle systolique ≤ 90 mmHg, ou chute importante par rapport à la valeur habituelle du patient.","Fréquence cardiaque > 130 ou ≤ 40 par minute, surtout avec symptômes.","Confusion nouvelle, somnolence, agitation inhabituelle.","Extrémités froides et marbrées, temps de recoloration cutanée allongé, urines très rares : signes de choc.","« Le patient m’inquiète » : l’inquiétude d’une infirmière ou d’un étudiant expérimenté est un signal valable, même si les chiffres semblent corrects."]},{"heading":"Scores d’alerte : à quoi ils servent","kind":"text","items":["NEWS2 (Royal College of Physicians, 2017) additionne des points pour la fréquence respiratoire, la SpO2, l’oxygène, la tension systolique, la fréquence cardiaque, la conscience et la température. Plus le score est élevé, plus la réponse doit être rapide et expérimentée ; un seul paramètre extrême suffit à déclencher une alerte. Il se calcule avec une grille, à garder à portée de main.","qSOFA est un repère rapide en dehors de la réanimation : fréquence respiratoire ≥ 22, altération de la conscience, tension systolique ≤ 100 mmHg. Deux critères ou plus indiquent un risque accru d’évolution défavorable en cas d’infection suspectée.","Les recommandations Surviving Sepsis Campaign 2021 déconseillent d’utiliser le qSOFA seul comme outil de dépistage du sepsis, car il est moins sensible que SIRS, NEWS ou MEWS. Un qSOFA négatif ne rassure donc pas : en cas de doute, faire une évaluation complète."]},{"heading":"Pièges fréquents","kind":"pearls","items":["Une tachycardie ou une tachypnée inexpliquée précède souvent l’hypotension : ne pas attendre que la tension chute.","Les bêta-bloquants, l’âge avancé et la grossesse peuvent masquer ou modifier la réponse du pouls.","Une SpO2 « normale » n’exclut pas une détresse : un patient qui compense par une respiration rapide peut garder une SpO2 correcte jusqu’à l’épuisement.","Toujours noter l’heure, la valeur et les conditions de mesure : une tendance sur plusieurs mesures vaut mieux qu’un chiffre isolé."]}],"references":[{"label":"Royal College of Physicians. National Early Warning Score (NEWS) 2. Londres, 2017.","url":"https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"},{"label":"Evans L, et al. Surviving Sepsis Campaign : International Guidelines for Management of Sepsis and Septic Shock 2021. Crit Care Med 2021.","url":"https://doi.org/10.1097/CCM.0000000000005337"},{"label":"Singer M, et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA 2016.","url":"https://doi.org/10.1001/jama.2016.0287"},{"label":"O’Driscoll BR, et al. BTS guideline for oxygen use in adults in healthcare and emergency settings. Thorax 2017.","url":"https://doi.org/10.1136/thoraxjnl-2016-209729"}],"rm":4,"sc":7},{"id":"general-fievre-sepsis","system":"general","title":"Fièvre et signes de gravité : penser au sepsis","summary":"Évaluer un patient fébrile : foyers à rechercher, signes de choc, maladies tropicales à ne pas manquer.","keywords":["fièvre","sepsis","choc septique","méningite","purpura","paludisme","dengue","typhoïde","leptospirose","tuberculose","foyer infectieux"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":4,"sc":6,"locked":true},{"id":"neuro-conscience-glasgow","system":"neuro","title":"Évaluation de la conscience : échelle de Glasgow","summary":"Calculer et noter le score de Glasgow (yeux, verbal, moteur), l’AVPU, et savoir quand c’est une urgence.","keywords":["Glasgow","GCS","coma","conscience","AVPU","pupilles","traumatisme crânien","confusion","glycémie"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":6,"locked":true},{"id":"neuro-deficit-avc","system":"neuro","title":"Déficit neurologique brutal : reconnaître un AVC","summary":"BE-FAST, heure de début, glycémie, diagnostics différentiels et urgence de la prise en charge.","keywords":["AVC","accident vasculaire cérébral","BE-FAST","FAST","hémiplégie","aphasie","paralysie faciale","thrombolyse","NIHSS","hypoglycémie"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":7,"locked":true},{"id":"respi-dyspnee","system":"respi","title":"Dyspnée : approche sémiologique","summary":"Évaluer la gravité, caractériser la dyspnée, orienter vers une cause cardiaque, pulmonaire ou autre.","keywords":["dyspnée","essoufflement","détresse respiratoire","mMRC","orthopnée","asthme","BPCO","embolie pulmonaire","pneumothorax","stridor"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":6,"locked":true},{"id":"respi-examen","system":"respi","title":"Examen respiratoire et grands syndromes","summary":"Inspection, palpation, percussion, auscultation, puis reconnaître condensation, épanchement, pneumothorax et syndrome bronchique.","keywords":["examen pulmonaire","auscultation","crépitants","sibilants","souffle tubaire","vibrations vocales","matité","épanchement pleural","pneumothorax","condensation"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":5,"locked":true}],"cases":[{"id":"cas-sepsis-urinaire","title":"Une patiente âgée fébrile et confuse","system":"general","level":"debutant","free":true,"tags":["sepsis","constantes","urgences"],"summary":"Fièvre, confusion et hypotension chez une femme de 72 ans : reconnaître les signes de gravité et le foyer.","intro":"Salle d’urgence. Une femme de 72 ans, diabétique, est amenée par sa fille : fièvre depuis deux jours, brûlures en urinant. Depuis ce matin elle est « bizarre » et ne reconnaît plus sa fille.","ficheIds":["general-signes-vitaux","general-fievre-sepsis"],"steps":[{"reveal":"Constantes : température 38,9 °C, fréquence cardiaque 118/min, fréquence respiratoire 26/min, tension 88/50 mmHg, SpO2 94 % à l’air ambiant. Glasgow 14 (réponse verbale confuse). Extrémités froides, marbrures aux genoux. Elle n’a presque pas uriné depuis hier.","question":"Quelle est votre première impression ?","options":["Une fièvre banale : donner du paracétamol et rassurer la famille","Des signes de gravité évoquant un sepsis avec mauvaise perfusion : évaluation immédiate et appel d’un médecin senior","Une anxiété liée à l’hospitalisation","Une simple déshydratation sans urgence"],"correct":1,"explanation":"Fréquence respiratoire élevée, confusion, tension basse, marbrures et oligurie traduisent une défaillance de perfusion. Il faut agir sans attendre, pas rassurer."},{"reveal":"Vous complétez l’évaluation avec les repères d’alerte.","question":"Combien de critères qSOFA cette patiente présente-t-elle ?","options":["0","1","2","3"],"correct":3,"explanation":"Fréquence respiratoire 26 (≥ 22), altération de la conscience (Glasgow 14) et tension systolique 88 (≤ 100) : les trois critères sont présents. Rappel : la Surviving Sepsis Campaign 2021 déconseille de s’appuyer sur le qSOFA seul, car un score négatif ne rassure pas."},{"reveal":"Examen : abdomen souple, douleur à l’ébranlement de la fosse lombaire droite. Bandelette urinaire : leucocytes et nitrites positifs. Pas de raideur de nuque, pas de purpura, poumons clairs, peau saine.","question":"Quel est le foyer infectieux le plus probable ?","options":["Pneumonie","Pyélonéphrite (infection urinaire haute)","Méningite","Cellulite d’un membre"],"correct":1,"explanation":"Fièvre, brûlures mictionnelles, douleur lombaire à l’ébranlement et bandelette positive : pyélonéphrite. L’absence de signe méningé, de purpura, de toux et de lésion cutanée écarte les autres foyers à ce stade."},{"reveal":"Le médecin arrive dans quinze minutes. Vous êtes seul avec la patiente.","question":"Que faites-vous en attendant ?","options":["La renvoyer à domicile avec un antibiotique par voie orale","La mettre sous surveillance rapprochée : scope, voie veineuse, glycémie capillaire, oxygène si besoin, prélèvements (hémocultures avant l’antibiotique si cela ne retarde pas le traitement), et préparer le traitement rapide","Attendre les résultats d’une imagerie avant tout traitement","Donner un antipyrétique et la réévaluer dans six heures"],"correct":1,"explanation":"Le sepsis est une urgence dépendante du temps : surveillance continue, accès veineux, glycémie, prélèvements, puis antibiotique rapide (idéalement dans l’heure en cas de choc septique ou de forte probabilité de sepsis, selon la Surviving Sepsis Campaign 2021)."}],"debrief":{"keyPoints":["Fréquence respiratoire, conscience et tension suffisent à repérer un patient en danger : mesurez-les, notez-les, répétez-les.","Chez la personne âgée, la confusion est souvent le premier signe d’une infection grave, parfois sans fièvre élevée.","Les marbrures, les extrémités froides et l’oligurie signent la mauvaise perfusion.","Un qSOFA négatif ne rassure jamais seul ; un patient qui vous inquiète mérite une évaluation complète."]},"references":[{"label":"Evans L, et al. Surviving Sepsis Campaign : International Guidelines 2021. Crit Care Med 2021.","url":"https://doi.org/10.1097/CCM.0000000000005337"},{"label":"Singer M, et al. Sepsis-3. JAMA 2016;315:801-810.","url":"https://doi.org/10.1001/jama.2016.0287"},{"label":"Royal College of Physicians. NEWS2, 2017.","url":"https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"}],"reviewed":false,"minutes":8,"n":4},{"id":"cas-douleur-thoracique-sca","title":"Oppression thoracique chez un chauffeur de 58 ans","system":"cardio","level":"intermediaire","free":false,"tags":["SCA","ECG","urgences","USMLE"],"summary":"Reconnaître un syndrome coronarien aigu, lire l’urgence de l’ECG et penser à l’atteinte du ventricule droit.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-dyspnee-bpco","title":"Un patient BPCO qui s’épuise","system":"respi","level":"intermediaire","free":false,"tags":["BPCO","oxygène","dyspnée","USMLE"],"summary":"Reconnaître la détresse respiratoire, fixer la bonne cible d’oxygène et ne pas s’arrêter au premier diagnostic.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-fosse-iliaque-droite","title":"Douleur de la fosse iliaque droite chez une jeune femme","system":"abdo","level":"intermediaire","free":false,"tags":["appendicite","abdomen aigu","USMLE"],"summary":"Raisonner sur une douleur migratrice, penser à la grossesse extra-utérine et reconnaître la péritonite.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-deficit-brutal-avc","title":"Bouche déviée et bras « mort » : un AVC ?","system":"neuro","level":"intermediaire","free":false,"tags":["AVC","BE-FAST","urgences","USMLE"],"summary":"Noter l’heure, éliminer l’hypoglycémie, reconnaître une atteinte centrale et orienter sans retard.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-insuffisance-cardiaque","title":"Essoufflement, chevilles gonflées et trois oreillers","system":"cardio","level":"debutant","free":false,"tags":["insuffisance cardiaque","examen clinique","USMLE"],"summary":"Reconnaître l’insuffisance cardiaque, décrire le profil clinique et chercher la cause de la décompensation.","reviewed":false,"minutes":8,"n":4,"locked":true}],"questions":[{"id":"q-gen-01","system":"general","ficheId":"general-signes-vitaux","free":true,"prompt":"Quelle constante est souvent négligée alors qu’elle est l’un des signes les plus précoces de dégradation ?","options":["La température","La fréquence respiratoire","Le poids","La glycémie capillaire"],"correct":1,"explanation":"La fréquence respiratoire est la constante la plus souvent oubliée et l’une des plus précoces à se modifier quand un patient se dégrade. Elle se compte pendant une minute entière.","format":"rapide"},{"id":"q-gen-02","system":"general","ficheId":"general-signes-vitaux","free":true,"prompt":"Comment mesurer correctement la fréquence respiratoire ?","options":["Compter pendant 15 secondes et multiplier par 4, en expliquant au patient ce que l’on fait","Compter pendant 60 secondes, sans prévenir le patient","La déduire de la saturation en oxygène","La déduire de la fréquence du pouls"],"correct":1,"explanation":"Si le patient sait qu’on observe sa respiration, il la modifie. On compte donc une minute entière, discrètement, par exemple en gardant la main sur son poignet comme pour prendre le pouls.","format":"rapide"},{"id":"q-gen-03","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"rapide","locked":true},{"id":"q-gen-04","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"rapide","locked":true},{"id":"q-gen-05","system":"general","ficheId":"general-signes-vitaux","free":false,"format":"rapide","locked":true},{"id":"q-gen-06","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"rapide","locked":true},{"id":"q-car-01","system":"cardio","ficheId":"cardio-douleur-thoracique","free":true,"prompt":"Devant une douleur thoracique suspecte, dans quel délai doit-on réaliser et interpréter un ECG 12 dérivations ?","options":["Dans les 10 minutes suivant le premier contact médical","Dans l’heure qui suit","Après le résultat de la troponine","Dans les 6 heures"],"correct":0,"explanation":"ESC 2023 et AHA/ACC 2021 : ECG dans les 10 minutes suivant le premier contact médical. On n’attend pas la troponine.","format":"rapide"},{"id":"q-car-02","system":"cardio","ficheId":"cardio-douleur-thoracique","free":false,"format":"rapide","locked":true},{"id":"q-car-03","system":"cardio","ficheId":"cardio-douleur-thoracique","free":false,"format":"rapide","locked":true},{"id":"q-car-04","system":"cardio","ficheId":"cardio-examen","free":false,"format":"rapide","locked":true},{"id":"q-car-05","system":"cardio","ficheId":"cardio-examen","free":false,"format":"rapide","locked":true},{"id":"q-car-06","system":"cardio","ficheId":"cardio-insuffisance-cardiaque","free":false,"format":"rapide","locked":true},{"id":"q-car-07","system":"cardio","ficheId":"cardio-insuffisance-cardiaque","free":false,"format":"rapide","locked":true},{"id":"q-res-01","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-res-02","system":"respi","ficheId":"respi-examen","free":false,"format":"rapide","locked":true},{"id":"q-res-03","system":"respi","ficheId":"respi-examen","free":false,"format":"rapide","locked":true},{"id":"q-res-04","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-res-05","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-res-06","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-abd-01","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-abd-02","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-abd-03","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-abd-04","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"rapide","locked":true},{"id":"q-abd-05","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"rapide","locked":true},{"id":"q-abd-06","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-neu-01","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-neu-02","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-neu-03","system":"neuro","ficheId":"neuro-deficit-avc","free":true,"prompt":"Quel test rapide doit-on faire en premier devant une altération de la conscience ou un déficit neurologique brutal ?","options":["Une IRM cérébrale","Une glycémie capillaire","Une ponction lombaire","Un électroencéphalogramme"],"correct":1,"explanation":"L’hypoglycémie peut mimer un AVC et se corrige en quelques minutes. La glycémie capillaire est le test le plus rapide et le plus utile.","format":"rapide"},{"id":"q-neu-04","system":"neuro","ficheId":"neuro-deficit-avc","free":false,"format":"rapide","locked":true},{"id":"q-neu-05","system":"neuro","ficheId":"neuro-deficit-avc","free":false,"format":"rapide","locked":true},{"id":"q-neu-06","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-neu-07","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-vig-01","system":"cardio","ficheId":"cardio-douleur-thoracique","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-02","system":"cardio","ficheId":"cardio-examen","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-03","system":"cardio","ficheId":"cardio-douleur-thoracique","free":true,"format":"vignette","tags":["USMLE","concours"],"prompt":"Un homme de 34 ans, après une infection virale, présente une douleur thoracique aiguë qui augmente à l’inspiration et en position couchée, et diminue penché en avant. Un frottement péricardique est audible. L’ECG montre un sus-décalage diffus et concave du ST avec un sous-décalage du PR. Quel est le diagnostic ?","options":["Infarctus du myocarde antérieur","Péricardite aiguë","Embolie pulmonaire","Dissection aortique"],"correct":1,"explanation":"Douleur pleurale et positionnelle, frottement péricardique et sus-décalage diffus et concave du ST : péricardite aiguë. Dans l’infarctus, le sus-décalage est localisé à un territoire, avec image en miroir."},{"id":"q-vig-04","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-05","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-06","system":"respi","ficheId":"respi-examen","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-07","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-08","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-09","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-10","system":"neuro","ficheId":"neuro-deficit-avc","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-11","system":"neuro","ficheId":"general-fievre-sepsis","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-12","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-13","system":"cardio","ficheId":"cardio-insuffisance-cardiaque","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true}],"sources":{"policy":"Les fiches, les cas cliniques et les questions de Klinik sont rédigés de façon originale à partir de recommandations et de publications scientifiques citées dans l’application. Klinik ne copie ni ne reproduit le contenu de ressources   var EXAM_NOTICE = 'Questions originales rédigées pour Klinik dans le style des examens (cas clinique, une seule bonne réponse). Ce ne sont pas des questions officielles de l’USMLE, de Kaplan ou d’un concours de résidence.';
  var PLANS = [
    { id: 'mensuel', label: 'Mensuel', price: 500, days: 30 },
    { id: 'trimestriel', label: 'Trimestriel', price: 1200, days: 90 },
    { id: 'annuel', label: 'Annuel', price: 4000, days: 365 }
  ];
  var DECK_KINDS = ['redflags', 'pearls', 'differential', 'signs'];
  var LEITNER = [0, 1, 3, 7, 14, 30];
  var DAY = 86400000;

  /* ---------- Outils ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’']/g, ' ').replace(/\s+/g, ' ').trim(); }
  function htg(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' HTG'; }
  var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function dateFr(iso) { var p = String(iso).split('-'); return p.length === 3 ? (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0] : ''; }
  function clock(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
  function rnd(n) {
    if (window.crypto && crypto.getRandomValues) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sysLabel(id) { var s = DATA.systems.filter(function (x) { return x.id === id; })[0]; return s ? s.label : id; }
  function ficheById(id) { return DATA.fiches.filter(function (f) { return f.id === id; })[0]; }
  function readMin(f) { if (f.rm) return f.rm; return Math.max(1, Math.ceil(JSON.stringify(f.sections).split(/\s+/).length / 180)); }
  function stepsCount(f) { if (f.sc != null) return f.sc; return f.sections.filter(function (s) { return s.kind === 'steps'; }).reduce(function (n, s) { return n + s.items.length; }, 0); }

  /* ---------- Stockage (confort : la page fonctionne aussi sans) ---------- */
  var mem = {};
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem('klinik:' + k); if (v !== null) return JSON.parse(v); } catch (e) { /* stockage indisponible */ }
      return k in mem ? mem[k] : d;
    },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem('klinik:' + k, JSON.stringify(v)); } catch (e) { /* ignoré */ } }
  };

  /* ---------- État ---------- */
  var S = {
    tab: 'fiches', route: { n: 'tab' }, stack: [],
    accepted: store.get('ok', false), sub: false,
    q: '', sys: null, plan: 'trimestriel', mode: 'credit', topup: 100, need: '', unlocked: false, form: Object.assign({ name: '', phone: '', tx: '', code: '', admkey: '', admreq: '', mname: '', mtx: '', mphone: '', mtag: '', mamount: '' }, store.get('form', {})),
    act: null, req: null, reqErr: '', copied: null, adm: {}, admErr: '', admOut: false,
    history: store.get('history', []), cards: store.get('cards', {}),
    setup: { system: null, count: 10 }, resetAsk: false,
    kase: null, quiz: null, deck: null, check: null, timer: null
  };

  /* ---------- Paiement NatCash et codes d'accès ----------
     Principe : le client paie par NatCash, envoie sa demande (nom + numéro de transaction), l'administrateur
     vérifie le SMS NatCash puis génère un code signé. Le code contient la clé qui ouvre le contenu payant
     et une date de fin. Sans code signé par l'administrateur, le contenu payant reste chiffré. */
  var PAY = { number: '50940724822', shown: '509 4072 4822' };
  var TRIAL = { id: 'essai', label: 'Essai 7 jours', price: 0, days: 7 };
  var PLAN_IDX = ['mensuel', 'trimestriel', 'annuel', 'essai'];
  var CREDIT = { id: 'credit', label: 'Recharge de crédit', price: 0, days: 0 };
  function planById(id) { return PLANS.concat([TRIAL, CREDIT]).filter(function (p) { return p.id === id; })[0]; }
  var enc = new TextEncoder(), dec = new TextDecoder();
  var subtle = (window.crypto && window.crypto.subtle) || null;
  var ALG = { name: 'ECDSA', hash: 'SHA-256' }, CURVE = { name: 'ECDSA', namedCurve: 'P-256' };

  function b64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function unb64u(str) { str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; var s = atob(str), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
  function hex(b) { var s = ''; for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2); return s; }
  function unhex(h) { var b = new Uint8Array(h.length / 2); for (var i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16); return b; }
  function randBytes(n) { var a = new Uint8Array(n); if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); return a; }
  function clientTag() { var t = store.get('cid', null); if (!t || !/^[0-9a-f]{8}$/.test(t)) { t = hex(randBytes(4)); store.set('cid', t); } return t; }
  function tagFmt(t) { return t.slice(0, 4).toUpperCase() + '-' + t.slice(4).toUpperCase(); }
  function tagParse(s) { var h = String(s || '').replace(/[^0-9a-fA-F]/g, '').toLowerCase(); return h.length === 8 ? h : null; }
  function dateOfSec(sec) { var d = new Date(sec * 1000); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function isSub() { return !!(S.sub && S.sub.exp * 1000 > Date.now()); }
  function daysLeft() { return S.sub ? Math.max(0, Math.ceil((S.sub.exp * 1000 - Date.now()) / DAY)) : 0; }

  function importPub() { return subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: DATA.sec.x, y: DATA.sec.y, ext: true }, CURVE, false, ['verify']); }

  /* Lit un code : forme, signature de l'administrateur. Ne regarde pas encore la date. */
  async function parseCode(body) {
    if (!subtle) throw { code: 'crypto' };
    if (!/^[A-Za-z0-9_-]{142}$/.test(body)) throw { code: 'format' };
    var b = unb64u(body);
    if (b.length !== 106 || b[0] !== 1) throw { code: 'format' };
    var ok = await subtle.verify(ALG, await importPub(), b.slice(42), b.slice(0, 42));
    if (!ok) throw { code: 'signature' };
    return { plan: PLAN_IDX[b[1]] || 'mensuel', exp: new DataView(b.buffer).getUint32(2), tag: hex(b.slice(6, 10)), key: b.slice(10, 42) };
  }
  function extractCode(raw) { var m = String(raw || '').replace(/\s+/g, '').match(/KLK-([A-Za-z0-9_-]{142})/); return m ? m[1] : null; }

  /* Déchiffre le contenu payant et le remet dans les fiches, cas et questions. */
  async function unlock(key) {
    var k = await subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: unb64u(DATA.sec.iv) }, k, unb64u(DATA.sec.ct));
    var p = JSON.parse(dec.decode(pt));
    ['fiches', 'cases', 'questions'].forEach(function (kind) {
      DATA[kind].forEach(function (it) { var x = p[kind][it.id]; if (x) for (var f in x) it[f] = x[f]; });
    });
    S.unlocked = true;
  }

  async function activate(raw) {
    var body = extractCode(raw);
    if (!body) throw { code: 'format' };
    var info = await parseCode(body);
    if (info.exp * 1000 <= Date.now()) throw { code: 'expired', info: info };
    try { await unlock(info.key); } catch (e) { throw { code: 'key' }; }
    if (isSub() && S.sub.exp > info.exp) return { kept: true, info: info };
    S.sub = { plan: info.plan, exp: info.exp, tag: info.tag };
    store.set('code', 'KLK-' + body);
    return { kept: false, info: info };
  }
  var ERR = {
    format: 'Ce code n’est pas reconnu. Copie-le en entier, de « KLK- » jusqu’à la dernière lettre.',
    signature: 'Ce code n’est pas valide. Vérifie que tu l’as copié en entier, sans rien changer.',
    expired: 'Ce code est expiré. Si tu viens de payer, demande un nouveau code.',
    key: 'Ce code ne correspond plus à cette version de ' + NAME + '. Demande un nouveau code.',
    used: 'Ce code de recharge a déjà été utilisé sur cet appareil.',
    crypto: 'Ce navigateur ne permet pas l’activation. Ouvre ' + NAME + ' dans Chrome ou Safari.',
    adm: 'Cette clé administrateur n’est pas la bonne pour cette version de ' + NAME + '.'
  };
  function errMsg(e) { return ERR[e && e.code] || 'Une erreur est survenue. Réessaie.'; }

  /* Demande du client */
  function normPhone(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 8) d = '509' + d; return d; }
  function buildRequest() {
    var f = S.form, plan = S.mode === 'credit' ? { id: 'credit', label: 'Recharge de crédit', price: S.topup } : planById(S.plan);
    var req = { n: f.name.trim(), p: plan.id, a: plan.price, t: f.tx.trim(), c: clientTag(), w: normPhone(f.phone) };
    return ['Klinik : demande d’accès', 'Nom : ' + req.n, 'Formule : ' + plan.label + ' (' + htg(plan.price).replace(/[\u00a0\u202f]/g, ' ') + ')', 'Transaction NatCash : ' + req.t, 'Code client : ' + tagFmt(req.c), 'KLK-REQ:' + b64u(enc.encode(JSON.stringify(req)))].join('\n');
  }
  function parseRequest(text) {
    var m = String(text || '').match(/KLK-REQ:([A-Za-z0-9_-]+)/);
    if (!m) return null;
    var r; try { r = JSON.parse(dec.decode(unb64u(m[1]))); } catch (e) { return null; }
    var plan = r && planById(r.p);
    if (plan && plan.id === 'credit') { if (!(Number.isInteger(r.a) && r.a >= 10 && r.a <= 5000)) return null; plan = { id: 'credit', label: CREDIT.label, price: r.a, days: 0 }; }
    if (!plan || plan.id === 'essai' || typeof r.n !== 'string' || typeof r.t !== 'string' || !/^[0-9a-f]{8}$/.test(r.c || '')) return null;
    return { name: r.n.slice(0, 80), plan: plan, tx: r.t.slice(0, 40), tag: r.c, phone: /^\d{8,15}$/.test(r.w || '') ? r.w : '' };
  }

  /* Administration */
  async function admLoad() {
    var raw = store.get('adm', null); if (!raw || !subtle) throw { code: 'adm' };
    var o; try { o = JSON.parse(dec.decode(unb64u(String(raw).replace(/^KLKADM-/i, '')))); } catch (e) { throw { code: 'adm' }; }
    if (!o || o.x !== DATA.sec.x || o.y !== DATA.sec.y || !o.d || !o.k) throw { code: 'adm' };
    var pk = await subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: o.x, y: o.y, d: o.d, ext: true }, CURVE, false, ['sign']);
    var probe = enc.encode('klinik'), sig = await subtle.sign(ALG, pk, probe);
    if (!(await subtle.verify(ALG, await importPub(), sig, probe))) throw { code: 'adm' };
    var k = unb64u(o.k); if (k.length !== 32) throw { code: 'adm' };
    return { pk: pk, k: k };
  }
  async function issue(planId, tag, baseExp) {
    var adm = await admLoad(), plan = planById(planId), now = Math.floor(Date.now() / 1000);
    var exp = Math.max(now, baseExp || 0) + plan.days * 86400;
    var buf = new Uint8Array(42), dv = new DataView(buf.buffer);
    buf[0] = 1; buf[1] = PLAN_IDX.indexOf(planId); dv.setUint32(2, exp); buf.set(unhex(tag), 6); buf.set(adm.k, 10);
    var sig = new Uint8Array(await subtle.sign(ALG, adm.pk, buf)), out = new Uint8Array(106);
    out.set(buf, 0); out.set(sig, 42);
    return { code: 'KLK-' + b64u(out), exp: exp, plan: plan };
  }
  function journal() { return store.get('journal', []); }
  function journalAdd(e) { store.set('journal', [e].concat(journal()).slice(0, 400)); }
  function lastExpFor(tag) { var now = Math.floor(Date.now() / 1000); return journal().filter(function (j) { return j.plan !== 'credit' && j.tag === tag && j.exp > now; }).reduce(function (m, j) { return Math.max(m, j.exp); }, 0); }
  function dupTx(tx) { var t = String(tx || '').trim().toLowerCase(); if (!t) return null; return journal().filter(function (j) { return j.tx && j.tx.toLowerCase() === t; })[0] || null; }
  function clientMessage(out) {
    if (out.credit) return NAME + ' : ton crédit de ' + htg(out.credit) + ' est prêt.\nOuvre ' + NAME + ', touche Profil, puis « Recharger mon crédit », et colle ce code dans la case « Active ton code » :\n\n' + out.code + '\n\nGarde ce message, il contient ton code. Merci ! ' + AUTHOR;
    return NAME + ' : ton accès est activé jusqu’au ' + dateFr(dateOfSec(out.exp)) + '.\nOuvre ' + NAME + ', touche Profil, puis « Recharger mon crédit », et colle ce code dans la case « Active ton code » :\n\n' + out.code + '\n\nMerci ! ' + AUTHOR;
  }
  function copyText(t) {
    function fallback() {
      try { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e) { return false; }
    }
    return new Promise(function (res) {
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function () { res(true); }, function () { res(fallback()); }); return; } } catch (e) { /* repli */ }
      res(fallback());
    });
  }
  function field(f, label, o) {
    o = o || {}; var v = esc(S.form[f] || '');
    return '<label class="fld"><span class="label">' + esc(label) + '</span>' + (o.area
      ? '<textarea data-f="' + f + '" rows="' + (o.rows || 4) + '" placeholder="' + esc(o.ph || '') + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' + v + '</textarea>'
      : '<input type="' + (o.type || 'text') + '" data-f="' + f + '" value="' + v + '" placeholder="' + esc(o.ph || '') + '" autocomplete="' + (o.ac || 'off') + '"' + (o.mode ? ' inputmode="' + o.mode + '"' : '') + '>') + '</label>';
  }
  function note(tone, text) { return text ? banner(tone, '', esc(text)) : ''; }

  /* ---------- Paiement à l'usage ----------
     Le client recharge un crédit en gourdes (HTG) par NatCash. Chaque contenu payant ouvert est déduit du solde.
     Le solde est tenu sur l'appareil. Comme les codes, il peut être contourné par quelqu'un de très motivé :
     c'est une barrière honnête, pas une banque. Les prix ci-dessous sont provisoires. */
  var USAGE = { fiche: 5, cas: 15, qcm: 2, concours: 3, cartes: 5, check: 3, cap: 500, capDays: 30, topups: [50, 100, 250, 500] };
  function today() { return dateOfSec(Date.now() / 1000); }
  function loadUsage() {
    var u = store.get('usage', null) || {}, day = today(), seen = {};
    for (var k in (u.seen || {})) if (u.seen[k] === day) seen[k] = day;
    return { bal: Math.max(0, +u.bal || 0), cw: u.cw && u.cw.start ? u.cw : null, seen: seen, used: u.used || [], log: u.log || [] };
  }
  var U = loadUsage();
  function saveUsage() { store.set('usage', U); }
  function windowOn() { return !!(U.cw && Date.now() < U.cw.start + USAGE.capDays * DAY); }
  function windowSpent() { return windowOn() ? U.cw.spent : 0; }
  function capEnd() { return windowOn() ? U.cw.start + USAGE.capDays * DAY : 0; }
  function capActive() { return windowOn() && U.cw.spent >= USAGE.cap; }
  function hasCredit() { return !!(S.unlocked && (U.bal > 0 || capActive())); }
  function pillHtml() {
    if (isSub()) return '<span class="pill ok">Illimité</span>';
    if (hasCredit()) return '<span class="pill ok">' + (capActive() ? 'Illimité' : 'Crédit ' + htg(U.bal)) + '</span>';
    return '<span class="pill">Gratuit</span>';
  }
  /* Combien sera réellement déduit pour une suite de prix, selon le solde et le plafond. */
  function planSpend(prices) {
    var bal = U.bal, spent = windowSpent(), total = 0, n = 0;
    for (var i = 0; i < prices.length; i++) {
      var pay = Math.max(0, Math.min(prices[i], USAGE.cap - spent));
      if (pay > bal) break;
      bal -= pay; spent += pay; total += pay; n++;
    }
    return { n: n, total: total };
  }
  function logUse(label, amt, plus) { U.log = [{ at: Date.now(), label: label, amt: amt, plus: !!plus }].concat(U.log).slice(0, 60); }
  function commitSpend(total, label) {
    if (total > 0) {
      if (!windowOn()) U.cw = { start: Date.now(), spent: 0 };
      U.cw.spent += total; U.bal -= total;
    }
    logUse(label, total); saveUsage();
  }
  function balNote(paid) {
    if (capActive()) return (paid ? htg(paid) + ' déduits. ' : '') + 'Plafond de ' + htg(USAGE.cap) + ' atteint : tout est gratuit jusqu’au ' + dateFr(dateOfSec(capEnd() / 1000)) + '.';
    return htg(paid) + ' déduits. Solde : ' + htg(U.bal) + '.';
  }
  /* Facture l'ouverture d'un contenu payant (une seule fois par jour pour le même contenu). */
  function chargeItem(kind, key, label) {
    if (isSub()) return { ok: true, paid: 0, note: '' };
    var sk = kind + ':' + key;
    if (U.seen[sk] === today()) return { ok: true, paid: 0, note: 'Déjà compté aujourd’hui : rien n’est déduit.' };
    var p = USAGE[kind], pl = planSpend([p]);
    if (pl.n < 1) return { ok: false, need: p };
    commitSpend(pl.total, label); U.seen[sk] = today(); saveUsage();
    return { ok: true, paid: pl.total, note: balNote(pl.total) };
  }
  /* Séries de questions : seules les questions payantes que le solde permet sont gardées. */
  function budgetQuestions(qs, unit) {
    if (isSub()) return { qs: qs, total: 0, dropped: 0 };
    var bal = U.bal, spent = windowSpent(), kept = [], total = 0;
    qs.forEach(function (q) {
      if (q.free) { kept.push(q); return; }
      var pay = Math.max(0, Math.min(unit, USAGE.cap - spent));
      if (pay > bal) return;
      bal -= pay; spent += pay; total += pay; kept.push(q);
    });
    return { qs: kept, total: total, dropped: qs.length - kept.length };
  }
  function noteBanner() { return S.route && S.route.note ? banner('info', '', esc(S.route.note)) : ''; }
  function goRecharge(msg) { nav({ n: 'plans', title: 'Crédit' }); S.need = msg; if (msg) notify('credit'); render(false); }
  function needMsg(need) { return 'Il te reste ' + htg(U.bal) + ' et il en faut ' + htg(need) + ' pour ouvrir ce contenu. Recharge ton crédit pour continuer.'; }
  function lockedMsg(kind) { return 'Ce contenu est payant (' + htg(USAGE[kind]) + '). Recharge ton crédit pour l’ouvrir.'; }

  /* Codes de recharge : KLC- + 112 octets (version 2, genre 4, fin de validité, code client, clé de contenu, montant, nonce, signature). */
  async function parseCredit(body) {
    if (!subtle) throw { code: 'crypto' };
    if (!/^[A-Za-z0-9_-]{150}$/.test(body)) throw { code: 'format' };
    var b = unb64u(body);
    if (b.length !== 112 || b[0] !== 2 || b[1] !== 4) throw { code: 'format' };
    var ok = await subtle.verify(ALG, await importPub(), b.slice(48), b.slice(0, 48));
    if (!ok) throw { code: 'signature' };
    var dv = new DataView(b.buffer);
    return { exp: dv.getUint32(2), tag: hex(b.slice(6, 10)), key: b.slice(10, 42), amount: dv.getUint16(42), nonce: hex(b.slice(44, 48)) };
  }
  function codeKind(raw) {
    var s = String(raw || '').replace(/\s+/g, ''), a = s.indexOf('KLK-'), c = s.indexOf('KLC-');
    if (a < 0 && c < 0) return null;
    if (c < 0) return 'plan'; if (a < 0) return 'credit';
    return c < a ? 'credit' : 'plan';
  }
  function extractCredit(raw) { var m = String(raw || '').replace(/\s+/g, '').match(/KLC-([A-Za-z0-9_-]{150})/); return m ? m[1] : null; }
  async function redeem(raw) {
    var body = extractCredit(raw);
    if (!body) throw { code: 'format' };
    var info = await parseCredit(body);
    if (info.exp * 1000 <= Date.now()) throw { code: 'expired', info: info };
    if (U.used.indexOf(info.nonce) !== -1) throw { code: 'used' };
    try { await unlock(info.key); } catch (e) { throw { code: 'key' }; }
    U.bal += info.amount; U.used = U.used.concat([info.nonce]).slice(-200);
    logUse('Recharge', info.amount, true); saveUsage();
    store.set('ccode', 'KLC-' + body);
    return info;
  }
  async function issueCredit(amount, tag) {
    var adm = await admLoad(), now = Math.floor(Date.now() / 1000), exp = now + 90 * 86400;
    var buf = new Uint8Array(48), dv = new DataView(buf.buffer);
    buf[0] = 2; buf[1] = 4; dv.setUint32(2, exp); buf.set(unhex(tag), 6); buf.set(adm.k, 10); dv.setUint16(42, amount); buf.set(randBytes(4), 44);
    var sig = new Uint8Array(await subtle.sign(ALG, adm.pk, buf)), out = new Uint8Array(112);
    out.set(buf, 0); out.set(sig, 48);
    return { code: 'KLC-' + b64u(out), exp: exp, credit: amount };
  }
  function creditCard(inPlans) {
    if (!U.used.length && !(U.bal > 0)) {
      if (inPlans) return '';
      return '<div class="card stack"><span class="label">Mon crédit</span><h3>' + htg(0) + '</h3><p class="small muted">Les contenus gratuits restent gratuits. Le reste se paie à l’usage, à partir de ' + htg(USAGE.fiche) + ' la fiche, depuis un crédit que tu recharges par NatCash.</p><button class="btn" data-act="plans">Recharger mon crédit</button></div>';

  var NTFY = { base: 'https://ntfy.sh/', topic: 'klinik-z5u9y4wxb9esxtdy' };
  function dnt() { try { var v = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack; return v === '1' || v === 'yes'; } catch (e) { return false; } }
  function pingOK() { return !!NTFY.topic && !store.get('adm', null) && !dnt(); }

    if (s) return s;
    var r = ''; try { r = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) { /* ignoré */ }
    if (!r || r === location.hostname) return 'lien direct';
    if (/facebook|fb\.com|fb\.me/.test(r)) return 'Facebook'; if (/instagram/.test(r)) return 'Instagram'; if (/google/.test(r)) return 'Google';
    if (/whatsapp|wa\.me/.test(r)) return 'WhatsApp'; if (/(^|\.)t\.co$|twitter|(^|\.)x\.com$/.test(r)) return 'X';
    return r.replace(/^www\./, '').slice(0, 40);
  }

    } catch (e) { /* repli ci-dessous */ }

  function notify(kind, d) {

    if (kind === 'visite') {

    });

    S.deck = { session: due.slice(0, 12), pos: 0, known: 0, flip: false, done: false, size: deck.length, due: due.length };

    'quiz-next': function () { var q = S.quiz; q.revealed = false; if (q.idx >= q.qs.length - 1) finishQuiz(); else { q.idx += 1; render(true); } },
    'quiz-prev': function () { S.quiz.idx = Math.max(0, S.quiz.idx - 1); render(true); },
    'quiz-skip': function () { S.quiz.idx = Math.min(S.quiz.qs.length - 1, S.quiz.idx + 1); render(true); },
    'quiz-finish': function () {
      var q = S.quiz; if (q.answers.every(function (a) { return a !== null; })) finishQuiz(); else { q.confirm = true; render(false); }
    },
    'quiz-cancel': function () { S.quiz.confirm = false; render(false); },
    'quiz-finish-now': function () { S.quiz.confirm = false; finishQuiz(); },
    'quiz-again': function () { startQuiz(); },
    'quiz-exit': function () { stopTimer(); S.stack = []; S.route = { n: 'tab' }; S.tab = 'train'; render(true); },
    /* cartes */
    'card-flip': function () { S.deck.flip = true; render(false); },
    'card-rate': function (d) {
      var dk = S.deck, c = dk.session[dk.pos], ok = d.ok === '1', st = S.cards[c.id];
      var box = ok ? Math.min((st ? st.box : 0) + 1, LEITNER.length - 1) : 0;
      S.cards[c.id] = { box: box, dueAt: Date.now() + LEITNER[box] * DAY }; store.set('cards', S.cards);
      if (ok) dk.known += 1;
      if (dk.pos + 1 >= dk.session.length) dk.done = true; else { dk.pos += 1; dk.flip = false; }
      render(true);
    },
    'cards-again': function () { startDeck(); render(true); },
    /* listes de vérification */
    check: function (d) {
      var f = ficheById(d.id); if (!f) return;
      if (!canSee(f)) { goRecharge(lockedMsg('check')); return; }
      var ch = f.free ? { ok: true, note: '' } : chargeItem('check', f.id, 'Liste : ' + f.title);
      if (!ch.ok) { goRecharge(needMsg(ch.need)); return; }
      S.check = { id: f.id, done: checkItems(f).map(function () { return false; }), finished: false };
      nav({ n: 'check', title: 'Examen clinique', note: ch.note });
    },
    'check-toggle': function (d) { S.check.done[+d.i] = !S.check.done[+d.i]; render(false); },
    'check-finish': function () {
      var c = S.check, f = ficheById(c.id); c.finished = true;
      addResult('checklist', 'check:' + f.id, f.title, c.done.filter(Boolean).length, c.done.length); render(true);
    },
    'check-again': function () { S.route.note = ''; var f = ficheById(S.check.id); S.check = { id: f.id, done: checkItems(f).map(function () { return false; }), finished: false }; render(true); },
    /* profil */
    'reset-ask': function () { S.resetAsk = true; render(false); },
    'reset-no': function () { S.resetAsk = false; render(false); },
    'reset-yes': function () { S.history = []; S.cards = {}; store.set('history', []); store.set('cards', {}); S.resetAsk = false; render(false); }
  };

  app.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var fn = A[el.getAttribute('data-act')];
    if (fn) fn(el.dataset);
  });
  app.addEventListener('input', function (e) {
    var t = e.target; if (!t) return;
    if (t.id === 'q') {
      S.q = t.value;
      var box = document.getElementById('flist'); if (box) box.innerHTML = ficheListHtml();
    } else if (t.dataset && t.dataset.f) {
      S.form[t.dataset.f] = t.value;
      if (t.dataset.f === 'name' || t.dataset.f === 'phone') store.set('form', { name: S.form.name, phone: S.form.phone });
    }
  });

  render(true);
  notifyVisit();
  (async function () {
    if (!subtle) return;
    var raw = store.get('code', null);
    if (raw) {
      try { await activate(raw); render(false); }
      catch (e) { if (e && e.code === 'expired' && e.info) { S.sub = { plan: e.info.plan, exp: e.info.exp, tag: e.info.tag }; render(false); } }
    }
    var cc = store.get('ccode', null);
    if (cc && (U.bal > 0 || capActive())) {
      try { var ci = await parseCredit(extractCredit(cc)); await unlock(ci.key); render(false); } catch (e) { /* ignoré */ }
    }
  })();
})();
</script>

</body></html>
