<title>Klinik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Mise en page : une colonne mobile, barre d'onglets en bas, en-tête sur papier millimétré d'ECG.
   Couleurs : encre bleu-vert, vert sarcelle pour l'action, rouge réservé aux signes d'alarme.
   Polices : Bricolage Grotesque (titres), Atkinson Hyperlegible (texte, conçue pour la lisibilité), Plex Mono (chiffres). */
:root{
  --bg:#F2F7F7; --surface:#FFFFFF; --ink:#0F2329; --muted:#476067; --line:#D3E0E2; --grid:rgba(14,107,102,.09);
  --brand:#0E6B66; --brand-ink:#FFFFFF; --brand-soft:#DCF0EE;
  --alert:#A8231B; --alert-bg:#FDEDEB; --warn:#7E4300; --warn-bg:#FFF3DC;
  --ok:#185F35; --ok-bg:#E4F4EA; --info:#1B4A97; --info-bg:#E7EFFC;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1519; --surface:#10222A; --ink:#E5EFF0; --muted:#9EB5BB; --line:#23393F; --grid:rgba(56,209,193,.07);
    --brand:#38D1C1; --brand-ink:#04211E; --brand-soft:#123436;
    --alert:#FFA8A0; --alert-bg:#341719; --warn:#FFCC72; --warn-bg:#2E2208;
    --ok:#8DE3A8; --ok-bg:#0F2B1B; --info:#9DC2FF; --info-bg:#11233F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1519; --surface:#10222A; --ink:#E5EFF0; --muted:#9EB5BB; --line:#23393F; --grid:rgba(56,209,193,.07);
  --brand:#38D1C1; --brand-ink:#04211E; --brand-soft:#123436;
  --alert:#FFA8A0; --alert-bg:#341719; --warn:#FFCC72; --warn-bg:#2E2208;
  --ok:#8DE3A8; --ok-bg:#0F2B1B; --info:#9DC2FF; --info-bg:#11233F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:29px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#app{max-width:680px;margin-inline:auto;padding-inline:16px;padding-block:0 104px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* En-tête */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.wm{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--brand);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.wm svg{width:46px;height:18px;flex:none}
.by{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 9px;white-space:nowrap}
.back{display:flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--brand);font-weight:700;padding:0 8px 0 0;cursor:pointer}
.back svg{width:20px;height:20px}
.bar-title{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;max-width:680px;margin-inline:auto}
.tab{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand)}

/* Composants */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:block;width:100%;text-align:left;min-width:0}
button.card{cursor:pointer}
button.card:active{background:var(--brand-soft)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.between>*{min-width:0}
.between>:last-child{flex:none}
.between>h3{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.info{color:var(--info)} .badge.alert{color:var(--alert)}
.badge svg{width:12px;height:12px}
.banner{border:1px solid currentColor;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.banner.info{color:var(--info);background:var(--info-bg)} .banner.warn{color:var(--warn);background:var(--warn-bg)}
.banner.alert{color:var(--alert);background:var(--alert-bg)} .banner.ok{color:var(--ok);background:var(--ok-bg)}
.banner .t{font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.banner ul,.banner ol{color:var(--ink)}
.btn{min-height:50px;width:100%;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;padding:10px 18px;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand);border-color:var(--line)}
.btn.danger{background:var(--alert-bg);color:var(--alert);border-color:var(--alert)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:12px}.btn-row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:400}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
input[type=search],input[type=text],input[type=password]{width:100%;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand)}
ul.b,ol.b{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:8px}
ol.b{padding-left:1.5em}
.doc{display:flex;flex-direction:column;gap:16px}
.doc section{display:flex;flex-direction:column;gap:10px}
.pearls{background:var(--brand-soft);border-color:var(--brand)}
.lead{color:var(--muted)}
.refs{display:flex;flex-direction:column;gap:6px}
.refs a{display:block;padding:6px 0;overflow-wrap:anywhere}
.sig{text-align:center;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--muted)}

/* Choix de réponse */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.opt .mk{flex:none;width:26px;font-family:var(--f-mono);font-weight:500}
.opt.sel{border:2px solid var(--brand);background:var(--brand-soft);padding:11px 13px}
.opt.right{border:2px solid var(--ok);background:var(--ok-bg);padding:11px 13px}
.opt.right .mk{color:var(--ok)}
.opt.wrong{border:2px solid var(--alert);background:var(--alert-bg);padding:11px 13px}
.opt.wrong .mk{color:var(--alert)}
.opt.dim{opacity:.65}
.opt:disabled{cursor:default;color:var(--ink)}
.q-prompt{font-size:18px}
.clock{font-family:var(--f-mono);font-weight:500;font-size:22px}
.clock.low{color:var(--alert)}
.score{font-family:var(--f-display);font-weight:800;font-size:34px}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:54px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.check .bx{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.check[aria-checked="true"]{border:2px solid var(--brand);background:var(--brand-soft);padding:11px 13px}
.check[aria-checked="true"] .bx{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.check .bx svg{width:16px;height:16px;display:none}
.check[aria-checked="true"] .bx svg{display:block}
.gate{display:flex;flex-direction:column;gap:16px;padding-top:32px}
.gate .wm{font-size:44px;justify-content:center}
.gate .by{text-align:center}
.plan{border:1px solid var(--line)}
.plan[aria-pressed="true"]{border:2px solid var(--brand);padding:15px}
.price{font-family:var(--f-mono);font-weight:500;font-size:19px;color:var(--brand);white-space:nowrap}
.empty{text-align:center;padding:32px 8px}

/* Paiement par code */
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
a.btn:not(.sec){color:var(--brand-ink)} a.btn.sec{color:var(--brand)}
.fld{display:flex;flex-direction:column;gap:6px}
input[type=tel],textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
input[type=tel]{min-height:50px;padding:0 14px}
textarea{padding:12px 14px;min-height:96px;resize:vertical;font-family:var(--f-mono);font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.num{font-size:28px;font-weight:500;letter-spacing:.02em;color:var(--brand)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;cursor:pointer;font-size:14px}
.pill.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
@media (prefers-reduced-motion:no-preference){.opt,.card,.btn{transition:background-color .15s,border-color .15s}}
</style>

"rm":4,"sc":8,"locked":true},{"id":"abdo-douleur-aigue","system":"abdo","title":"Douleur abdominale aiguë : orientation par localisation","summary":"Raisonner par quadrant, repérer les urgences chirurgicales et vasculaires, ne pas oublier les causes extra-abdominales.","keywords":["douleur abdominale","appendicite","cholécystite","pancréatite","occlusion","colique néphrétique","diverticulite","grossesse extra-utérine","perforation","péritonite"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":5,"locked":true},{"id":"general-signes-vitaux","system":"general","title":"Signes vitaux et scores d’alerte","summary":"Prendre, interpréter et noter les constantes ; repérer un patient qui se dégrade (NEWS2, qSOFA).","keywords":["constantes","signes vitaux","NEWS2","qSOFA","TA","fréquence cardiaque","SpO2","température","dégradation"],"free":true,"updatedAt":"2026-10-05","reviewed":false,"sections":[{"heading":"Les sept constantes à relever","kind":"steps","items":["Fréquence respiratoire : compter pendant 60 secondes, sans prévenir le patient (il modifierait sa respiration). C’est le signe vital le plus souvent négligé et l’un des plus précoces dans la dégradation.","Saturation en oxygène (SpO2) : doigt propre, chaud, sans vernis foncé ; noter si le patient est sous air ambiant ou sous oxygène (et le débit).","Tension artérielle : brassard adapté au bras, patient au repos depuis quelques minutes, bras au niveau du cœur. Mesurer aux deux bras lors d’une première évaluation ou si une dissection aortique est suspectée.","Fréquence cardiaque : palper le pouls radial 30 à 60 secondes ; noter fréquence, régularité, amplitude. Un pouls irrégulier nécessite un ECG.","Température : noter la voie de mesure ; une fièvre est habituellement définie par une température ≥ 38,0 °C.","État de conscience : alerte, réagit à la voix, réagit à la douleur, ne réagit pas (échelle AVPU) ; toute confusion nouvelle est un signe de gravité.","Glycémie capillaire : à faire devant toute altération de la conscience ou tout déficit neurologique brutal."]},{"heading":"Valeurs de repos habituelles chez l’adulte (repères, pas des normes absolues)","kind":"signs","items":["Fréquence respiratoire : environ 12 à 20 par minute.","Fréquence cardiaque : environ 60 à 100 par minute au repos.","SpO2 : ≥ 94 à 96 % sous air ambiant chez un adulte sans maladie pulmonaire chronique.","Chez un patient à risque d’insuffisance respiratoire hypercapnique (par exemple BPCO sévère), la cible d’oxygénothérapie recommandée est plus basse : 88 à 92 %.","Tension artérielle systolique : une valeur ≤ 100 mmHg avec signes de mauvaise perfusion doit alerter, même si le patient « parle bien »."]},{"heading":"Signes qui doivent faire appeler à l’aide immédiatement","kind":"redflags","items":["Fréquence respiratoire ≥ 25 par minute, ou ≤ 8, ou épuisement respiratoire.","SpO2 basse ou en baisse malgré l’oxygène ; cyanose.","Tension artérielle systolique ≤ 90 mmHg, ou chute importante par rapport à la valeur habituelle du patient.","Fréquence cardiaque > 130 ou ≤ 40 par minute, surtout avec symptômes.","Confusion nouvelle, somnolence, agitation inhabituelle.","Extrémités froides et marbrées, temps de recoloration cutanée allongé, urines très rares : signes de choc.","« Le patient m’inquiète » : l’inquiétude d’une infirmière ou d’un étudiant expérimenté est un signal valable, même si les chiffres semblent corrects."]},{"heading":"Scores d’alerte : à quoi ils servent","kind":"text","items":["NEWS2 (Royal College of Physicians, 2017) additionne des points pour la fréquence respiratoire, la SpO2, l’oxygène, la tension systolique, la fréquence cardiaque, la conscience et la température. Plus le score est élevé, plus la réponse doit être rapide et expérimentée ; un seul paramètre extrême suffit à déclencher une alerte. Il se calcule avec une grille, à garder à portée de main.","qSOFA est un repère rapide en dehors de la réanimation : fréquence respiratoire ≥ 22, altération de la conscience, tension systolique ≤ 100 mmHg. Deux critères ou plus indiquent un risque accru d’évolution défavorable en cas d’infection suspectée.","Les recommandations Surviving Sepsis Campaign 2021 déconseillent d’utiliser le qSOFA seul comme outil de dépistage du sepsis, car il est moins sensible que SIRS, NEWS ou MEWS. Un qSOFA négatif ne rassure donc pas : en cas de doute, faire une évaluation complète."]},{"heading":"Pièges fréquents","kind":"pearls","items":["Une tachycardie ou une tachypnée inexpliquée précède souvent l’hypotension : ne pas attendre que la tension chute.","Les bêta-bloquants, l’âge avancé et la grossesse peuvent masquer ou modifier la réponse du pouls.","Une SpO2 « normale » n’exclut pas une détresse : un patient qui compense par une respiration rapide peut garder une SpO2 correcte jusqu’à l’épuisement.","Toujours noter l’heure, la valeur et les conditions de mesure : une tendance sur plusieurs mesures vaut mieux qu’un chiffre isolé."]}],"references":[{"label":"Royal College of Physicians. National Early Warning Score (NEWS) 2. Londres, 2017.","url":"https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"},{"label":"Evans L, et al. Surviving Sepsis Campaign : International Guidelines for Management of Sepsis and Septic Shock 2021. Crit Care Med 2021.","url":"https://doi.org/10.1097/CCM.0000000000005337"},{"label":"Singer M, et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA 2016.","url":"https://doi.org/10.1001/jama.2016.0287"},{"label":"O’Driscoll BR, et al. BTS guideline for oxygen use in adults in healthcare and emergency settings. Thorax 2017.","url":"https://doi.org/10.1136/thoraxjnl-2016-209729"}],"rm":4,"sc":7},{"id":"general-fievre-sepsis","system":"general","title":"Fièvre et signes de gravité : penser au sepsis","summary":"Évaluer un patient fébrile : foyers à rechercher, signes de choc, maladies tropicales à ne pas manquer.","keywords":["fièvre","sepsis","choc septique","méningite","purpura","paludisme","dengue","typhoïde","leptospirose","tuberculose","foyer infectieux"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":4,"sc":6,"locked":true},{"id":"neuro-conscience-glasgow","system":"neuro","title":"Évaluation de la conscience : échelle de Glasgow","summary":"Calculer et noter le score de Glasgow (yeux, verbal, moteur), l’AVPU, et savoir quand c’est une urgence.","keywords":["Glasgow","GCS","coma","conscience","AVPU","pupilles","traumatisme crânien","confusion","glycémie"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":6,"locked":true},{"id":"neuro-deficit-avc","system":"neuro","title":"Déficit neurologique brutal : reconnaître un AVC","summary":"BE-FAST, heure de début, glycémie, diagnostics différentiels et urgence de la prise en charge.","keywords":["AVC","accident vasculaire cérébral","BE-FAST","FAST","hémiplégie","aphasie","paralysie faciale","thrombolyse","NIHSS","hypoglycémie"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":7,"locked":true},{"id":"respi-dyspnee","system":"respi","title":"Dyspnée : approche sémiologique","summary":"Évaluer la gravité, caractériser la dyspnée, orienter vers une cause cardiaque, pulmonaire ou autre.","keywords":["dyspnée","essoufflement","détresse respiratoire","mMRC","orthopnée","asthme","BPCO","embolie pulmonaire","pneumothorax","stridor"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":6,"locked":true},{"id":"respi-examen","system":"respi","title":"Examen respiratoire et grands syndromes","summary":"Inspection, palpation, percussion, auscultation, puis reconnaître condensation, épanchement, pneumothorax et syndrome bronchique.","keywords":["examen pulmonaire","auscultation","crépitants","sibilants","souffle tubaire","vibrations vocales","matité","épanchement pleural","pneumothorax","condensation"],"free":false,"updatedAt":"2026-10-05","reviewed":false,"rm":3,"sc":5,"locked":true}],"cases":[{"id":"cas-sepsis-urinaire","title":"Une patiente âgée fébrile et confuse","system":"general","level":"debutant","free":true,"tags":["sepsis","constantes","urgences"],"summary":"Fièvre, confusion et hypotension chez une femme de 72 ans : reconnaître les signes de gravité et le foyer.","intro":"Salle d’urgence. Une femme de 72 ans, diabétique, est amenée par sa fille : fièvre depuis deux jours, brûlures en urinant. Depuis ce matin elle est « bizarre » et ne reconnaît plus sa fille.","ficheIds":["general-signes-vitaux","general-fievre-sepsis"],"steps":[{"reveal":"Constantes : température 38,9 °C, fréquence cardiaque 118/min, fréquence respiratoire 26/min, tension 88/50 mmHg, SpO2 94 % à l’air ambiant. Glasgow 14 (réponse verbale confuse). Extrémités froides, marbrures aux genoux. Elle n’a presque pas uriné depuis hier.","question":"Quelle est votre première impression ?","options":["Une fièvre banale : donner du paracétamol et rassurer la famille","Des signes de gravité évoquant un sepsis avec mauvaise perfusion : évaluation immédiate et appel d’un médecin senior","Une anxiété liée à l’hospitalisation","Une simple déshydratation sans urgence"],"correct":1,"explanation":"Fréquence respiratoire élevée, confusion, tension basse, marbrures et oligurie traduisent une défaillance de perfusion. Il faut agir sans attendre, pas rassurer."},{"reveal":"Vous complétez l’évaluation avec les repères d’alerte.","question":"Combien de critères qSOFA cette patiente présente-t-elle ?","options":["0","1","2","3"],"correct":3,"explanation":"Fréquence respiratoire 26 (≥ 22), altération de la conscience (Glasgow 14) et tension systolique 88 (≤ 100) : les trois critères sont présents. Rappel : la Surviving Sepsis Campaign 2021 déconseille de s’appuyer sur le qSOFA seul, car un score négatif ne rassure pas."},{"reveal":"Examen : abdomen souple, douleur à l’ébranlement de la fosse lombaire droite. Bandelette urinaire : leucocytes et nitrites positifs. Pas de raideur de nuque, pas de purpura, poumons clairs, peau saine.","question":"Quel est le foyer infectieux le plus probable ?","options":["Pneumonie","Pyélonéphrite (infection urinaire haute)","Méningite","Cellulite d’un membre"],"correct":1,"explanation":"Fièvre, brûlures mictionnelles, douleur lombaire à l’ébranlement et bandelette positive : pyélonéphrite. L’absence de signe méningé, de purpura, de toux et de lésion cutanée écarte les autres foyers à ce stade."},{"reveal":"Le médecin arrive dans quinze minutes. Vous êtes seul avec la patiente.","question":"Que faites-vous en attendant ?","options":["La renvoyer à domicile avec un antibiotique par voie orale","La mettre sous surveillance rapprochée : scope, voie veineuse, glycémie capillaire, oxygène si besoin, prélèvements (hémocultures avant l’antibiotique si cela ne retarde pas le traitement), et préparer le traitement rapide","Attendre les résultats d’une imagerie avant tout traitement","Donner un antipyrétique et la réévaluer dans six heures"],"correct":1,"explanation":"Le sepsis est une urgence dépendante du temps : surveillance continue, accès veineux, glycémie, prélèvements, puis antibiotique rapide (idéalement dans l’heure en cas de choc septique ou de forte probabilité de sepsis, selon la Surviving Sepsis Campaign 2021)."}],"debrief":{"keyPoints":["Fréquence respiratoire, conscience et tension suffisent à repérer un patient en danger : mesurez-les, notez-les, répétez-les.","Chez la personne âgée, la confusion est souvent le premier signe d’une infection grave, parfois sans fièvre élevée.","Les marbrures, les extrémités froides et l’oligurie signent la mauvaise perfusion.","Un qSOFA négatif ne rassure jamais seul ; un patient qui vous inquiète mérite une évaluation complète."]},"references":[{"label":"Evans L, et al. Surviving Sepsis Campaign : International Guidelines 2021. Crit Care Med 2021.","url":"https://doi.org/10.1097/CCM.0000000000005337"},{"label":"Singer M, et al. Sepsis-3. JAMA 2016;315:801-810.","url":"https://doi.org/10.1001/jama.2016.0287"},{"label":"Royal College of Physicians. NEWS2, 2017.","url":"https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"}],"reviewed":false,"minutes":8,"n":4},{"id":"cas-douleur-thoracique-sca","title":"Oppression thoracique chez un chauffeur de 58 ans","system":"cardio","level":"intermediaire","free":false,"tags":["SCA","ECG","urgences","USMLE"],"summary":"Reconnaître un syndrome coronarien aigu, lire l’urgence de l’ECG et penser à l’atteinte du ventricule droit.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-dyspnee-bpco","title":"Un patient BPCO qui s’épuise","system":"respi","level":"intermediaire","free":false,"tags":["BPCO","oxygène","dyspnée","USMLE"],"summary":"Reconnaître la détresse respiratoire, fixer la bonne cible d’oxygène et ne pas s’arrêter au premier diagnostic.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-fosse-iliaque-droite","title":"Douleur de la fosse iliaque droite chez une jeune femme","system":"abdo","level":"intermediaire","free":false,"tags":["appendicite","abdomen aigu","USMLE"],"summary":"Raisonner sur une douleur migratrice, penser à la grossesse extra-utérine et reconnaître la péritonite.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-deficit-brutal-avc","title":"Bouche déviée et bras « mort » : un AVC ?","system":"neuro","level":"intermediaire","free":false,"tags":["AVC","BE-FAST","urgences","USMLE"],"summary":"Noter l’heure, éliminer l’hypoglycémie, reconnaître une atteinte centrale et orienter sans retard.","reviewed":false,"minutes":8,"n":4,"locked":true},{"id":"cas-insuffisance-cardiaque","title":"Essoufflement, chevilles gonflées et trois oreillers","system":"cardio","level":"debutant","free":false,"tags":["insuffisance cardiaque","examen clinique","USMLE"],"summary":"Reconnaître l’insuffisance cardiaque, décrire le profil clinique et chercher la cause de la décompensation.","reviewed":false,"minutes":8,"n":4,"locked":true}],"questions":[{"id":"q-gen-01","system":"general","ficheId":"general-signes-vitaux","free":true,"prompt":"Quelle constante est souvent négligée alors qu’elle est l’un des signes les plus précoces de dégradation ?","options":["La température","La fréquence respiratoire","Le poids","La glycémie capillaire"],"correct":1,"explanation":"La fréquence respiratoire est la constante la plus souvent oubliée et l’une des plus précoces à se modifier quand un patient se dégrade. Elle se compte pendant une minute entière.","format":"rapide"},{"id":"q-gen-02","system":"general","ficheId":"general-signes-vitaux","free":true,"prompt":"Comment mesurer correctement la fréquence respiratoire ?","options":["Compter pendant 15 secondes et multiplier par 4, en expliquant au patient ce que l’on fait","Compter pendant 60 secondes, sans prévenir le patient","La déduire de la saturation en oxygène","La déduire de la fréquence du pouls"],"correct":1,"explanation":"Si le patient sait qu’on observe sa respiration, il la modifie. On compte donc une minute entière, discrètement, par exemple en gardant la main sur son poignet comme pour prendre le pouls.","format":"rapide"},{"id":"q-gen-03","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"rapide","locked":true},{"id":"q-gen-04","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"rapide","locked":true},{"id":"q-gen-05","system":"general","ficheId":"general-signes-vitaux","free":false,"format":"rapide","locked":true},{"id":"q-gen-06","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"rapide","locked":true},{"id":"q-car-01","system":"cardio","ficheId":"cardio-douleur-thoracique","free":true,"prompt":"Devant une douleur thoracique suspecte, dans quel délai doit-on réaliser et interpréter un ECG 12 dérivations ?","options":["Dans les 10 minutes suivant le premier contact médical","Dans l’heure qui suit","Après le résultat de la troponine","Dans les 6 heures"],"correct":0,"explanation":"ESC 2023 et AHA/ACC 2021 : ECG dans les 10 minutes suivant le premier contact médical. On n’attend pas la troponine.","format":"rapide"},{"id":"q-car-02","system":"cardio","ficheId":"cardio-douleur-thoracique","free":false,"format":"rapide","locked":true},{"id":"q-car-03","system":"cardio","ficheId":"cardio-douleur-thoracique","free":false,"format":"rapide","locked":true},{"id":"q-car-04","system":"cardio","ficheId":"cardio-examen","free":false,"format":"rapide","locked":true},{"id":"q-car-05","system":"cardio","ficheId":"cardio-examen","free":false,"format":"rapide","locked":true},{"id":"q-car-06","system":"cardio","ficheId":"cardio-insuffisance-cardiaque","free":false,"format":"rapide","locked":true},{"id":"q-car-07","system":"cardio","ficheId":"cardio-insuffisance-cardiaque","free":false,"format":"rapide","locked":true},{"id":"q-res-01","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-res-02","system":"respi","ficheId":"respi-examen","free":false,"format":"rapide","locked":true},{"id":"q-res-03","system":"respi","ficheId":"respi-examen","free":false,"format":"rapide","locked":true},{"id":"q-res-04","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-res-05","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-res-06","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"rapide","locked":true},{"id":"q-abd-01","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-abd-02","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-abd-03","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-abd-04","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"rapide","locked":true},{"id":"q-abd-05","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"rapide","locked":true},{"id":"q-abd-06","system":"abdo","ficheId":"abdo-examen","free":false,"format":"rapide","locked":true},{"id":"q-neu-01","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-neu-02","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-neu-03","system":"neuro","ficheId":"neuro-deficit-avc","free":true,"prompt":"Quel test rapide doit-on faire en premier devant une altération de la conscience ou un déficit neurologique brutal ?","options":["Une IRM cérébrale","Une glycémie capillaire","Une ponction lombaire","Un électroencéphalogramme"],"correct":1,"explanation":"L’hypoglycémie peut mimer un AVC et se corrige en quelques minutes. La glycémie capillaire est le test le plus rapide et le plus utile.","format":"rapide"},{"id":"q-neu-04","system":"neuro","ficheId":"neuro-deficit-avc","free":false,"format":"rapide","locked":true},{"id":"q-neu-05","system":"neuro","ficheId":"neuro-deficit-avc","free":false,"format":"rapide","locked":true},{"id":"q-neu-06","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-neu-07","system":"neuro","ficheId":"neuro-conscience-glasgow","free":false,"format":"rapide","locked":true},{"id":"q-vig-01","system":"cardio","ficheId":"cardio-douleur-thoracique","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-02","system":"cardio","ficheId":"cardio-examen","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-03","system":"cardio","ficheId":"cardio-douleur-thoracique","free":true,"format":"vignette","tags":["USMLE","concours"],"prompt":"Un homme de 34 ans, après une infection virale, présente une douleur thoracique aiguë qui augmente à l’inspiration et en position couchée, et diminue penché en avant. Un frottement péricardique est audible. L’ECG montre un sus-décalage diffus et concave du ST avec un sous-décalage du PR. Quel est le diagnostic ?","options":["Infarctus du myocarde antérieur","Péricardite aiguë","Embolie pulmonaire","Dissection aortique"],"correct":1,"explanation":"Douleur pleurale et positionnelle, frottement péricardique et sus-décalage diffus et concave du ST : péricardite aiguë. Dans l’infarctus, le sus-décalage est localisé à un territoire, avec image en miroir."},{"id":"q-vig-04","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-05","system":"respi","ficheId":"respi-dyspnee","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-06","system":"respi","ficheId":"respi-examen","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-07","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-08","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-09","system":"abdo","ficheId":"abdo-douleur-aigue","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-10","system":"neuro","ficheId":"neuro-deficit-avc","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-11","system":"neuro","ficheId":"general-fievre-sepsis","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-12","system":"general","ficheId":"general-fievre-sepsis","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true},{"id":"q-vig-13","system":"cardio","ficheId":"cardio-insuffisance-cardiaque","free":false,"format":"vignette","tags":["USMLE","concours"],"locked":true}],"sources":{"policy":"Les fiches, les cas cliniques et les questions de Klinik sont rédigés de façon originale à partir de recommandations et de publications scientifiques citées dans l’application. Klinik ne copie ni ne reproduit le contenu de ressources   /* ---------- Paiement NatCash et codes d'accès ----------
     Principe : le client paie par NatCash, envoie sa demande (nom + numéro de transaction), l'administrateur
     vérifie le SMS NatCash puis génère un code signé. Le code contient la clé qui ouvre le contenu payant

  var PAY = { number: '50940724822', shown: '509 4072 4822' };
  var TRIAL = { id: 'essai', label: 'Essai 7 jours', price: 0, days: 7 };
  var PLAN_IDX = ['mensuel', 'trimestriel', 'annuel', 'essai'];

  var subtle = (window.crypto && window.crypto.subtle) || null;

  function randBytes(n) { var a = new Uint8Array(n); if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (var i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); return a; }
  function clientTag() { var t = store.get('cid', null); if (!t || !/^[0-9a-f]{8}$/.test(t)) { t = hex(randBytes(4)); store.set('cid', t); } return t; }
  function tagFmt(t) { return t.slice(0, 4).toUpperCase() + '-' + t.slice(4).toUpperCase(); }
  function tagParse(s) { var h = String(s || '').replace(/[^0-9a-fA-F]/g, '').toLowerCase(); return h.length === 8 ? h : null; }
  function dateOfSec(sec) { var d = new Date(sec * 1000); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function importPub() { return subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: DATA.sec.x, y: DATA.sec.y, ext: true }, CURVE, false, ['verify']); }

  /* Lit un code : forme, signature de l'administrateur. Ne regarde pas encore la date. */
  async function parseCode(body) {
    if (!subtle) throw { code: 'crypto' };
    if (!/^[A-Za-z0-9_-]{142}$/.test(body)) throw { code: 'format' };
    var b = unb64u(body);
    if (b.length !== 106 || b[0] !== 1) throw { code: 'format' };
    var ok = await subtle.verify(ALG, await importPub(), b.slice(42), b.slice(0, 42));
    if (!ok) throw { code: 'signature' };
    return { plan: PLAN_IDX[b[1]] || 'mensuel', exp: new DataView(b.buffer).getUint32(2), tag: hex(b.slice(6, 10)), key: b.slice(10, 42) };
  }
  function extractCode(raw) { var m = String(raw || '').replace(/\s+/g, '').match(/KLK-([A-Za-z0-9_-]{142})/); return m ? m[1] : null; }

  /* Déchiffre le contenu payant et le remet dans les fiches, cas et questions. */
  async function unlock(key) {
    var k = await subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: unb64u(DATA.sec.iv) }, k, unb64u(DATA.sec.ct));
    var p = JSON.parse(dec.decode(pt));
    ['fiches', 'cases', 'questions'].forEach(function (kind) {
      DATA[kind].forEach(function (it) { var x = p[kind][it.id]; if (x) for (var f in x) it[f] = x[f]; });
    });
  }

  async function activate(raw) {
    var body = extractCode(raw);
    if (!body) throw { code: 'format' };
    var info = await parseCode(body);
    if (info.exp * 1000 <= Date.now()) throw { code: 'expired', info: info };
    try { await unlock(info.key); } catch (e) { throw { code: 'key' }; }
    if (isSub() && S.sub.exp > info.exp) return { kept: true, info: info };
    S.sub = { plan: info.plan, exp: info.exp, tag: info.tag };
    store.set('code', 'KLK-' + body);
    return { kept: false, info: info };
  }
  var ERR = {
    format: 'Ce code n’est pas reconnu. Copie-le en entier, de « KLK- » jusqu’à la dernière lettre.',
    signature: 'Ce code n’est pas valide. Vérifie que tu l’as copié en entier, sans rien changer.',
    expired: 'Ce code est expiré. Si tu viens de payer, demande un nouveau code.',
    key: 'Ce code ne correspond plus à cette version de ' + NAME + '. Demande un nouveau code.',

    adm: 'Cette clé administrateur n’est pas la bonne pour cette version de ' + NAME + '.'
  };
  function errMsg(e) { return ERR[e && e.code] || 'Une erreur est survenue. Réessaie.'; }

  /* Demande du client */
  function normPhone(p) { var d = String(p || '').replace(/\D/g, ''); if (d.length === 8) d = '509' + d; return d; }
  function buildRequest() {
    var f = S.form, plan = planById(S.plan);

  }
  function parseRequest(text) {
    var m = String(text || '').match(/KLK-REQ:([A-Za-z0-9_-]+)/);
    if (!m) return null;
    var r; try { r = JSON.parse(dec.decode(unb64u(m[1]))); } catch (e) { return null; }
    var plan = r && planById(r.p);
    if (!plan || plan.id === 'essai' || typeof r.n !== 'string' || typeof r.t !== 'string' || !/^[0-9a-f]{8}$/.test(r.c || '')) return null;
    return { name: r.n.slice(0, 80), plan: plan, tx: r.t.slice(0, 40), tag: r.c, phone: /^\d{8,15}$/.test(r.w || '') ? r.w : '' };
  }

  /* Administration */
  async function admLoad() {
    var raw = store.get('adm', null); if (!raw || !subtle) throw { code: 'adm' };
    var o; try { o = JSON.parse(dec.decode(unb64u(String(raw).replace(/^KLKADM-/i, '')))); } catch (e) { throw { code: 'adm' }; }
    if (!o || o.x !== DATA.sec.x || o.y !== DATA.sec.y || !o.d || !o.k) throw { code: 'adm' };
    var pk = await subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: o.x, y: o.y, d: o.d, ext: true }, CURVE, false, ['sign']);
    var probe = enc.encode('klinik'), sig = await subtle.sign(ALG, pk, probe);
    if (!(await subtle.verify(ALG, await importPub(), sig, probe))) throw { code: 'adm' };
    var k = unb64u(o.k); if (k.length !== 32) throw { code: 'adm' };
    return { pk: pk, k: k };
  }
  async function issue(planId, tag, baseExp) {

    out.set(buf, 0); out.set(sig, 42);
    return { code: 'KLK-' + b64u(out), exp: exp, plan: plan };
  }

  function pickQuiz(mode, system, count) {
    var pool = DATA.questions.filter(function (q) {
      return (!system || q.system === system) && (isSub() || q.free) && (mode === 'concours' ? q.format === 'vignette' : q.format !== 'vignette');
    });
    return shuffle(pool).slice(0, count).map(function (q) {
      var order = shuffle(q.options.map(function (_, i) { return i; }));
      var c = {}; for (var k in q) c[k] = q[k];
      c.options = order.map(function (i) { return q.options[i]; }); c.correct = order.indexOf(q.correct);
      return c;
    });
  }
  function startQuiz() {
    stopTimer();
    var mode = S.route.mode || (S.quiz && S.quiz.mode), sys = S.setup.system, count = S.setup.count;
    if (S.quiz && S.route.n === 'quiz') { mode = S.quiz.mode; sys = S.quiz.system; count = S.quiz.count; }
    var qs = pickQuiz(mode, sys, count);
    S.quiz = { mode: mode, system: sys, count: count, qs: qs, idx: 0, answers: qs.map(function () { return null; }), revealed: false, done: false, limited: !isSub(), startedAt: Date.now(), endAt: Date.now() + qs.length * 90000 };
    var route = { n: 'quiz', title: 'Questions' };
    if (S.route.n === 'quizsetup') replace(route); else { S.route = route; render(true); }
    if (mode === 'concours' && qs.length) startTimer();
  }
  function startTimer() {
    stopTimer();
    S.timer = setInterval(function () {
      var q = S.quiz; if (!q || q.done) { stopTimer(); return; }
      var left = Math.ceil((q.endAt - Date.now()) / 1000);
      var el = document.getElementById('clock');
      if (el) { el.textContent = clock(left); el.className = 'clock' + (left <= 60 ? ' low' : ''); el.setAttribute('aria-label', 'Temps restant ' + clock(left)); }
      if (left <= 0) finishQuiz();
    }, 1000);
  }
  function finishQuiz() {
    var q = S.quiz; if (!q || q.done) return;
    stopTimer(); q.done = true;
    var correct = q.qs.filter(function (x, i) { return q.answers[i] === x.correct; }).length;
    var label = q.system ? sysLabel(q.system) : 'Tous systèmes';
    addResult(q.mode === 'concours' ? 'concours' : 'qcm', q.mode + ':' + (q.system || 'all'), label, correct, q.qs.length);
    render(true);
  }
  function viewQuiz() {
    var q = S.quiz, concours = q.mode === 'concours';
    if (!q.qs.length) {

        (q.limited ? '<button class="btn" data-act="plans">Voir les offres</button>' : '') + '<button class="btn sec" data-act="back">Changer de choix</button>';
    }
    if (q.done) {
      var correct = q.qs.filter(function (x, i) { return q.answers[i] === x.correct; }).length, total = q.qs.length, p = pct(correct, total);
      var missed = q.qs.map(function (x, i) { return { x: x, i: i }; }).filter(function (m) { return q.answers[m.i] !== m.x.correct; });
      var seen = {}, review = [];
      missed.forEach(function (m) { if (!seen[m.x.ficheId]) { seen[m.x.ficheId] = 1; review.push(m.x.ficheId); } });
      var used = Math.min(Math.round((Date.now() - q.startedAt) / 1000), total * 90);
      var out = '<h1>Résultats</h1><div class="score" style="color:' + (p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--warn)' : 'var(--alert)') + '">' + correct + ' / ' + total + ' · ' + p + ' %</div>';
      if (concours) out += '<p class="small muted mono">Temps utilisé : ' + clock(used) + ' sur ' + clock(total * 90) + '</p>';
      out += '<p class="muted">' + esc(verdict(p)) + '</p>';
      if (q.limited) out += banner('info', 'Questions gratuites seulement', 'Abonne-toi pour accéder à toutes les questions et à tous les systèmes.');
      if (missed.length) {
        out += '<section class="stack"><h2>Corrections (' + missed.length + ')</h2>' + missed.map(function (m) {
          var mine = q.answers[m.i];
          return '<div class="card stack"><span class="label">Question ' + (m.i + 1) + ' · ' + esc(sysLabel(m.x.system)) + '</span><p>' + esc(m.x.prompt) + '</p>' +
            '<p class="small" style="color:var(--alert)">✗ Ta réponse : ' + (mine === null ? 'aucune' : esc(m.x.options[mine])) + '</p>' +
            '<p class="small" style="color:var(--ok)">✓ Bonne réponse : ' + esc(m.x.options[m.x.correct]) + '</p><p class="small">' + esc(m.x.explanation) + '</p></div>';
        }).join('') + '</section>';
      } else out += banner('ok', '', 'Aucune erreur. Bravo !');
      if (review.length) out += '<section class="stack"><h2>Fiches à relire</h2>' + review.map(function (id) { var f = ficheById(id); return f ? '<button class="btn sec" data-act="fiche" data-id="' + esc(id) + '">' + esc(f.title) + '</button>' : ''; }).join('') + '</section>';
      if (q.limited) out += '<button class="btn" data-act="plans">Voir les offres</button>';
      return out + '<button class="btn ' + (q.limited ? 'sec' : '') + '" data-act="quiz-again">Nouvelle série</button><button class="btn sec" data-act="quiz-exit">Retour</button>';
    }
    var cur = q.qs[q.idx], chosen = q.answers[q.idx], last = q.idx === q.qs.length - 1;
    var head = '<div class="between"><span class="label">Question ' + (q.idx + 1) + ' sur ' + q.qs.length + '</span>' + (concours
      ? '<span id="clock" class="clock" role="timer" aria-label="Temps restant">' + clock(Math.ceil((q.endAt - Date.now()) / 1000)) + '</span>' : badge(cur.systemLabel || sysLabel(cur.system), 'info')) + '</div>';
    var out2 = head + progress(q.idx + ((q.revealed || (concours && chosen !== null)) ? 1 : 0), q.qs.length) +
      (q.limited && q.idx === 0 ? banner('info', '', 'Questions gratuites. L’abonnement débloque toute la banque.') : '') +
      '<p class="q-prompt">' + esc(cur.prompt) + '</p>' + options(cur.options, chosen, cur.correct, !concours && q.revealed, 'quiz-pick');
    if (!concours && q.revealed) {
      var f = ficheById(cur.ficheId);
      out2 += '<div id="fb" class="stack">' + banner(chosen === cur.correct ? 'ok' : 'alert', chosen === cur.correct ? 'Bonne réponse' : 'Pas tout à fait', esc(cur.explanation)) +
        (f ? '<button class="btn sec" data-act="fiche" data-id="' + esc(f.id) + '">Relire : ' + esc(f.title) + '</button>' : '') +
        '<button class="btn" data-act="quiz-next">' + (last ? 'Voir les résultats' : 'Question suivante') + '</button></div>';
    }
    if (concours) {
      out2 += '<div class="btn-row"><button class="btn sec" data-act="quiz-prev"' + (q.idx === 0 ? ' disabled' : '') + '>Précédent</button><button class="btn sec" data-act="quiz-skip"' + (last ? ' disabled' : '') + '>Suivant</button></div>' +
        (S.quiz.confirm ? banner('warn', '', q.answers.filter(function (a) { return a === null; }).length + ' question(s) sans réponse compteront comme fausses.') + '<div class="btn-row"><button class="btn sec" data-act="quiz-cancel">Continuer</button><button class="btn danger" data-act="quiz-finish-now">Terminer</button></div>'
          : '<button class="btn" data-act="quiz-finish">Terminer et voir la correction</button>');
    }
    return out2;
  }

  /* ---------- Cartes de révision ---------- */
  function buildDeck() {
    var now = Date.now(), deck = [];
    DATA.fiches.filter(canSee).forEach(function (f) {
      f.sections.forEach(function (s, i) { if (DECK_KINDS.indexOf(s.kind) !== -1) deck.push({ id: f.id + '#' + i, ficheTitle: f.title, heading: s.heading, items: s.items }); });
    });
    var due = deck.filter(function (c) { return !S.cards[c.id] || S.cards[c.id].dueAt <= now; })
      .sort(function (a, b) { return ((S.cards[a.id] || {}).dueAt || 0) - ((S.cards[b.id] || {}).dueAt || 0); });
    S.deck = { session: due.slice(0, 12), pos: 0, known: 0, flip: false, done: false, size: deck.length, due: due.length };
  }
  function viewCards() {
    var d = S.deck;
    if (!d.session.length) {
      return '<h1>Cartes de révision</h1>' + (d.size ? banner('ok', 'Tout est à jour', 'Aucune carte à réviser maintenant. Reviens demain : les cartes reviennent à intervalles espacés.')
        : banner('info', 'Aucune carte disponible', 'Les cartes viennent des fiches auxquelles tu as accès. Abonne-toi pour débloquer toutes les fiches.') + '<button class="btn" data-act="plans">Voir les offres</button>');
    }
    if (d.done) {
      return '<h1>Série terminée</h1>' + banner('ok', d.known + ' carte' + (d.known > 1 ? 's' : '') + ' sue' + (d.known > 1 ? 's' : '') + ' sur ' + d.session.length, 'Les cartes que tu connaissais reviendront plus tard ; les autres reviendront dès demain.') +
        (d.due > d.session.length ? '<p class="small muted">Il reste ' + (d.due - d.session.length) + ' carte(s) à réviser.</p>' : '') + '<button class="btn" data-act="cards-again">Nouvelle série</button><button class="btn sec" data-act="back">Retour</button>';
    }
    var c = d.session[d.pos];
    return '<span class="label">Carte ' + (d.pos + 1) + ' sur ' + d.session.length + '</span>' + progress(d.pos, d.session.length) +
      '<div class="card stack">' + badge(c.ficheTitle, 'info') + '<h2>' + esc(c.heading) + '</h2>' +
      (d.flip ? bullets(c.items) : '<p class="small muted">Essaie de t’en souvenir à voix haute avant de voir la réponse.</p>') + '</div>' +
      (d.flip ? '<div class="btn-row"><button class="btn sec" data-act="card-rate" data-ok="0">À revoir</button><button class="btn" data-act="card-rate" data-ok="1">Je le savais</button></div>' : '<button class="btn" data-act="card-flip">Voir la réponse</button>');
  }

  /* ---------- Listes de vérification ---------- */
  function viewChecks() {
    var list = DATA.fiches.filter(function (f) { return stepsCount(f) > 0; });
    return '<p class="muted">Entraîne-toi à voix haute ou sur un camarade, comme devant un examinateur, puis coche ce que tu as réellement fait.</p><div class="stack">' + list.map(function (f) {
      var b = best('check:' + f.id);
      return '<button class="card" data-act="check" data-id="' + esc(f.id) + '"><span class="between"><h3>' + esc(f.title) + '</h3><span>' + access(f) + '</span></span><span class="row" style="margin-top:8px">' + badge(stepsCount(f) + ' gestes', 'info') + (b !== null ? badge('Meilleur score : ' + b + ' %', b >= 80 ? 'ok' : 'warn') : '') + '</span></button>';
    }).join('') + '</div>';
  }
  function checkItems(f) { return f.sections.filter(function (s) { return s.kind === 'steps'; }).reduce(function (a, s) { return a.concat(s.items); }, []); }
  function viewCheck() {
    var f = ficheById(S.check.id), items = checkItems(f), c = S.check, done = c.done.filter(Boolean).length, p = pct(done, items.length);
    if (c.finished) {
      var forgotten = items.filter(function (_, i) { return !c.done[i]; });
      return '<h1>Bilan</h1><div class="score" style="color:' + (p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--warn)' : 'var(--alert)') + '">' + done + ' / ' + items.length + ' gestes · ' + p + ' %</div><p class="muted">' + esc(verdict(p)) + '</p>' +
        (forgotten.length ? '<section class="stack"><h2>Gestes oubliés</h2>' + bullets(forgotten) + '</section>' : banner('ok', '', 'Aucun oubli. Bravo !')) +
        '<button class="btn sec" data-act="check-again">Recommencer</button><button class="btn sec" data-act="fiche" data-id="' + esc(f.id) + '">Relire la fiche</button><button class="btn" data-act="back">Retour</button>';
    }
    return '<span class="label">' + done + ' geste' + (done > 1 ? 's' : '') + ' coché' + (done > 1 ? 's' : '') + ' sur ' + items.length + '</span><p class="muted">Coche chaque geste que tu as réellement réalisé ou dit à voix haute. Sois honnête : c’est ta préparation.</p><div class="stack">' +
      items.map(function (t, i) {
        return '<button class="check" role="checkbox" aria-checked="' + !!c.done[i] + '" data-act="check-toggle" data-i="' + i + '"><span class="bx">' + IC.tick + '</span><span>' + esc(t) + '</span></button>';
      }).join('') + '</div><button class="btn" data-act="check-finish">Terminer et voir le bilan</button>';

  /* ---------- Rendu ---------- */
  function render(top) {
    if (!S.accepted) { app.innerHTML = viewGate(); if (top) window.scrollTo(0, 0); return; }
    var r = S.route, body = '';
    switch (r.n) {
      case 'tab': body = S.tab === 'fiches' ? viewFiches() : S.tab === 'train' ? viewTrain() : viewProfile(); break;
      case 'fiche': body = viewFiche(ficheById(r.id)); break;
      case 'plans': body = viewPlans(); break;
      case 'admin': body = viewAdmin(); break;
      case 'cases': body = viewCases(); break;
      case 'case': body = viewCase(); break;
      case 'quizsetup': body = viewQuizSetup(); break;
      case 'quiz': body = viewQuiz(); break;
      case 'cards': body = viewCards(); break;
      case 'checks': body = viewChecks(); break;
      case 'check': body = viewCheck(); break;
      case 'sources': body = viewSources(); break;
      case 'about': body = viewAbout(); break;
      default: body = '';
    }
    app.innerHTML = appbar(r) + '<main>' + body + '</main>' + (r.n === 'tab' ? tabbar() : '');
    if (top) window.scrollTo(0, 0);
  }

    'quiz-pick': function (d) {
      var q = S.quiz; if (!q || q.done) return;
      if (q.mode !== 'concours') { if (q.revealed) return; q.answers[q.idx] = +d.i; q.revealed = true; render(false); revealFeedback(); }
      else { q.answers[q.idx] = +d.i; render(false); }
    },
    'quiz-next': function () { var q = S.quiz; q.revealed = false; if (q.idx >= q.qs.length - 1) finishQuiz(); else { q.idx += 1; render(true); } },
    'quiz-prev': function () { S.quiz.idx = Math.max(0, S.quiz.idx - 1); render(true); },
    'quiz-skip': function () { S.quiz.idx = Math.min(S.quiz.qs.length - 1, S.quiz.idx + 1); render(true); },
    'quiz-finish': function () {
      var q = S.quiz; if (q.answers.every(function (a) { return a !== null; })) finishQuiz(); else { q.confirm = true; render(false); }
    },
    'quiz-cancel': function () { S.quiz.confirm = false; render(false); },
    'quiz-finish-now': function () { S.quiz.confirm = false; finishQuiz(); },
    'quiz-again': function () { startQuiz(); },
    'quiz-exit': function () { stopTimer(); S.stack = []; S.route = { n: 'tab' }; S.tab = 'train'; render(true); },
    /* cartes */
    'card-flip': function () { S.deck.flip = true; render(false); },
    'card-rate': function (d) {
      var dk = S.deck, c = dk.session[dk.pos], ok = d.ok === '1', st = S.cards[c.id];
      var box = ok ? Math.min((st ? st.box : 0) + 1, LEITNER.length - 1) : 0;
      S.cards[c.id] = { box: box, dueAt: Date.now() + LEITNER[box] * DAY }; store.set('cards', S.cards);
      if (ok) dk.known += 1;
      if (dk.pos + 1 >= dk.session.length) dk.done = true; else { dk.pos += 1; dk.flip = false; }
      render(true);
    },
    'cards-again': function () { buildDeck(); render(true); },
    /* listes de vérification */
    check: function (d) {
      var f = ficheById(d.id); if (!f) return;
      if (!canSee(f)) { nav({ n: 'plans', title: 'Abonnement' }); return; }
      S.check = { id: f.id, done: checkItems(f).map(function () { return false; }), finished: false };
      nav({ n: 'check', title: 'Examen clinique' });
    },
    'check-toggle': function (d) { S.check.done[+d.i] = !S.check.done[+d.i]; render(false); },
    'check-finish': function () {
      var c = S.check, f = ficheById(c.id); c.finished = true;
      addResult('checklist', 'check:' + f.id, f.title, c.done.filter(Boolean).length, c.done.length); render(true);
    },
    'check-again': function () { var f = ficheById(S.check.id); S.check = { id: f.id, done: checkItems(f).map(function () { return false; }), finished: false }; render(true); },
    /* profil */
    'reset-ask': function () { S.resetAsk = true; render(false); },
    'reset-no': function () { S.resetAsk = false; render(false); },
    'reset-yes': function () { S.history = []; S.cards = {}; store.set('history', []); store.set('cards', {}); S.resetAsk = false; render(false); }
  };

  app.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var fn = A[el.getAttribute('data-act')];
    if (fn) fn(el.dataset);
  });
  app.addEventListener('input', function (e) {
    var t = e.target; if (!t) return;
    if (t.id === 'q') {
      S.q = t.value;
      var box = document.getElementById('flist'); if (box) box.innerHTML = ficheListHtml();
    } else if (t.dataset && t.dataset.f) {
      S.form[t.dataset.f] = t.value;
      if (t.dataset.f === 'name' || t.dataset.f === 'phone') store.set('form', { name: S.form.name, phone: S.form.phone });
    }
  });

  render(true);
  (async function () {
    var raw = store.get('code', null);
    if (!raw || !subtle) return;
    try { await activate(raw); render(false); }
    catch (e) { if (e && e.code === 'expired' && e.info) { S.sub = { plan: e.info.plan, exp: e.info.exp, tag: e.info.tag }; render(false); } }
  })();
})();
</script>

</body></html>
